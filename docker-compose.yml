services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botalka
      POSTGRES_PASSWORD: botalka
      POSTGRES_DB: botalka
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botalka"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://botalka:botalka@db:5432/botalka
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./content:/content:ro"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    env_file: .env
    environment:
      # обращение из браузера, а не из контейнера — поэтому localhost
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # rewrites в Next не умеют апгрейд до WebSocket, поэтому матч ходит на бэкенд
      # напрямую. Куки общие: браузер не различает порты. В проде — wss через nginx.
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/duel
    ports: ["3000:3000"]
    volumes: ["./web:/app", "/app/node_modules", "/app/.next"]
    depends_on: [backend]
    command: npm run dev

volumes:
  pgdata:
