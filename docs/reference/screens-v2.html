document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0;font-size:29px;margin:0;\">Дуэли<\u002Fh1>\n    <p style=\"color:#7d7979;font-size:14.5px;margin:8px 0 0;max-width:620px;line-height:1.5;\">Вы оба решаете один и тот же набор задач. Побеждает тот, кто ответил верно больше раз; при равном счёте — кто справился быстрее.<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\">\n    <div style=\"background:#fff;border:1px solid rgba(20,23,28,.1);border-radius:14px;padding:16px;text-align:center;\">\n      <div style=\"font-family:'Nunito';font-weight:700;font-size:24px;\">14<\u002Fdiv>\n      <div style=\"color:#7d7979;font-size:12.5px;margin-top:2px;\">матчей сыграно<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(20,23,28,.1);border-radius:14px;padding:16px;text-align:center;\">\n      <div style=\"font-family:'Nunito';font-weight:700;font-size:24px;color:#0088b0;\">57%<\u002Fdiv>\n      <div style=\"color:#7d7979;font-size:12.5px;margin-top:2px;\">процент побед<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(20,23,28,.1);border-radius:14px;padding:16px;text-align:center;\">\n      <div style=\"font-family:'Nunito';font-weight:700;font-size:24px;color:#d6006c;\">3<\u002Fdiv>\n      <div style=\"color:#7d7979;font-size:12.5px;margin-top:2px;\">победы подряд сейчас<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;overflow:hidden;border-radius:20px;padding:38px 30px;text-align:center;color:#fff;background:#0088b0;\">\n    <div style=\"position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);\"><\u002Fdiv>\n    <div aria-hidden=\"true\" style=\"position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:999px;background:#d6006c;opacity:.28;\"><\u002Fdiv>\n    <div aria-hidden=\"true\" style=\"position:absolute;left:-60px;bottom:-90px;width:230px;height:230px;border-radius:999px;background:#fff;opacity:.14;\"><\u002Fdiv>\n\n    <div style=\"position:relative;\">\n      <span style=\"display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M7 4h10v6a5 5 0 0 1-10 0z\"><\u002Fpath><path d=\"M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4\"><\u002Fpath><\u002Fsvg>\n        Рейтинговый режим\n      <\u002Fspan>\n\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px;\">\n        <div style=\"width:56px;height:56px;border-radius:999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:700;font-size:17px;\">ТУ<\u002Fdiv>\n        <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"animation:glowPulse 2.4s ease-in-out infinite;border-radius:999px;\"><path d=\"M5 19 19 5M15 5h4v4M9 19H5v-4\"><\u002Fpath><\u002Fsvg>\n        <div style=\"width:56px;height:56px;border-radius:999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;\">?<\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family:'Nunito';font-weight:800;font-size:33px;margin:18px 0 0;\">Онлайн-матч<\u002Fh2>\n      <p style=\"max-width:460px;margin:10px auto 0;opacity:.92;font-size:14.5px;line-height:1.5;\">Соперника подбираем по рейтингу. Семь раундов, вопрос приходит обоим одновременно, очко забирает тот, кто ответил верно и быстрее.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:12.5px;opacity:.75;\">Сейчас ищут соперника: 14<\u002Fp>\n\n      <sc-if value=\"{{ notSearching }}\" hint 5px;line-height:1.5;margin:0;\">Друг решает те же задачи когда ему удобно — быть онлайн одновременно не нужно. Рейтинг такие дуэли не меняют: их слишком легко подкрутить.<\u002Fp>\n\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <span style=\"color:#7d7979;font-size:13.5px;\">Раундов:<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:8px;background:#f2f5f8;border-radius:12px;padding:4px 6px;\">\n        <button sc-camel-on-click=\"{{ decRounds }}\" style=\"width:28px;height:28px;border:none;background:#fff;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#14171c\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <span style=\"font-family:'Nunito';font-weight:700;font-size:17px;width:26px;text-align:center;\">{{ rounds }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ incRounds }}\" style=\"width:28px;height:28px;border:none;background:#fff;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#14171c\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"color:#bab6b6;font-size:12px;\">от 3 до 30<\u002Fspan>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#7d7979;margin-bottom:8px;\">Позвать напрямую<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ friends }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ f.select }}\" style=\"border:1.5px solid {{ f.borderColor }};background:{{ f.bg }};color:{{ f.textColor }};border-radius:999px;padding:6px 16px 6px 8px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;\">\n            <span style=\"width:22px;height:22px;border-radius:999px;background:{{ f.avatarBg }};display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;\">{{ f.initials }}<\u002Fspan>\n            {{ f.name }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"color:#bab6b6;font-size:12px;margin:8px 0 0;\">Вызов появится у друга в профиле — ссылку отправлять не нужно.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <button sc-camel-on-click=\"{{ createDuel }}\" style=\"background:#d6006c;color:#fff;border:none;border-radius:14px;padding:11px 22px;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:8px;\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 19 19 5M15 5h4v4M9 19H5v-4\"><\u002Fpath><\u002Fsvg>\n        {{ createLabel }}\n      <\u002Fbutton>\n      <sc-if value=\"{{ noFriendSelected }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"color:#bab6b6;font-size:12px;\">получишь ссылку, которую можно кинуть кому угодно<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;\">\n      <h2 style=\"font-family:'Nunito';font-weight:700;font-size:19px;margin:0;\">Мои дуэли<\u002Fh2>\n      <span style=\"color:#7d7979;font-size:13px;\">8 побед из 14<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <sc-for list=\"{{ myDuels }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid rgba(20,23,28,.1);border-radius:16px;padding:14px 18px;di wned: false, equipped: false, previewStyle: \"background:#f2f5f8;border:2px solid #d6006c;box-shadow:0 0 14px #d6006c, inset 0 0 8px #d6006c;color:#14171c;font-size:12.5px;\", previewLabel: \"неон\" },\n  ],\n  bg: [\n    { code: \"b0\", title: \"Нет\", rarity: \"common\", price: 0, owned: true, equipped: false, previewStyle: \"background:#f2f5f8;border:2px dashed #bab6b6;color:#7d7979;font-size:12.5px;\", previewLabel: \"обычный\" },\n    { code: \"b1\", title: \"Мягкий градиент\", rarity: \"rare\", price: 260, owned: true, equipped: false, previewStyle: \"background:linear-gradient(135deg,#e9f8ff,#fff1f4);color:#14171c;font-size:12.5px;\", previewLabel: \"фон\" },\n    { code: \"b2\", title: \"Аврора\", rarity: \"epic\", price: 600, owned: true, equipped: true, previewStyle: \"background-image:linear-gradient(120deg,#0088b0,#7c3aed,#d6006c,#0088b0);background-size:300% 300%;animation:auroraDrift 8s ease infinite;color:#fff;font-size:12.5px;\", previewLabel: \"фон\" },\n    { code: \"b3\", title: \"Уголь\", rarity: \"epic\", price: 500, owned: false, equipped: false, previewStyle: \"background:linear-gradient(135deg,#3a3a3a,#101010);color:#fff;font-size:12.5px;\", previewLabel: \"фон\" },\n  ],\n};\n\nclass Component extends DCLogic {\n  state = {\n    tab: \"profile\",\n    sound: true,\n    shopCat: \"avatar\",\n    board: \"rating\",\n    rounds: 7,\n    selectedFriend: null,\n    searchState: \"idle\",\n    shopItems: JSON.parse(JSON.stringify(SHOP_ITEMS)),\n    quizPicks: {},\n    quizExpanded: false,\n    friendCode: \"\",\n    suggestSent: false,\n  };\n\n  goProfile = () => this.setState({ tab: \"profile\" });\n  goDuels = () => this.setState({ tab: \"duels\" });\n  goShop = () => this.setState({ tab: \"shop\" });\n  goLeaderboard = () => this.setState({ tab: \"leaderboard\" });\n  goQuiz = () => this.setState({ tab: \"quiz\" });\n  goStats = () => this.setState({ tab: \"stats\" });\n  goMocks = () => this.setState({ tab: \"mocks\" });\n  goFriends = () => this.setState({ tab: \"friends\" });\n  goSuggest = () => this.setState({ tab: \"suggest\" });\n\n  bumpQuiz = (number, delta) => {\n    this.setState((s) => {\n      const cur = s.quizPicks[number] || 0;\n      const next = Math.max(0, Math.min(9, cur + delta));\n      const picks = { ...s.quizPicks, [number]: next };\n      return { quizPicks: picks };\n    });\n  };\n  toggleQuizExpand = () => this.setState((s) => ({ quizExpanded: !s.quizExpanded }));\n  setFriendCode = (v) => this.setState({ friendCode: v });\n  submitSuggest = () => {\n    this.setState({ suggestSent: true });\n    setTimeout(() => this.setState({ suggestSent: false }), 2600);\n  };\n  toggleSound = () => this.setState((s) => ({ sound: !s.sound }));\n\n  incRounds = () => this.setState((s) => ({ rounds: Math.min(30, s.rounds + 1) }));\n  decRounds = () => this.setState((s) => ({ rounds: Math.max(3, s.rounds - 1) }));\n  createDuel = () => this.setState({ tab: \"duels\" });\n\n  findOpponent = () => {\n    this.setState({ searchState: \"searching\" });\n    setTimeout(() => this.setState({ searchState: \"found\" }), 1100);\n  };\n  resetSearch = () => this.setState({ searchState: \"idle\" });\n\n  setBoardRating = () => this.setState({ board: \"rating\" });\n  setBoardWeek = () => this.setState({ board: \"week\" });\n\n  buyItem = (cat, code) => {\n    this.setState((s) => {\n      const items = { ...s.shopItems };\n      items[cat] = items[cat].map((it) => (it.code === code ? { ...it, owned: true } : it));\n      return { shopItems: items };\n    });\n  };\n  equipItem = (cat, code) => {\n    this.setState((s) => {\n      const items = { ...s.shopItems };\n      items[cat] = items[cat].map((it) => ({ ...it, equipped: it.code === code }));\n      return { shopItems: items };\n    });\n  };\n\n  renderVals() {\n    const s = this.state;\n    const navStyle = (key) => {\n      const active = s.tab === key;\n      return { bg: active ? \"#e9f8ff\" : \"transparent\", color: active ? \"#006786\" : \"#14171c\", weight: active ? 700 : 500 };\n    };\n\n    const metrics = [\n      { value: \"12\", unit: \"дней\", label: \"подряд · рекорд 19\", color: \"#14171c\" },\n      { value: \"6/20\", unit: \"\", label: \"получено достижений\", color: \"#14171c\" },\n      { value: \"2450\", unit: \"\", label: \"монет · +180 за неделю\", color: \"#14171c\" },\n      { value: \"64%\", unit: \"\", label: \"верных ответов\", color: \"#0088b0\" },\n      { value: \"412 / 231\", unit: \"\", label: \"верных и ошибочных ответов\", color: \"#14171c\" },\n    ];\n\n    const achievements = ACHIEVEMENTS.map((a) => {\n      const meta = RARITY_COLORS[a.rarity];\n      const percent = Math.min(100, Math.round((a.progress / a.target) * 100));\n      return {\n        ...a,\n        opacity: a.unlocked ? 1 : 0.72,\n        barColor: a.unlocked ? meta.color : \"#e3e7ea\",\n        iconBg: a.unlocked ? meta.bg : \"#f2f5f8\",\n        rarityColor: meta.color,\n        rarityLabel: { bronze: \"бронза\", silver: \"серебро\", gold: \"золото\" }[a.rarity],\n        barVisibility: a.unlocked ? \"hidden\" : \"visible\",\n        percent,\n      };\n    });\n\n    const dayNames = [\"14 июля\",\"15 июля\",\"16 июля\",\"17 июля\",\"18 июля\",\"19 июля\",\"20 июля\",\"21 июля\",\"22 июля\",\"23 июля\",\"24 июля\",\"25 июля\",\"26 июля\",\"27 июля\",\"28 июля\",\"29 июля\",\"30 июля\",\"31 июля\",\"1 авг\",\"2 авг\",\"3 авг\",\"4 авг\",\"5 авг\",\"6 авг\",\"7 авг\",\"8 авг\",\"9 авг\",\"10 авг\",\"11 авг\",\"12 авг\"];\n    const max = Math.max(1, ...ACTIVITY_SOLVED);\n    const activityDays = ACTIVITY_SOLVED.map((n, i) => {\n      const level = n === 0 ? 0 : Math.ceil((n / max) * 3);\n      const bg = [\"#f2f5f8\", \"#cbeeff\", \"#99e0ff\", \"#0088b0\"][level];\n      return { bg, title: `${dayNames[i]} — решено ${n}` };\n    });\n\n    const friends = FRIENDS.map((f) => {\n      const sel = s.selectedFriend === f.id;\n      return {\n        ...f,\n        select: () => this.setState({ selectedFriend: sel ? null : f.id }),\n        bg: sel ? \"#0088b0\" : \"#fff\",\n        textColor: sel ? \"#fff\" : \"#14171c\",\n        borderColor: sel ? \"#0088b0\" : \"rgba(20,23,28,.15)\",\n      };\n    });\n    const selectedFriendObj = FRIENDS.find((f) => f.id === s.selectedFriend);\n\n    const OUTCOME = { win: { label: \"победа\", bg: \"#e9f8ff\", color: \"#006786\" }, loss: { label: \"поражение\", bg: \"#fff1f4\", color: \"#d6006c\" } };\n    const myDuels = MY_DUELS.map((d) => ({ ...d, outcomeBg: OUTCOME[d.outcome].bg, outcomeColor: OUTCOME[d.outcome].color, score: d.outcome === \"win\" ? \"5 : 2\" : \"2 : 5\" }));\n\n    const shopCats = SHOP_CATS.map((c) => {\n      const active = s.shopCat === c.key;\n      return { ...c, select: () => this.setState({ shopCat: c.key }), bg: active ? \"#0088b0\" : \"#fff\", color: active ? \"#fff\" : \"#14171c\", borderColor: active ? \"#0088b0\" : \"rgba(20,23,28,.15)\", weight: active ? 700 : 500 };\n    });\n\n    const shopItems = s.shopItems[s.shopCat].map((it) => {\n      const meta = RARITY_META[it.rarity];\n      const cantAfford = !it.owned && s.coins < it.price;\n      return {\n        ...it,\n        rarityColor: meta.color,\n        rarityLabel: meta.label,\n        glowShadow: it.equipped ? `0 0 0 3px ${meta.color}22` : \"none\",\n        buttonLabel: it.equipped ? \"Надето\" : it.owned ? \"Надеть\" : it.price === 0 ? \"Забрать\" : `${it.price} монет`,\n        buy: () => this.buyItem(s.shopCat, it.code),\n        equip: () => this.equipItem(s.shopCat, it.code),\n        cantAfford,\n        notOwned: !it.owned,\n      };\n    });\n    const coins = 2450 - s.shopItems[s.shopCat].filter((i) => i.owned && i.price > 0 && !SHOP_ITEMS[s.shopCat].find((o) => o.code === i.code).owned).reduce((a, i) => a + i.price, 0);\n\n    const LB_RATING = [\n      { place: 1, name: \"Быстрый\", initials: \"Б\", avatarBg: \"#7c3aed\", rating: 1012, matches: 1, wins: 1, isYou: false },\n      { place: 2, name: \"Соперник Бот\", initials: \"СБ\", avatarBg: \"#0088b0\", rating: 1012, matches: 1, wins: 1, isYou: false },\n      { place: 3, name: \"Тестовый ученик\", initials: \"ТУ\", avatarBg: \"#0088b0\", rating: 996, matches: 2, wins: 1, isYou: true },\n      { place: 4, name: \"Тестовый ученик 2\", initials: \"ТУ\", avatarBg: \"#c98a00\", rating: 992, matches: 3, wins: 1, isYou: false },\n      { place: 5, name: \"Медленный\", initials: \"М\", avatarBg: \"#c98a00\", rating: 988, matches: 1, wins: 0, isYou: false },\n    ];\n    const leaderboardRows = LB_RATING.map((r) => ({ ...r, rowBg: r.isYou ? \"#e9f8ff\" : \"transparent\", placeWeight: r.place <= 3 ? 700 : 400 }));\n\n    const shownTypes = s.quizExpanded ? QUIZ_TYPES : QUIZ_TYPES.slice(0, 5);\n    const quizTypes = shownTypes.map((t) => {\n      const picked = s.quizPicks[t.number] || 0;\n      return {\n        ...t,\n        picked,\n        pickedLabel: picked > 0 ? `${picked}` : \"0\",\n        rowBg: picked > 0 ? \"#e9f8ff\" : \"#fff\",\n        rowBorder: picked > 0 ? \"#0088b0\" : \"rgba(20,23,28,.1)\",\n        accColor: t.accuracy < 25 ? \"#d6006c\" : t.accuracy < 50 ? \"#c98a00\" : \"#1f9d55\",\n        inc: () => this.bumpQuiz(t.number, 1),\n        dec: () => this.bumpQuiz(t.number, -1),\n      };\n    });\n    const quizTotal = Object.values(s.quizPicks).reduce((a, b) => a + b, 0);\n\n    const maxMonth = Math.max(1, ...MONTHS_STATS.map((m) => m.solved));\n    const bestMonthSolved = maxMonth;\n    const statsMonths = MONTHS_STATS.map((m) => {\n      const isBest = m.solved === bestMonthSolved;\n      return {\n        ...m,\n        h: Math.max(6, Math.round((m.solved / maxMonth) * 130)),\n        barBg: isBest ? \"linear-gradient(180deg,#ff8fc0,#d6006c)\" : \"linear-gradient(180deg,#5fd4f2,#0088b0)\",\n        barShadow: isBest ? \"0 6px 14px rgba(214,0,108,.28)\" : \"0 4px 10px rgba(0,136,176,.18)\",\n        labelColor: isBest ? \"#d6006c\" : \"#14171c\",\n        mWeight: isBest ? 700 : 500,\n      };\n    });\n    const maxHour = Math.max(1, ...HOURS_STATS);\n    const statsHours = HOURS_STATS.map((v, i) => ({ h: Math.max(3, Math.round((v / maxHour) * 80)), showLabel: i % 6 === 0, hour: i, hourLabel: `${i}:00`, bg: v >= maxHour * 0.75 ? \"#0088b0\" : v ? \"#99e0ff\" : \"#e3e7ea\" }));\n    const worstTopics = WORST_TOPICS.map((t) => {\n      const barColor = t.accuracy >= 70 ? \"#1f9d55\" : t.accuracy >= 40 ? \"#c98a00\" : \"#d6006c\";\n      const badgeBg = t.accuracy >= 70 ? \"#e8f6ee\" : t.accuracy >= 40 ? \"#fdf3dd\" : \"#fff1f4\";\n      return { ...t, barColor, badgeBg };\n    });\n\n    const mocks = MOCKS.map((m) => ({\n      ...m,\n      durationLabel: `${Math.floor(m.minutes / 60)} ч ${m.minutes % 60} мин`,\n      hasBest: m.best !== null,\n      ctaLabel: m.attempts > 0 && m.best === null ? \"Продолжить\" : \"Начать\",\n    }));\n\n    const friendsList = FRIEND_LIST.map((f) => ({ ...f, hasStreak: f.streak > 0 }));\n\n    const suggestions = SUGGESTIONS.map((sg) => {\n      const meta = { pending: { label: \"на проверке\", color: \"#7d7979\", bg: \"#f2f5f8\" }, approved: { label: \"взяли в банк\", color: \"#006786\", bg: \"#e9f8ff\" } }[sg.status];\n      return { ...sg, statusLabel: meta.label, statusColor: meta.color, statusBg: meta.bg };\n    });\n\n    return {\n      isProfile: s.tab === \"profile\",\n      isDuels: s.tab === \"duels\",\n      isShop: s.tab === \"shop\",\n      isLeaderboard: s.tab === \"leaderboard\",\n      isQuiz: s.tab === \"quiz\",\n      isStats: s.tab === \"stats\",\n      isMocks: s.tab === \"mocks\",\n      isFriends: s.tab === \"friends\",\n      isSuggest: s.tab === \"suggest\",\n      navProfile: navStyle(\"profile\"),\n      navDuels: navStyle(\"duels\"),\n      navShop: navStyle(\"shop\"),\n      navLeaderboard: navStyle(\"leaderboard\"),\n      navQuiz: navStyle(\"quiz\"),\n      navStats: navStyle(\"stats\"),\n      navMocks: navStyle(\"mocks\"),\n      navFriends: navStyle(\"friends\"),\n      navSuggest: navStyle(\"suggest\"),\n      goProfile: this.goProfile,\n      goDuels: this.goDuels,\n      goShop: this.goShop,\n      goLeaderboard: this.goLeaderboard,\n      goQuiz: this.goQuiz,\n      goStats: this.goStats,\n      goMocks: this.goMocks,\n      goFriends: this.goFriends,\n      goSuggest: this.goSuggest,\n      quizTypes,\n      quizTotal,\n      quizHasPicks: quizTotal > 0,\n      quizExpanded: s.quizExpanded,\n      toggleQuizExpand: this.toggleQuizExpand,\n      quizExpandLabel: s.quizExpanded ? \"Свернуть\" : `Показать все ${QUIZ_TYPES.length} тем`,\n      statsMonths,\n      statsHours,\n      worstTopics,\n      mocks,\n      friendsList,\n      incomingRequests: INCOMING_REQUESTS,\n      hasIncoming: INCOMING_REQUESTS.length > 0,\n      friendCode: s.friendCode,\n      setFriendCode: (e) => this.setFriendCode(e.target.value.toUpperCase()),\n      suggestions,\n      suggestSent: s.suggestSent,\n      submitSuggest: this.submitSuggest,\n      toggleSound: this.toggleSound,\n      soundLabel: s.sound ? \"вкл\" : \"выкл\",\n      soundPillBg: s.sound ? \"#e9f8ff\" : \"rgba(20,23,28,.1)\",\n      soundPillColor: s.sound ? \"#006786\" : \"#7d7979\",\n      soundIconColor: s.sound ? \"#0088b0\" : \"#7d7979\",\n      metrics,\n      mistakeRingOffset: 314 * (1 - 22 / 38),\n      achievements,\n      activityDays,\n      notSearching: s.searchState === \"idle\",\n      searching: s.searchState === \"searching\",\n      opponentFound: s.searchState === \"found\",\n      findOpponent: this.findOpponent,\n      resetSearch: this.resetSearch,\n      rounds: s.rounds,\n      incRounds: this.incRounds,\n      decRounds: this.decRounds,\n      friends,\n      noFriendSelected: !selectedFriendObj,\n      createLabel: selectedFriendObj ? `Вызвать: ${selectedFriendObj.name}` : \"Создать вызов\",\n      createDuel: this.createDuel,\n      myDuels,\n      shopCats,\n      shopItems,\n      coins: 2450,\n      setBoardRating: this.setBoardRating,\n      setBoardWeek: this.setBoardWeek,\n      ratingTabBg: s.board === \"rating\" ? \"#0088b0\" : \"#fff\",\n      ratingTabColor: s.board === \"rating\" ? \"#fff\" : \"#14171c\",\n      ratingTabBorder: s.board === \"rating\" ? \"#0088b0\" : \"rgba(20,23,28,.15)\",\n      weekTabBg: s.board === \"week\" ? \"#0088b0\" : \"#fff\",\n      weekTabColor: s.board === \"week\" ? \"#fff\" : \"#14171c\",\n      weekTabBorder: s.board === \"week\" ? \"#0088b0\" : \"rgba(20,23,28,.15)\",\n      boardSubtitle: s.board === \"rating\" ? \"Рейтинг растёт только в онлайн-матчах — квизы и дуэли по ссылке на него не влияют.\" : \"Сколько разных задач решено верно за последние семь дней.\",\n      leaderboardRows,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
