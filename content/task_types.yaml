# Типы заданий = номера в КИМ. Сверено со структурой ЕГЭ-2026 по профильной
# математике: 19 заданий, часть 1 — №1–12 (краткий ответ), часть 2 — №13–19.
# При смене спецификации заводить новый year_spec, а не править этот файл.

math_prof:
  1:
    title: Планиметрия
    description: Треугольники, окружности, четырёхугольники — вычисление элементов
  2:
    title: Векторы
    description: Координаты, длина, скалярное произведение
  3:
    title: Стереометрия
    description: Объёмы и площади поверхностей многогранников и тел вращения
  4:
    title: Простая вероятность
    description: Классическое определение вероятности
  5:
    title: Сложная вероятность
    description: Независимые и условные события, теоремы сложения и умножения
  6:
    title: Уравнения
    description: Показательные, логарифмические, иррациональные, рациональные
  7:
    title: Вычисления и преобразования
    description: Степени, логарифмы, тригонометрия
  8:
    title: Производная
    description: Смысл производной, касательная к графику
  9:
    title: Прикладная задача
    description: Задача с готовой формулой из физики или экономики
  10:
    title: Текстовая задача
    description: Движение, работа, проценты, смеси и сплавы
  11:
    title: Графики функций
    description: Восстановление параметров функции по её графику или точкам
  12:
    title: Анализ функций
    description: Наибольшее и наименьшее значение функции
