subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $13$, $20$ и $21$. Найдите его площадь.
answer:
  type: number
  value: '126'
solution: |
  Полупериметр $p=\dfrac{13+20+21}{2}=27$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{27\cdot14\cdot7\cdot6}=126$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
