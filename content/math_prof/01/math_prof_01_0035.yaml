id: math_prof_01_0035
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $5$, $5$ и $6$. Найдите его площадь.
answer:
  type: number
  value: '12'
solution: |
  Полупериметр $p=\dfrac{5+5+6}{2}=8$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{8\cdot3\cdot3\cdot2}=12$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
