id: math_prof_01_0023
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $5$ и $12$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '2'
solution: |
  Гипотенуза $c=\sqrt{5^2+12^2}=13$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{5+12-13}{2}=2$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
