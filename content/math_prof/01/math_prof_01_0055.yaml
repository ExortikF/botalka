id: math_prof_01_0055
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $10$ и $20$, а высота равна $3$. Найдите её площадь.
answer:
  type: number
  value: '45'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{10+20}{2}\cdot 3=15\cdot 3=45$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
source:
