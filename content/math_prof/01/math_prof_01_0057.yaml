subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $18$ и $28$, а высота равна $9$. Найдите её площадь.
answer:
  type: number
  value: '207'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{18+28}{2}\cdot 9=23\cdot 9=207$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
