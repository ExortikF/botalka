statement: |
  Четырёхугольник $ABCD$ вписан в окружность. Угол $ABC$ равен $98°$ , угол $CAD$ равен $44°$ . Найдите угол $ABD$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc8DAA2BCFA853B0114622496179F36C6C_1_1478531292.png
answer:
  type: number
  value: "54"
solution: |
  Углы $DBC$ и $CAD$ опираются на одну дугу $DC$, значит $\angle DBC=44°$.
  Тогда $\angle ABD=\angle ABC-\angle DBC=98°-44°=54°$.
