id: math_prof_01_0048
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Периметр прямоугольника равен $48$, а одна из его сторон равна $10$. Найдите площадь прямоугольника.
answer:
  type: number
  value: '140'
solution: |
  Полупериметр равен $24$, значит вторая сторона равна $24-10=14$. Площадь: $10\cdot 14=140$.
hints:
  - 'Полупериметр — это сумма двух соседних сторон.'
