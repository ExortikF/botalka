id: math_prof_01_0054
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $4$ и $10$, а высота равна $6$. Найдите её площадь.
answer:
  type: number
  value: '42'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{4+10}{2}\cdot 6=7\cdot 6=42$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
