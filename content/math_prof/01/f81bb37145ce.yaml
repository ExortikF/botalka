statement: |
  В четырёхугольник $ABCD$ вписана окружность, $AB=10, CD=17.$ Найдите периметр четырёхугольника $ABCD.$
image: math_prof/img/xs3qstsrc503042DF3344851740A42CB126687533_1_1642423499.png
answer:
  type: number
  value: "54"
solution: |
  Суммы противоположных сторон равны: $10+17=27$. Периметр складывается из двух таких сумм: $2\cdot 27=54$.
