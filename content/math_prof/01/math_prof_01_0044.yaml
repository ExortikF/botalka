id: math_prof_01_0044
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Периметр прямоугольника равен $30$, а одна из его сторон равна $8$. Найдите площадь прямоугольника.
answer:
  type: number
  value: '56'
solution: |
  Полупериметр равен $15$, значит вторая сторона равна $15-8=7$. Площадь: $8\cdot 7=56$.
hints:
  - 'Полупериметр — это сумма двух соседних сторон.'
