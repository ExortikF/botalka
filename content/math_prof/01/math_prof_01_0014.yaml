id: math_prof_01_0014
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $15$ и $36$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '6'
solution: |
  Гипотенуза $c=\sqrt{15^2+36^2}=39$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{15+36-39}{2}=6$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
