id: math_prof_01_0016
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $9$ и $40$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '4'
solution: |
  Гипотенуза $c=\sqrt{9^2+40^2}=41$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{9+40-41}{2}=4$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
