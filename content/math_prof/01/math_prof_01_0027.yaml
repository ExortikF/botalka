subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $13$, $13$ и $24$. Найдите его площадь.
answer:
  type: number
  value: '60'
solution: |
  Полупериметр $p=\dfrac{13+13+24}{2}=25$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{25\cdot12\cdot12\cdot1}=60$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
