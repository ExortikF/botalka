id: math_prof_01_0021
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $21$ и $72$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '9'
solution: |
  Гипотенуза $c=\sqrt{21^2+72^2}=75$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{21+72-75}{2}=9$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
