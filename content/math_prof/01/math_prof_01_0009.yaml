id: math_prof_01_0009
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 21$, $BC = 72$. Найдите $AB$.
answer:
  type: number
  value: '75'
solution: |
  По теореме Пифагора $AB=\sqrt{21^2+72^2}=\sqrt{441+5184}=\sqrt{5625}=75$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
