id: math_prof_01_0056
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $6$ и $14$, а высота равна $4$. Найдите её площадь.
answer:
  type: number
  value: '40'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{6+14}{2}\cdot 4=10\cdot 4=40$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
