statement: |
  Четырёхугольник $ABCD$ вписан в окружность. Угол $ABC$ равен $103°,$ угол $CAD$ равен $42°.$ Найдите угол $ABD.$ Ответ дайте в градусах.
image: math_prof/img/xs3qstsrcF104DEA45398B1E14966A839F40CC4F9_1_1699366675.png
answer:
  type: number
  value: "61"
solution: |
  Углы $DBC$ и $DAC$ вписанные и опираются на одну дугу $DC$, поэтому равны:
  $\angle DBC=42°$.
  Тогда $\angle ABD=\angle ABC-\angle DBC=103°-42°=61°$.
