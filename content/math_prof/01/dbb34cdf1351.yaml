statement: |
  Отрезки $AC$ и $BD —$ диаметры окружности
  с центром $O$ . Угол $AOD$ равен $130°$ . Найдите вписанный угол $ACB$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc8033F7C460D7A73F44BAF88790AF39F2_1_1507730941.png
answer:
  type: number
  value: "25"
solution: |
  Углы $AOD$ и $AOB$ смежные, так как $BD$ — диаметр: $\angle AOB=180°-130°=50°$. Вписанный угол вдвое меньше центрального, опирающегося на ту же дугу: $50°:2=25°$.
