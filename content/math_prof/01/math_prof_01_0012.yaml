id: math_prof_01_0012
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 10$, $BC = 24$. Найдите $AB$.
answer:
  type: number
  value: '26'
solution: |
  По теореме Пифагора $AB=\sqrt{10^2+24^2}=\sqrt{100+576}=\sqrt{676}=26$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
