id: math_prof_01_0030
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $15$, $15$ и $18$. Найдите его площадь.
answer:
  type: number
  value: '108'
solution: |
  Полупериметр $p=\dfrac{15+15+18}{2}=24$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{24\cdot9\cdot9\cdot6}=108$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
