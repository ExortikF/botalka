statement: |
  Отрезки $AC$ и $BD —$ диаметры окружности с центром $O$ . Угол $ACB$ равен $61°$ . Найдите угол $AOD$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc0E4F98C3F275983C453A3E437353C731_1_1509372816.png
answer:
  type: number
  value: "58"
solution: |
  Вписанный угол $ACB$ опирается на дугу $AB$, центральный вдвое больше: $\angle AOB=2\cdot 61°=122°$. Углы $AOB$ и $AOD$ смежные, потому что $BD$ — диаметр: $180°-122°=58°$.
