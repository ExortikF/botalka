id: math_prof_01_0002
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 9$, $BC = 12$. Найдите $AB$.
answer:
  type: number
  value: '15'
solution: |
  По теореме Пифагора $AB=\sqrt{9^2+12^2}=\sqrt{81+144}=\sqrt{225}=15$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
