id: math_prof_01_0002
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $6$ и $8$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '2'
solution: |
  Гипотенуза $c=\sqrt{6^2+8^2}=10$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{6+8-10}{2}=2$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
  kind: own
status: live
