statement: |
  Два угла вписанного в окружность четырёхугольника равны $59°$ и $102°.$ Найдите бо $�$ ьший из оставшихся углов. Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc1D3BC078A46C9ED24912C55F59B79C00_1_1699350951.png
answer:
  type: number
  value: "121"
solution: |
  У вписанного четырёхугольника суммы противоположных углов равны $180°$.
  Значит оставшиеся углы равны $180°-59°=121°$ и $180°-102°=78°$.
  Больший из них — $121°$.
