statement: |
  В треугольнике $ABC$ угол $C$ равен $90°$ , $AB=5$ , $BC=4$ . Найдите $\cos A$ .
image: math_prof/img/xs3qstsrc5C6AFE3F00A2A55840B947D3A51FA65B_1_1478531276.png
answer:
  type: number
  value: "0,6"
solution: |
  По теореме Пифагора $AC=\sqrt{AB^{2}-BC^{2}}=\sqrt{25-16}=3$.
  Косинус острого угла — прилежащий катет к гипотенузе:
  $\cos A=\frac{3}{5}=0{,}6$.
