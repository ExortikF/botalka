statement: |
  Четырёхугольник $ABCD$ вписан в окружность.
  Угол $ABC$ равен $120°,$ угол $ABD$ равен $43°.$ Найдите угол $CAD.$ Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc705E033DC6EF81AF43FD7EC4566A544F_2_1710152012.png
answer:
  type: number
  value: "77"
solution: |
  Сначала найдём угол $DBC$: $\angle DBC=\angle ABC-\angle ABD=120°-43°=77°$.
  Углы $CAD$ и $DBC$ вписанные и опираются на одну дугу $DC$, поэтому равны:
  $\angle CAD=77°$.
