statement: |
  Четырёхугольник $ABCD$ вписан в окружность. Угол $ABD$ равен $58°$ , угол $CAD$ равен $39°$ . Найдите угол $ABC$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc1652A3DA798087D6470756C88C9AE437_1_1537443056.gif
answer:
  type: number
  value: "97"
solution: |
  Углы $DBC$ и $CAD$ опираются на одну дугу $DC$, значит $\angle DBC=39°$. Угол $ABC$ складывается из двух: $58°+39°=97°$.
