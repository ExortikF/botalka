id: math_prof_01_0003
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 7$, $BC = 24$. Найдите $AB$.
answer:
  type: number
  value: '25'
solution: |
  По теореме Пифагора $AB=\sqrt{7^2+24^2}=\sqrt{49+576}=\sqrt{625}=25$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
