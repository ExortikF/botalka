statement: |
  Периметр прямоугольника равен $28$, а одна из его сторон равна $5$. Найдите площадь прямоугольника.
answer:
  type: number
  value: '45'
solution: |
  Полупериметр равен $14$, значит вторая сторона равна $14-5=9$. Площадь: $5\cdot 9=45$.
source: "собственная"
