id: math_prof_01_0007
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 15$, $BC = 36$. Найдите $AB$.
answer:
  type: number
  value: '39'
solution: |
  По теореме Пифагора $AB=\sqrt{15^2+36^2}=\sqrt{225+1296}=\sqrt{1521}=39$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
