id: math_prof_01_0034
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $12$, $16$ и $20$. Найдите его площадь.
answer:
  type: number
  value: '96'
solution: |
  Полупериметр $p=\dfrac{12+16+20}{2}=24$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{24\cdot12\cdot8\cdot4}=96$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
