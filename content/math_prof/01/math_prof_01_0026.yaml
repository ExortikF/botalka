statement: |
  Стороны треугольника равны $14$, $25$ и $25$. Найдите его площадь.
answer:
  type: number
  value: '168'
solution: |
  Полупериметр $p=\dfrac{14+25+25}{2}=32$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{32\cdot18\cdot7\cdot7}=168$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
