statement: |
  В четырёхугольник $ABCD$ вписана окружность, $AB=14, CD=17.$ Найдите периметр четырёхугольника $ABCD.$
image: math_prof/img/xs3qstsrcBC13BEABD8BAA90047C4A9EB9DF86235_1_1765457082.png
answer:
  type: number
  value: "62"
solution: |
  Если в четырёхугольник вписана окружность, то суммы противоположных сторон
  равны: $AB+CD=BC+AD=14+17=31$.
  Периметр складывается из этих двух сумм: $2\cdot 31=62$.
