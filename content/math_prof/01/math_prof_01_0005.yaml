id: math_prof_01_0005
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 16$, $BC = 30$. Найдите $AB$.
answer:
  type: number
  value: '34'
solution: |
  По теореме Пифагора $AB=\sqrt{16^2+30^2}=\sqrt{256+900}=\sqrt{1156}=34$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
