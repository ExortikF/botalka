id: math_prof_01_0018
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $14$ и $48$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '6'
solution: |
  Гипотенуза $c=\sqrt{14^2+48^2}=50$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{14+48-50}{2}=6$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
