statement: |
  В четырёхугольник $ABCD,$ периметр которого равен 24, вписана окружность, $AB=5.$ Найдите длину стороны $CD.$
image: math_prof/img/xs3qstsrcF6690ECEEF869E7244249F34A7698E44_1_1765457058.png
answer:
  type: number
  value: "7"
solution: |
  В четырёхугольник вписана окружность, значит суммы противоположных сторон
  равны: $AB+CD=BC+AD$. Каждая из этих сумм — половина периметра:
  $\frac{24}{2}=12$. Отсюда $CD=12-5=7$.
