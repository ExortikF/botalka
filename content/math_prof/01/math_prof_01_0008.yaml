id: math_prof_01_0008
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 60$, $BC = 63$. Найдите $AB$.
answer:
  type: number
  value: '87'
solution: |
  По теореме Пифагора $AB=\sqrt{60^2+63^2}=\sqrt{3600+3969}=\sqrt{7569}=87$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
