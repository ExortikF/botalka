id: math_prof_01_0020
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $10$ и $24$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '4'
solution: |
  Гипотенуза $c=\sqrt{10^2+24^2}=26$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{10+24-26}{2}=4$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
