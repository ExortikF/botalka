id: math_prof_01_0029
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $4$, $13$ и $15$. Найдите его площадь.
answer:
  type: number
  value: '24'
solution: |
  Полупериметр $p=\dfrac{4+13+15}{2}=16$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{16\cdot12\cdot3\cdot1}=24$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
