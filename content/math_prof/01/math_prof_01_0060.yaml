id: math_prof_01_0060
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $18$ и $20$, а высота равна $5$. Найдите её площадь.
answer:
  type: number
  value: '95'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{18+20}{2}\cdot 5=19\cdot 5=95$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
