statement: |
  В четырёхугольник $ABCD$ вписана окружность, $AB=9, CD=17.$ Найдите периметр четырёхугольника $ABCD.$
image: math_prof/img/xs3qstsrc3D0E62804E2FB53E43B47F0C3B58D0D6_1_1765457048.png
answer:
  type: number
  value: "52"
solution: |
  Суммы противоположных сторон равны: $9+17=26$. Периметр складывается из двух таких сумм: $2\cdot 26=52$.
