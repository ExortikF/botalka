id: math_prof_01_0011
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 24$, $BC = 45$. Найдите $AB$.
answer:
  type: number
  value: '51'
solution: |
  По теореме Пифагора $AB=\sqrt{24^2+45^2}=\sqrt{576+2025}=\sqrt{2601}=51$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
