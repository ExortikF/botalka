id: math_prof_01_0025
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $15$, $15$ и $24$. Найдите его площадь.
answer:
  type: number
  value: '108'
solution: |
  Полупериметр $p=\dfrac{15+15+24}{2}=27$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{27\cdot12\cdot12\cdot3}=108$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
