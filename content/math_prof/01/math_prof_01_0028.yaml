id: math_prof_01_0028
subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $16$, $17$ и $17$. Найдите его площадь.
answer:
  type: number
  value: '120'
solution: |
  Полупериметр $p=\dfrac{16+17+17}{2}=25$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{25\cdot9\cdot8\cdot8}=120$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
