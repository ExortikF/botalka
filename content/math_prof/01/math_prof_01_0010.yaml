id: math_prof_01_0010
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 8$, $BC = 15$. Найдите $AB$.
answer:
  type: number
  value: '17'
solution: |
  По теореме Пифагора $AB=\sqrt{8^2+15^2}=\sqrt{64+225}=\sqrt{289}=17$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
source:
