id: math_prof_01_0046
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Периметр прямоугольника равен $42$, а одна из его сторон равна $13$. Найдите площадь прямоугольника.
answer:
  type: number
  value: '104'
solution: |
  Полупериметр равен $21$, значит вторая сторона равна $21-13=8$. Площадь: $13\cdot 8=104$.
hints:
  - 'Полупериметр — это сумма двух соседних сторон.'
