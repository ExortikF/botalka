subject: math_prof
task_type: 1
difficulty: 3
statement: |
  Стороны треугольника равны $10$, $17$ и $21$. Найдите его площадь.
answer:
  type: number
  value: '84'
solution: |
  Полупериметр $p=\dfrac{10+17+21}{2}=24$. По формуле Герона $S=\sqrt{p(p-a)(p-b)(p-c)}=\sqrt{24\cdot14\cdot7\cdot3}=84$.
hints:
  - 'Посчитайте полупериметр и примените формулу Герона.'
source:
  kind: own
  ref: 'tpl:heron'
status: live
