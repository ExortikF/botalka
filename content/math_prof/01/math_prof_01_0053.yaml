id: math_prof_01_0053
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $12$ и $20$, а высота равна $9$. Найдите её площадь.
answer:
  type: number
  value: '144'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{12+20}{2}\cdot 9=16\cdot 9=144$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
