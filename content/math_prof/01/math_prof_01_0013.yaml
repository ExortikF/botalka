id: math_prof_01_0013
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $60$ и $63$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '18'
solution: |
  Гипотенуза $c=\sqrt{60^2+63^2}=87$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{60+63-87}{2}=18$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
