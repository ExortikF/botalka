id: math_prof_01_0004
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  В треугольнике $ABC$ угол $C$ равен $90^\circ$, $AC = 40$, $BC = 42$. Найдите $AB$.
answer:
  type: number
  value: '58'
solution: |
  По теореме Пифагора $AB=\sqrt{40^2+42^2}=\sqrt{1600+1764}=\sqrt{3364}=58$.
hints:
  - 'Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.'
