id: math_prof_01_0019
subject: math_prof
task_type: 1
difficulty: 2
statement: |
  Катеты прямоугольного треугольника равны $40$ и $42$. Найдите радиус вписанной в него окружности.
answer:
  type: number
  value: '12'
solution: |
  Гипотенуза $c=\sqrt{40^2+42^2}=58$. Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}=\dfrac{40+42-58}{2}=12$.
hints:
  - 'Сначала найдите гипотенузу.'
  - 'Для прямоугольного треугольника $r=\dfrac{a+b-c}{2}$.'
source:
