id: math_prof_01_0059
subject: math_prof
task_type: 1
difficulty: 1
statement: |
  Основания трапеции равны $16$ и $18$, а высота равна $11$. Найдите её площадь.
answer:
  type: number
  value: '187'
solution: |
  $S=\dfrac{a+b}{2}\cdot h=\dfrac{16+18}{2}\cdot 11=17\cdot 11=187$.
hints:
  - 'Площадь трапеции — полусумма оснований, умноженная на высоту.'
