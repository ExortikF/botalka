difficulty: 2
statement: |
  Найдите значение выражения $\log_{2}256-\log_{2}8$.
answer:
  type: number
  value: '5'
solution: |
  $\log_{2}256-\log_{2}8=\log_{2}\dfrac{256}{8}=\log_{2}32=5$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
