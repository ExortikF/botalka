statement: |
  Найдите значение выражения $\log_{2}40-\log_{2}5$.
answer:
  type: number
  value: '3'
solution: |
  $\log_{2}40-\log_{2}5=\log_{2}\dfrac{40}{5}=\log_{2}8=3$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
