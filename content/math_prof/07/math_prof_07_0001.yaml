statement: |
  Найдите значение выражения $\log_{3}45-\log_{3}5$.
answer:
  type: number
  value: '2'
solution: |
  $\log_{3}45-\log_{3}5=\log_{3}\dfrac{45}{5}=\log_{3}9=2$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
