difficulty: 2
statement: |
  Найдите значение выражения $\log_{5}750-\log_{5}6$.
answer:
  type: number
  value: '3'
solution: |
  $\log_{5}750-\log_{5}6=\log_{5}\dfrac{750}{6}=\log_{5}125=3$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
