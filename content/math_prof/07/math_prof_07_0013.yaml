statement: |
  Найдите значение выражения $\dfrac{3^{6}\cdot 3^{4}}{3^{4}}$.
answer:
  type: number
  value: '729'
solution: |
  $\dfrac{3^{6+4}}{3^{4}}=3^{10-4}=3^{6}=729$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
