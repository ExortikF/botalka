statement: |
  Найдите значение выражения $\log_{2}48-\log_{2}6$.
answer:
  type: number
  value: '3'
solution: |
  $\log_{2}48-\log_{2}6=\log_{2}\dfrac{48}{6}=\log_{2}8=3$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
