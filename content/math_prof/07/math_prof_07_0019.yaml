statement: |
  Найдите значение выражения $\dfrac{3^{6}\cdot 3^{3}}{3^{4}}$.
answer:
  type: number
  value: '243'
solution: |
  $\dfrac{3^{6+3}}{3^{4}}=3^{9-4}=3^{5}=243$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
