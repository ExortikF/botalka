statement: |
  Найдите значение выражения $\dfrac{5^{3}\cdot 5^{4}}{5^{3}}$.
answer:
  type: number
  value: '625'
solution: |
  $\dfrac{5^{3+4}}{5^{3}}=5^{7-3}=5^{4}=625$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
