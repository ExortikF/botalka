statement: |
  Найдите значение выражения $\dfrac{2^{7}\cdot 2^{3}}{2^{4}}$.
answer:
  type: number
  value: '64'
solution: |
  $\dfrac{2^{7+3}}{2^{4}}=2^{10-4}=2^{6}=64$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
