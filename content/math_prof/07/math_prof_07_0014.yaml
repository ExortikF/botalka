statement: |
  Найдите значение выражения $\dfrac{3^{5}\cdot 3^{4}}{3^{3}}$.
answer:
  type: number
  value: '729'
solution: |
  $\dfrac{3^{5+4}}{3^{3}}=3^{9-3}=3^{6}=729$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
