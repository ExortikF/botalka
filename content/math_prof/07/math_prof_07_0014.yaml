statement: |
  Найдите значение выражения $\dfrac{2^{4}\cdot 2^{2}}{2^{4}}$.
answer:
  type: number
  value: '4'
solution: |
  $\dfrac{2^{4+2}}{2^{4}}=2^{6-4}=2^{2}=4$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
