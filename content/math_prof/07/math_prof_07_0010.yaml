statement: |
  Найдите значение выражения $\log_{3}1701-\log_{3}7$.
answer:
  type: number
  value: '5'
solution: |
  $\log_{3}1701-\log_{3}7=\log_{3}\dfrac{1701}{7}=\log_{3}243=5$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
