statement: |
  Найдите значение выражения $\log_{2}80-\log_{2}5$.
answer:
  type: number
  value: '4'
solution: |
  $\log_{2}80-\log_{2}5=\log_{2}\dfrac{80}{5}=\log_{2}16=4$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
