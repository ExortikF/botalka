statement: |
  Найдите значение выражения $\log_{5}15625-\log_{5}5$.
answer:
  type: number
  value: '5'
solution: |
  $\log_{5}15625-\log_{5}5=\log_{5}\dfrac{15625}{5}=\log_{5}3125=5$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
