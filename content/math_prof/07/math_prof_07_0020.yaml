statement: |
  Найдите значение выражения $\dfrac{2^{3}\cdot 2^{2}}{2^{3}}$.
answer:
  type: number
  value: '4'
solution: |
  $\dfrac{2^{3+2}}{2^{3}}=2^{5-3}=2^{2}=4$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
