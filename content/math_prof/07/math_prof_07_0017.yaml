statement: |
  Найдите значение выражения $\dfrac{2^{6}\cdot 2^{5}}{2^{6}}$.
answer:
  type: number
  value: '32'
solution: |
  $\dfrac{2^{6+5}}{2^{6}}=2^{11-6}=2^{5}=32$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
