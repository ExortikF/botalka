statement: |
  Найдите значение выражения $\dfrac{2^{5}\cdot 2^{3}}{2^{2}}$.
answer:
  type: number
  value: '64'
solution: |
  $\dfrac{2^{5+3}}{2^{2}}=2^{8-2}=2^{6}=64$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
