statement: |
  Найдите значение выражения $\dfrac{2^{3}\cdot 2^{2}}{2^{4}}$.
answer:
  type: number
  value: '2'
solution: |
  $\dfrac{2^{3+2}}{2^{4}}=2^{5-4}=2^{1}=2$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
