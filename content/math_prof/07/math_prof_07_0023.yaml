statement: |
  Найдите значение выражения $\dfrac{3^{3}\cdot 3^{4}}{3^{2}}$.
answer:
  type: number
  value: '243'
solution: |
  $\dfrac{3^{3+4}}{3^{2}}=3^{7-2}=3^{5}=243$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
