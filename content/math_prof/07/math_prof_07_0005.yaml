statement: |
  Найдите значение выражения $\log_{3}63-\log_{3}7$.
answer:
  type: number
  value: '2'
solution: |
  $\log_{3}63-\log_{3}7=\log_{3}\dfrac{63}{7}=\log_{3}9=2$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
