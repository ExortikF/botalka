statement: |
  Найдите значение выражения $\log_{5}3750-\log_{5}6$.
answer:
  type: number
  value: '4'
solution: |
  $\log_{5}3750-\log_{5}6=\log_{5}\dfrac{3750}{6}=\log_{5}625=4$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
