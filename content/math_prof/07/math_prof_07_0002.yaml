statement: |
  Найдите значение выражения $\log_{3}162-\log_{3}2$.
answer:
  type: number
  value: '4'
solution: |
  $\log_{3}162-\log_{3}2=\log_{3}\dfrac{162}{2}=\log_{3}81=4$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
