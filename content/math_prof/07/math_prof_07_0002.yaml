statement: |
  Найдите значение выражения $\log_{2}16-\log_{2}2$.
answer:
  type: number
  value: '3'
solution: |
  $\log_{2}16-\log_{2}2=\log_{2}\dfrac{16}{2}=\log_{2}8=3$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
