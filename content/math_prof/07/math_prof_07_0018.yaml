statement: |
  Найдите значение выражения $\dfrac{3^{6}\cdot 3^{4}}{3^{6}}$.
answer:
  type: number
  value: '81'
solution: |
  $\dfrac{3^{6+4}}{3^{6}}=3^{10-6}=3^{4}=81$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
