statement: |
  Найдите значение выражения $\log_{3}324-\log_{3}4$.
answer:
  type: number
  value: '4'
solution: |
  $\log_{3}324-\log_{3}4=\log_{3}\dfrac{324}{4}=\log_{3}81=4$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
