statement: |
  Найдите значение выражения $\log_{5}1875-\log_{5}3$.
answer:
  type: number
  value: '4'
solution: |
  $\log_{5}1875-\log_{5}3=\log_{5}\dfrac{1875}{3}=\log_{5}625=4$.
hints:
  - 'Разность логарифмов с одним основанием — логарифм частного.'
