statement: |
  Найдите значение выражения $\dfrac{5^{7}\cdot 5^{2}}{5^{5}}$.
answer:
  type: number
  value: '625'
solution: |
  $\dfrac{5^{7+2}}{5^{5}}=5^{9-5}=5^{4}=625$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
