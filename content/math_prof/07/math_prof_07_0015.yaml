statement: |
  Найдите значение выражения $\dfrac{5^{3}\cdot 5^{4}}{5^{6}}$.
answer:
  type: number
  value: '5'
solution: |
  $\dfrac{5^{3+4}}{5^{6}}=5^{7-6}=5^{1}=5$.
hints:
  - 'При умножении степени складываются, при делении вычитаются.'
