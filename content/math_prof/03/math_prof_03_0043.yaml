id: math_prof_03_0043
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $9$ и $12$, боковое ребро равно $7$. Найдите объём призмы.
answer:
  type: number
  value: '378'
solution: |
  Площадь основания $S=\dfrac{9\cdot 12}{2}=54$, объём $V=S\cdot h=54\cdot 7=378$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
