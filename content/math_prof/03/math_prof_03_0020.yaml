id: math_prof_03_0020
subject: math_prof
task_type: 3
difficulty: 1
statement: |
  Ребро куба равно $15$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '1350'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $15$: $6\cdot 15^2=6\cdot 225=1350$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
