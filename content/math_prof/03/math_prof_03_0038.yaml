id: math_prof_03_0038
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $5$ и $12$, боковое ребро равно $5$. Найдите объём призмы.
answer:
  type: number
  value: '150'
solution: |
  Площадь основания $S=\dfrac{5\cdot 12}{2}=30$, объём $V=S\cdot h=30\cdot 5=150$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
  kind: own
  ref: 'tpl:prism_volume'
status: live
