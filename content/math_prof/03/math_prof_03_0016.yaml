difficulty: 1
statement: |
  Ребро куба равно $12$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '864'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $12$: $6\cdot 12^2=6\cdot 144=864$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
