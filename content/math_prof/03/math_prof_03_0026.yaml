id: math_prof_03_0026
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $3$, высота равна $11$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '99'
solution: |
  $V=\pi R^2 h=\pi\cdot 3^2\cdot 11=99\pi$. Разделив на $\pi$, получаем $99$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
