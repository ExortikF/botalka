subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $40$ и $42$, боковое ребро равно $2$. Найдите объём призмы.
answer:
  type: number
  value: '1680'
solution: |
  Площадь основания $S=\dfrac{40\cdot 42}{2}=840$, объём $V=S\cdot h=840\cdot 2=1680$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
