id: math_prof_03_0033
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $8$, высота равна $11$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '704'
solution: |
  $V=\pi R^2 h=\pi\cdot 8^2\cdot 11=704\pi$. Разделив на $\pi$, получаем $704$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
