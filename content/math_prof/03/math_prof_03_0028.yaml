id: math_prof_03_0028
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $9$, высота равна $8$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '648'
solution: |
  $V=\pi R^2 h=\pi\cdot 9^2\cdot 8=648\pi$. Разделив на $\pi$, получаем $648$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
