id: math_prof_03_0036
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $4$, высота равна $8$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '128'
solution: |
  $V=\pi R^2 h=\pi\cdot 4^2\cdot 8=128\pi$. Разделив на $\pi$, получаем $128$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
