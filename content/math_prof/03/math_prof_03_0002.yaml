statement: |
  Ребро куба равно $5$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '150'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $5$: $6\cdot 5^2=6\cdot 25=150$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
source: "собственная"
status: live
