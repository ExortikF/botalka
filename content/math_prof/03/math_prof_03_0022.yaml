subject: math_prof
task_type: 3
difficulty: 1
statement: |
  Ребро куба равно $6$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '216'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $6$: $6\cdot 6^2=6\cdot 36=216$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
