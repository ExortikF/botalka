id: math_prof_03_0045
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $20$ и $21$, боковое ребро равно $11$. Найдите объём призмы.
answer:
  type: number
  value: '2310'
solution: |
  Площадь основания $S=\dfrac{20\cdot 21}{2}=210$, объём $V=S\cdot h=210\cdot 11=2310$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
  kind: own
  ref: 'tpl:prism_volume'
status: live
