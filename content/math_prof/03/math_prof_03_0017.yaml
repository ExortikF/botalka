difficulty: 1
statement: |
  Ребро куба равно $8$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '384'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $8$: $6\cdot 8^2=6\cdot 64=384$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
