difficulty: 3
statement: |
  Площадь боковой поверхности треугольной призмы равна 48. Через среднюю линию основания призмы проведена плоскость, параллельная боковому ребру. Найдите площадь боковой поверхности отсечённой треугольной призмы.
image: math_prof/img/xs3qstsrcE1090604FECB98F64C811F13536C5FE2_1_1763039100.png
answer:
  type: number
  value: "24"
solution: |
  Боковая поверхность призмы равна произведению периметра основания на высоту.
  Средняя линия отсекает треугольник, все стороны которого вдвое меньше, значит
  и периметр вдвое меньше. Высота у обеих призм одна и та же, поэтому боковая
  поверхность отсечённой призмы вдвое меньше: $48:2=24$.
