id: math_prof_03_0027
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $4$, высота равна $12$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '192'
solution: |
  $V=\pi R^2 h=\pi\cdot 4^2\cdot 12=192\pi$. Разделив на $\pi$, получаем $192$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
