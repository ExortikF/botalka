statement: |
  Через среднюю линию основания треугольной призмы проведена плоскость, параллельная боковому ребру. Найдите объём этой призмы, если объём отсечённой треугольной призмы равен 15.
image: math_prof/img/xs3qstsrc5C270EA894E2A44F47BE11B92E6F0145_1_1509374223.png
answer:
  type: number
  value: "60"
solution: |
  Основание отсечённой призмы подобно основанию исходной с коэффициентом
  $\frac{1}{2}$, площадь меньше в $4$ раза, высота та же. Значит объём
  отсечённой призмы вчетверо меньше: $15\cdot 4=60$.
