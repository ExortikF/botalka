id: math_prof_03_0034
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $6$, высота равна $3$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '108'
solution: |
  $V=\pi R^2 h=\pi\cdot 6^2\cdot 3=108\pi$. Разделив на $\pi$, получаем $108$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
