id: math_prof_03_0031
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $3$, высота равна $7$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '63'
solution: |
  $V=\pi R^2 h=\pi\cdot 3^2\cdot 7=63\pi$. Разделив на $\pi$, получаем $63$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
