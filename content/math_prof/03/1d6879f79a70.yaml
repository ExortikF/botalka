id: fipi_1d6879f79a70
subject: math_prof
task_type: 3
difficulty: 3
statement: |
  Шар, объём которого равен 18, вписан в цилиндр. Найдите объём цилиндра.
image: math_prof/img/xs3qstsrc1B7468B8EEB4857941CAFF1419F5C529_1_1478534640.png
answer:
  type: number
  value: "27"
solution: |
  У вписанного шара радиус тот же, что у цилиндра, а высота цилиндра равна
  диаметру шара. Тогда $V_{ш}=\frac{4}{3}\pi R^{3}$, а
  $V_{ц}=\pi R^{2}\cdot 2R=2\pi R^{3}$.
  Отношение объёмов не зависит от $R$: $\frac{V_{ш}}{V_{ц}}=\frac{2}{3}$,
  поэтому $V_{ц}=18\cdot \frac{3}{2}=27$.
