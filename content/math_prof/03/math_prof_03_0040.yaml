id: math_prof_03_0040
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $16$ и $30$, боковое ребро равно $2$. Найдите объём призмы.
answer:
  type: number
  value: '480'
solution: |
  Площадь основания $S=\dfrac{16\cdot 30}{2}=240$, объём $V=S\cdot h=240\cdot 2=480$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
  kind: own
  ref: 'tpl:prism_volume'
status: live
