difficulty: 1
statement: |
  Ребро куба равно $9$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '486'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $9$: $6\cdot 9^2=6\cdot 81=486$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
