id: math_prof_03_0032
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $9$, высота равна $10$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '810'
solution: |
  $V=\pi R^2 h=\pi\cdot 9^2\cdot 10=810\pi$. Разделив на $\pi$, получаем $810$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
