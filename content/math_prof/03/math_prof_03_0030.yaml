id: math_prof_03_0030
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $9$, высота равна $4$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '324'
solution: |
  $V=\pi R^2 h=\pi\cdot 9^2\cdot 4=324\pi$. Разделив на $\pi$, получаем $324$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
