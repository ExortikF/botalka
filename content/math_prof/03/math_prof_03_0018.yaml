difficulty: 1
statement: |
  Ребро куба равно $11$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '726'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $11$: $6\cdot 11^2=6\cdot 121=726$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
