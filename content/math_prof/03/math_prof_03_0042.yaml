subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Основание прямой призмы — прямоугольный треугольник с катетами $24$ и $45$, боковое ребро равно $12$. Найдите объём призмы.
answer:
  type: number
  value: '6480'
solution: |
  Площадь основания $S=\dfrac{24\cdot 45}{2}=540$, объём $V=S\cdot h=540\cdot 12=6480$.
hints:
  - 'Объём призмы — площадь основания на высоту.'
source:
