id: math_prof_03_0029
subject: math_prof
task_type: 3
difficulty: 2
statement: |
  Радиус основания цилиндра равен $7$, высота равна $8$. Найдите объём цилиндра, делённый на $\pi$.
answer:
  type: number
  value: '392'
solution: |
  $V=\pi R^2 h=\pi\cdot 7^2\cdot 8=392\pi$. Разделив на $\pi$, получаем $392$.
hints:
  - 'Объём цилиндра: $V=\pi R^2 h$.'
