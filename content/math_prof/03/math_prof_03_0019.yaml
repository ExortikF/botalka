subject: math_prof
task_type: 3
difficulty: 1
statement: |
  Ребро куба равно $10$. Найдите площадь его полной поверхности.
answer:
  type: number
  value: '600'
solution: |
  У куба $6$ граней, каждая — квадрат со стороной $10$: $6\cdot 10^2=6\cdot 100=600$.
hints:
  - 'У куба шесть одинаковых квадратных граней.'
