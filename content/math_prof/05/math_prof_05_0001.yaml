id: math_prof_05_0001
subject: math_prof
task_type: 5
difficulty: 2
statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0,1$, для второго — $0,9$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.09'
solution: |
  События независимы, поэтому вероятности перемножаются: $0,1\cdot 0,9=0,09$.
hints:
  - 'Для независимых событий вероятности перемножаются.'
source:
