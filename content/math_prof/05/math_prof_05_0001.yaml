statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0{,}8$, для второго — $0{,}7$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.56'
solution: |
  События независимы, поэтому вероятности перемножаются: $0{,}8\cdot 0{,}7=0{,}56$.
hints:
  - 'Для независимых событий вероятность их совместного наступления — произведение вероятностей.'
source: "собственная"
status: live
