id: math_prof_05_0008
subject: math_prof
task_type: 5
difficulty: 2
statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0,7$, для второго — $0,8$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.56'
solution: |
  События независимы, поэтому вероятности перемножаются: $0,7\cdot 0,8=0,56$.
hints:
  - 'Для независимых событий вероятности перемножаются.'
source:
