id: fipi_6910d2175d32
subject: math_prof
task_type: 5
difficulty: 4
statement: |
  Игральную кость бросили два раза. Известно, что шесть очков не выпало
  ни разу. Найдите при этом условии вероятность события «сумма
  очков равна 9».
image: null
answer:
  type: number
  value: "0,08"
solution: |
  Шестёрка не выпадала, значит на каждой кости от $1$ до $5$ — всего $25$ равновозможных исходов. Сумму $9$ дают $2$ из них, поэтому вероятность равна $\frac{2}{25}$.
