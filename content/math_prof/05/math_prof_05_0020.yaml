id: math_prof_05_0020
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,2$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.36'
solution: |
  Через противоположное событие: оба промаха — $0,8\cdot 0,8=0,64$. Тогда $P=1-0,64=0,36$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
