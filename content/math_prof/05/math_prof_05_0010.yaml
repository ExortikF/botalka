id: math_prof_05_0010
subject: math_prof
task_type: 5
difficulty: 2
statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0,8$, для второго — $0,3$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.24'
solution: |
  События независимы, поэтому вероятности перемножаются: $0,8\cdot 0,3=0,24$.
hints:
  - 'Для независимых событий вероятности перемножаются.'
source:
