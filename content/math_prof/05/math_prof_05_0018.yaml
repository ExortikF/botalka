id: math_prof_05_0018
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,1$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.19'
solution: |
  Через противоположное событие: оба промаха — $0,9\cdot 0,9=0,81$. Тогда $P=1-0,81=0,19$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
