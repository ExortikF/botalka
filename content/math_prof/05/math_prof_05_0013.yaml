id: math_prof_05_0013
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,9$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.99'
solution: |
  Через противоположное событие: оба промаха — $0,1\cdot 0,1=0,01$. Тогда $P=1-0,01=0,99$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
