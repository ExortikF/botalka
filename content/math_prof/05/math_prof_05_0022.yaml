statement: |
  Вероятность того, что новый насос прослужит больше года, равна $0,93$, а больше двух лет — $0,85$. Найдите вероятность того, что он прослужит меньше двух лет, но больше года.
answer:
  type: number
  value: '0.08'
solution: |
  Событие «больше двух лет» входит в «больше года», поэтому $P=0,93-0,85=0,08$.
hints:
  - 'Одно событие целиком содержится в другом — вероятности вычитаются.'
source:
