id: math_prof_05_0021
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,4$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.64'
solution: |
  Через противоположное событие: оба промаха — $0,6\cdot 0,6=0,36$. Тогда $P=1-0,36=0,64$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
