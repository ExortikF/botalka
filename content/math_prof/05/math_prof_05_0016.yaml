id: math_prof_05_0016
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,8$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.96'
solution: |
  Через противоположное событие: оба промаха — $0,2\cdot 0,2=0,04$. Тогда $P=1-0,04=0,96$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
