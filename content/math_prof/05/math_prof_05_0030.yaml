statement: |
  Вероятность того, что новый чайник прослужит больше года, равна $0,98$, а больше двух лет — $0,93$. Найдите вероятность того, что он прослужит меньше двух лет, но больше года.
answer:
  type: number
  value: '0.05'
solution: |
  Событие «больше двух лет» входит в «больше года», поэтому $P=0,98-0,93=0,05$.
hints:
  - 'Одно событие целиком содержится в другом — вероятности вычитаются.'
source:
