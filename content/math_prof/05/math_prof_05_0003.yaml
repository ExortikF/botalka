statement: |
  Вероятность того, что новый чайник прослужит больше года, равна $0{,}96$, а больше двух лет — $0{,}88$. Найдите вероятность того, что он прослужит меньше двух лет, но больше года.
answer:
  type: number
  value: '0.08'
solution: |
  Событие «больше двух лет» входит в «больше года», поэтому $P=0{,}96-0{,}88=0{,}08$.
