id: math_prof_05_0002
subject: math_prof
task_type: 5
difficulty: 2
statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0,9$, для второго — $0,5$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.45'
solution: |
  События независимы, поэтому вероятности перемножаются: $0,9\cdot 0,5=0,45$.
hints:
  - 'Для независимых событий вероятности перемножаются.'
source:
