id: math_prof_05_0002
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0{,}6$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.84'
solution: |
  Проще посчитать через противоположное событие: оба раза промах — $0{,}4\cdot 0{,}4=0{,}16$. Тогда $P=1-0{,}16=0{,}84$.
hints:
  - '«Хотя бы один раз» удобно считать через противоположное событие.'
source: "собственная"
status: live
