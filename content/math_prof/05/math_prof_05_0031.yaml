statement: |
  Вероятность того, что новый аккумулятор прослужит больше года, равна $0,96$, а больше двух лет — $0,9$. Найдите вероятность того, что он прослужит меньше двух лет, но больше года.
answer:
  type: number
  value: '0.06'
solution: |
  Событие «больше двух лет» входит в «больше года», поэтому $P=0,96-0,9=0,06$.
hints:
  - 'Одно событие целиком содержится в другом — вероятности вычитаются.'
source:
