difficulty: 4
statement: |
  Игральную кость бросили два раза. Известно, что шесть очков не выпало
  ни разу. Найдите при этом условии вероятность события «сумма
  очков равна 8».
image: null
answer:
  type: number
  value: "0,12"
solution: |
  Шестёрка не выпадала, значит на каждой кости от $1$ до $5$ — всего $25$ равновозможных исходов. Сумму $8$ дают $3$ из них, поэтому вероятность равна $\frac{3}{25}$.
