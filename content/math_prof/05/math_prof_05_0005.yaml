id: math_prof_05_0005
subject: math_prof
task_type: 5
difficulty: 2
statement: |
  Два стрелка независимо стреляют по мишени. Вероятность попадания для первого равна $0,2$, для второго — $0,6$. Найдите вероятность того, что оба попадут.
answer:
  type: number
  value: '0.12'
solution: |
  События независимы, поэтому вероятности перемножаются: $0,2\cdot 0,6=0,12$.
hints:
  - 'Для независимых событий вероятности перемножаются.'
source:
