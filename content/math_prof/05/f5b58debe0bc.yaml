statement: |
  Стрелок стреляет по одному разу в каждую из четырёх мишеней. Вероятность попадания в мишень при каждом отдельном выстреле равна 0,6. Найдите вероятность того, что стрелок попадёт в две первые мишени
  и не попадёт в две последние.
image: null
answer:
  type: number
  value: "0,0576"
solution: |
  Выстрелы независимы, поэтому вероятности перемножаются: $\frac{3}{5}^{2}\cdot(\frac{2}{5})^{2}=\frac{36}{625}$.
