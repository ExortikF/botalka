id: math_prof_05_0019
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,7$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.91'
solution: |
  Через противоположное событие: оба промаха — $0,3\cdot 0,3=0,09$. Тогда $P=1-0,09=0,91$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
