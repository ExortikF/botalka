id: math_prof_05_0014
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Стрелок делает два независимых выстрела. Вероятность попадания при одном выстреле равна $0,5$. Найдите вероятность того, что он попадёт хотя бы один раз.
answer:
  type: number
  value: '0.75'
solution: |
  Через противоположное событие: оба промаха — $0,5\cdot 0,5=0,25$. Тогда $P=1-0,25=0,75$.
hints:
  - '«Хотя бы один» удобно считать через противоположное событие.'
source:
