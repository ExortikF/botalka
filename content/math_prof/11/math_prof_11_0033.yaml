id: math_prof_11_0033
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(4;\,21)$ и $(2;\,13)$. Найдите $k$.
answer:
  type: number
  value: '4'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{13-(21)}{2-(4)}=4$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
