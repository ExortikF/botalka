statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(2;\,6)$. Найдите $k$.
answer:
  type: number
  value: '12'
solution: |
  Подставим точку: $6=\dfrac{k}{2}$, откуда $k=12$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
