statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(2;\,3)$. Найдите $k$.
answer:
  type: number
  value: '6'
solution: |
  Подставим точку: $3=\dfrac{k}{2}$, откуда $k=2\cdot3=6$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
