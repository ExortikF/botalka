id: math_prof_11_0027
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(1;\,11)$ и $(4;\,23)$. Найдите $k$.
answer:
  type: number
  value: '4'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{23-(11)}{4-(1)}=4$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
