task_type: 11
difficulty: 3
statement: |
  На рисунке изображён график функции вида $f(x)=\log _{a}x$ . Найдите
  значение $f(8)$ .
  [[img:math_prof/img/xs3qstsrcB5C171F0F43AA506455B827382FDC5DA_1_1644585240.png]]
image: math_prof/img/xs3qstsrcB5C171F0F43AA506455B827382FDC5DA_1_1644585240.png
answer:
  type: number
  value: "-3"
solution: |
  График проходит через точку $(2;-1)$, поэтому $\log_{a}2=-1$ и $a=\frac{1}{2}$.
  Тогда $f(8)=\log_{\frac{1}{2}}8=-3$: чтобы получить $8$, основание $\frac{1}{2}$
  нужно возвести в степень $-3$.
