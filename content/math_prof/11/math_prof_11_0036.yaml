id: math_prof_11_0036
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(1;\,7)$ и $(-3;\,-1)$. Найдите $k$.
answer:
  type: number
  value: '2'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{-1-(7)}{-3-(1)}=2$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
