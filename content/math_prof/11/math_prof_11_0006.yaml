difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(-3;\,-4)$. Найдите $k$.
answer:
  type: number
  value: '12'
solution: |
  Подставим точку: $-4=\dfrac{k}{-3}$, откуда $k=-3\cdot-4=12$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
