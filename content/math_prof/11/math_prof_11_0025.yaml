id: math_prof_11_0025
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(3;\,9)$ и $(4;\,12)$. Найдите $k$.
answer:
  type: number
  value: '3'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{12-(9)}{4-(3)}=3$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
