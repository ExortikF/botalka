id: math_prof_11_0016
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,-4)$ и $(-1;\,-2)$. Найдите $b$.
answer:
  type: number
  value: '-1'
solution: |
  Из точки $(0;-4)$ сразу $c=-4$. Подставим вторую точку: $1+b\cdot(-1)+(-4)=-2$, откуда $b=-1$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
