difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(-4;\,-12)$. Найдите $k$.
answer:
  type: number
  value: '48'
solution: |
  Подставим точку: $-12=\dfrac{k}{-4}$, откуда $k=-4\cdot-12=48$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
