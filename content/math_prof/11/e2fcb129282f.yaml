statement: |
  На рисунке изображён график функции вида $f(x)=a\sqrt{x}.$ Найдите значение $f(49).$
  [[img:math_prof/img/xs3qstsrc9BE24FB850DEAACD4A8C2F2EC7FD7DA3_1_1766415866.png]]
image: math_prof/img/xs3qstsrc9BE24FB850DEAACD4A8C2F2EC7FD7DA3_1_1766415866.png
answer:
  type: number
  value: "21"
solution: |
  График проходит через точку $(1;3)$, значит $a=3$, а по второй точке
  $f(4)=6$ — сходится.
  Тогда $f(49)=3\cdot 7=21$.
