difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(4;\,6)$. Найдите $k$.
answer:
  type: number
  value: '24'
solution: |
  Подставим точку: $6=\dfrac{k}{4}$, откуда $k=4\cdot6=24$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
