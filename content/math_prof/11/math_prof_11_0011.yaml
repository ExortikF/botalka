difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(6;\,3)$. Найдите $k$.
answer:
  type: number
  value: '18'
solution: |
  Подставим точку: $3=\dfrac{k}{6}$, откуда $k=6\cdot3=18$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
