statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}​.$ Найдите значение $f(-2).$
  [[img:math_prof/img/xs3qstsrcED896EC71D4DA79941FD0AB32E7D5B4E_5_1721136274.png]]
image: math_prof/img/xs3qstsrcED896EC71D4DA79941FD0AB32E7D5B4E_5_1721136274.png
answer:
  type: number
  value: "16"
solution: |
  График убывает и проходит через точку $(-1;4)$, поэтому $a^{-1}=4$ и
  $a=\frac{1}{4}$.
  Тогда $f(-2)=\left(\frac{1}{4}\right)^{-2}=4^{2}=16$.
