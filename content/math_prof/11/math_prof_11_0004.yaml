id: math_prof_11_0004
subject: math_prof
task_type: 11
difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(-2;\,-12)$. Найдите $k$.
answer:
  type: number
  value: '24'
solution: |
  Подставим точку: $-12=\dfrac{k}{-2}$, откуда $k=-2\cdot-12=24$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
