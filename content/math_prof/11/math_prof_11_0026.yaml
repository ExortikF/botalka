id: math_prof_11_0026
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(1;\,2)$ и $(-2;\,11)$. Найдите $k$.
answer:
  type: number
  value: '-3'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{11-(2)}{-2-(1)}=-3$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
