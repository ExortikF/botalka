difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(-6;\,4)$. Найдите $k$.
answer:
  type: number
  value: '-24'
solution: |
  Подставим точку: $4=\dfrac{k}{-6}$, откуда $k=-6\cdot4=-24$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
