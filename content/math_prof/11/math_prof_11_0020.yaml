id: math_prof_11_0020
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,7)$ и $(1;\,2)$. Найдите $b$.
answer:
  type: number
  value: '-6'
solution: |
  Из точки $(0;7)$ сразу $c=7$. Подставим вторую точку: $1+b\cdot(1)+(7)=2$, откуда $b=-6$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
