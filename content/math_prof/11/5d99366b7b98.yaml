statement: |
  На рисунке изображён график функции вида $f(x)=a\sqrt{x}.$ Найдите значение $f(64).$
  [[img:math_prof/img/xs3qstsrc3D2D05DE2D139DF046B8ADE8332932E9_1_1766415856.png]]
image: math_prof/img/xs3qstsrc3D2D05DE2D139DF046B8ADE8332932E9_1_1766415856.png
answer:
  type: number
  value: "16"
solution: |
  График проходит через точку $(1;2)$, поэтому $a=2$.
  Проверка по второй точке: $f(4)=2\cdot 2=4$ — совпадает с рисунком.
  Тогда $f(64)=2\cdot \sqrt{64}=2\cdot 8=16$.
