difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(3;\,3)$. Найдите $k$.
answer:
  type: number
  value: '9'
solution: |
  Подставим точку: $3=\dfrac{k}{3}$, откуда $k=3\cdot3=9$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
