statement: |
  На рисунке изображён график функции вида $f(x)=\frac{k}{x}.$ Найдите
  значение $f(10).$
  [[img:math_prof/img/xs3qstsrc0003A017079FB82144E978D0154CA82C_1_1766415926.png]]
image: math_prof/img/xs3qstsrc0003A017079FB82144E978D0154CA82C_1_1766415926.png
answer:
  type: number
  value: "0,5"
solution: |
  По графику видно, что при $x=5$ значение равно $1$, поэтому
  $\frac{k}{5}=1$ и $k=5$.
  Тогда $f(10)=\frac{5}{10}=0{,}5$.
