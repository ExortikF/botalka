statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}.$ Найдите
  значение $f(2).$
  [[img:math_prof/img/xs3qstsrc796EAA113F99B7254D217982503EF2A1_1_1646402938.png]]
image: math_prof/img/xs3qstsrc796EAA113F99B7254D217982503EF2A1_1_1646402938.png
answer:
  type: number
  value: "25"
solution: |
  График проходит через точку $(1;5)$, поэтому $a=5$.
  Тогда $f(2)=5^{2}=25$.
