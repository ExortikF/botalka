statement: |
  На рисунке изображён график функции вида $f(x)=a\sqrt{x}$ . Найдите значение $f(36)$ .
  [[img:math_prof/img/xs3qstsrcA6AC334DFD45B0AC4A120D2C7B64DEAC_1_1766415906.png]]
image: math_prof/img/xs3qstsrcA6AC334DFD45B0AC4A120D2C7B64DEAC_1_1766415906.png
answer:
  type: number
  value: "-12"
solution: |
  График убывает и проходит через точку $(4;-4)$, поэтому $a\cdot 2=-4$
  и $a=-2$.
  Тогда $f(36)=-2\cdot \sqrt{36}=-2\cdot 6=-12$.
