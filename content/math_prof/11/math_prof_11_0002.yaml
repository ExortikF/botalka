id: math_prof_11_0002
subject: math_prof
task_type: 11
difficulty: 1
statement: |
  График функции $y=\dfrac{k}{x}$ проходит через точку $(6;\,-12)$. Найдите $k$.
answer:
  type: number
  value: '-72'
solution: |
  Подставим точку: $-12=\dfrac{k}{6}$, откуда $k=6\cdot-12=-72$.
hints:
  - 'Подставьте координаты точки в формулу функции.'
