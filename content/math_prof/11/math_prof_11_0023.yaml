id: math_prof_11_0023
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,-7)$ и $(2;\,-3)$. Найдите $b$.
answer:
  type: number
  value: '0'
solution: |
  Из точки $(0;-7)$ сразу $c=-7$. Подставим вторую точку: $4+b\cdot(2)+(-7)=-3$, откуда $b=0$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
