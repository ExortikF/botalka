id: math_prof_11_0019
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,-1)$ и $(-1;\,0)$. Найдите $b$.
answer:
  type: number
  value: '0'
solution: |
  Из точки $(0;-1)$ сразу $c=-1$. Подставим вторую точку: $1+b\cdot(-1)+(-1)=0$, откуда $b=0$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
