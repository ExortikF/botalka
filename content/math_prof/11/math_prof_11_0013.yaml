id: math_prof_11_0013
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,-1)$ и $(-2;\,5)$. Найдите $b$.
answer:
  type: number
  value: '-1'
solution: |
  Из точки $(0;-1)$ сразу $c=-1$. Подставим вторую точку: $4+b\cdot(-2)+(-1)=5$, откуда $b=-1$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
