id: math_prof_11_0034
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(4;\,-2)$ и $(3;\,0)$. Найдите $k$.
answer:
  type: number
  value: '-2'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{0-(-2)}{3-(4)}=-2$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
