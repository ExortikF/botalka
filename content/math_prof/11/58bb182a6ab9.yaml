statement: |
  На рисунке изображён график функции вида $f(x)=a\sqrt{x}.$ Найдите значение $f(25).$
  [[img:math_prof/img/xs3qstsrcED43115A2485BA244562BD3F5F320C12_1_1766415846.png]]
image: math_prof/img/xs3qstsrcED43115A2485BA244562BD3F5F320C12_1_1766415846.png
answer:
  type: number
  value: "20"
solution: |
  График проходит через точку $(1;4)$, поэтому $a\sqrt{1}=4$ и $a=4$.
  Проверка по второй точке: $f(4)=4\cdot 2=8$ — совпадает с рисунком.
  Тогда $f(25)=4\cdot \sqrt{25}=4\cdot 5=20$.
