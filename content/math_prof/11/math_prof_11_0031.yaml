id: math_prof_11_0031
subject: math_prof
task_type: 11
difficulty: 2
statement: |
  Прямая $y=kx+b$ проходит через точки $(-1;\,-6)$ и $(-2;\,-9)$. Найдите $k$.
answer:
  type: number
  value: '3'
solution: |
  $k=\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{-9-(-6)}{-2-(-1)}=3$.
hints:
  - 'Угловой коэффициент — отношение приращения $y$ к приращению $x$.'
source:
