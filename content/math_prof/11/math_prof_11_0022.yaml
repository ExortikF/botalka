id: math_prof_11_0022
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,-2)$ и $(-2;\,4)$. Найдите $b$.
answer:
  type: number
  value: '-1'
solution: |
  Из точки $(0;-2)$ сразу $c=-2$. Подставим вторую точку: $4+b\cdot(-2)+(-2)=4$, откуда $b=-1$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
