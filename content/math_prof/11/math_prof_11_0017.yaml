id: math_prof_11_0017
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,6)$ и $(2;\,18)$. Найдите $b$.
answer:
  type: number
  value: '4'
solution: |
  Из точки $(0;6)$ сразу $c=6$. Подставим вторую точку: $4+b\cdot(2)+(6)=18$, откуда $b=4$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
