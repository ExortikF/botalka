difficulty: 4
statement: |
  На рисунке изображены графики функций видов $f(x)=\frac{k}{x}$ и $g(x)=ax+b$ , пересекающиеся в точках $A$ и $B$ . Найдите абсциссу точки $B$ .
  [[img:math_prof/img/xs3qstsrcABFE3876EC4687414C3B189C54B182E6_1_1644585124.png]]
image: math_prof/img/xs3qstsrcABFE3876EC4687414C3B189C54B182E6_1_1644585124.png
answer:
  type: number
  value: "8"
solution: |
  Точка $A$ имеет координаты $(-4;-2)$, поэтому $k=(-4)\cdot(-2)=8$ и
  $f(x)=\frac{8}{x}$.
  Прямая проходит через $A$ и пересекает ось ординат в точке $-1$, значит
  $b=-1$, а из $-4a-1=-2$ получаем $a=\frac{1}{4}$.
  Абсциссы точек пересечения — корни уравнения
  $\frac{8}{x}=\frac{x}{4}-1$, то есть $x^{2}-4x-32=0$: это $-4$ и $8$.
  Первый корень — точка $A$, поэтому у точки $B$ абсцисса равна $8$.
