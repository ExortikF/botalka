id: math_prof_11_0018
subject: math_prof
task_type: 11
difficulty: 3
statement: |
  Парабола $y=x^{2}+bx+c$ проходит через точки $(0;\,5)$ и $(-2;\,-3)$. Найдите $b$.
answer:
  type: number
  value: '6'
solution: |
  Из точки $(0;5)$ сразу $c=5$. Подставим вторую точку: $4+b\cdot(-2)+(5)=-3$, откуда $b=6$.
hints:
  - 'Начните с точки, где $x=0$ — она сразу даёт $c$.'
source:
