difficulty: 1
statement: |
  Найдите длину вектора $\vec{a}\,(10;\,-24)$.
answer:
  type: number
  value: '26'
solution: |
  $|\vec{a}|=\sqrt{(10)^2+(-24)^2}=\sqrt{100+576}=\sqrt{676}=26$.
hints:
  - 'Длина вектора по координатам: $\sqrt{x^2+y^2}$.'
