id: math_prof_02_0015
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(-6;\,-4)$ и $\vec{b}\,(0;\,1)$.
answer:
  type: number
  value: '-4'
solution: |
  $\vec{a}\cdot\vec{b}=-6\cdot0+-4\cdot1=0+-4=-4$.
hints:
  - 'Скалярное произведение по координатам: $x_1x_2+y_1y_2$.'
