statement: |
  Найдите длину вектора $\vec{a}\,(9;\,12)$.
answer:
  type: number
  value: '15'
solution: |
  $|\vec{a}|=\sqrt{(9)^2+(12)^2}=\sqrt{81+144}=\sqrt{225}=15$.
hints:
  - 'Длина вектора по координатам: $\sqrt{x^2+y^2}$.'
