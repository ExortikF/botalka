id: math_prof_02_0034
subject: math_prof
task_type: 2
difficulty: 2
statement: |
  Векторы $\vec{a}\,(6;\,6)$ и $\vec{b}\,(24;\,m)$ коллинеарны. Найдите $m$.
answer:
  type: number
  value: '24'
solution: |
  Коллинеарность означает $x_1 m - y_1 x_2 = 0$, то есть $6m-6\cdot24=0$, откуда $m=24$.
hints:
  - 'Для коллинеарных векторов координаты пропорциональны.'
source:
