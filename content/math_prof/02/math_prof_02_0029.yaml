id: math_prof_02_0029
subject: math_prof
task_type: 2
difficulty: 2
statement: |
  Векторы $\vec{a}\,(3;\,4)$ и $\vec{b}\,(6;\,m)$ коллинеарны. Найдите $m$.
answer:
  type: number
  value: '8'
solution: |
  Коллинеарность означает $x_1 m - y_1 x_2 = 0$, то есть $3m-4\cdot6=0$, откуда $m=8$.
hints:
  - 'Для коллинеарных векторов координаты пропорциональны.'
source:
