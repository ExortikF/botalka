id: math_prof_02_0035
subject: math_prof
task_type: 2
difficulty: 2
statement: |
  Векторы $\vec{a}\,(6;\,4)$ и $\vec{b}\,(-12;\,m)$ коллинеарны. Найдите $m$.
answer:
  type: number
  value: '-8'
solution: |
  Коллинеарность означает $x_1 m - y_1 x_2 = 0$, то есть $6m-4\cdot-12=0$, откуда $m=-8$.
hints:
  - 'Для коллинеарных векторов координаты пропорциональны.'
source:
