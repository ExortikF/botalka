id: math_prof_02_0023
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(-6;\,-7)$ и $\vec{b}\,(2;\,-7)$.
answer:
  type: number
  value: '37'
solution: |
  $\vec{a}\cdot\vec{b}=-6\cdot2+-7\cdot-7=-12+49=37$.
hints:
  - 'Скалярное произведение по координатам: $x_1x_2+y_1y_2$.'
