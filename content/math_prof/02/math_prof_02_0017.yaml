id: math_prof_02_0017
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(7;\,-5)$ и $\vec{b}\,(-1;\,-8)$.
answer:
  type: number
  value: '33'
solution: |
  $\vec{a}\cdot\vec{b}=7\cdot-1+-5\cdot-8=-7+40=33$.
hints:
  - 'Скалярное произведение по координатам: $x_1x_2+y_1y_2$.'
