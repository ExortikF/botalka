id: math_prof_02_0002
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите длину вектора $\vec{a}\,(-6;\,-8)$.
answer:
  type: number
  value: '10'
solution: |
  $|\vec{a}|=\sqrt{(-6)^2+(-8)^2}=\sqrt{36+64}=\sqrt{100}=10$.
hints:
  - 'Длина вектора по координатам: $\sqrt{x^2+y^2}$.'
