statement: |
  Длины векторов $\overrightarrow{a}$ и $\overrightarrow{b}$ равны 3 и 5, а угол между ними равен $60°.$ Найдите скалярное произведение $\overrightarrow{a}\cdot \overrightarrow{b}.$
image: null
answer:
  type: number
  value: "7,5"
solution: |
  Скалярное произведение равно произведению длин на косинус угла: $3 \cdot 5 \cdot \cos 60° = \frac{15}{2}$.
