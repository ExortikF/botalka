id: math_prof_02_0014
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(1;\,3)$ и $\vec{b}\,(2;\,-4)$.
answer:
  type: number
  value: '-10'
solution: |
  $\vec{a}\cdot\vec{b}=1\cdot2+3\cdot-4=2+-12=-10$.
hints:
  - 'Скалярное произведение по координатам: $x_1x_2+y_1y_2$.'
