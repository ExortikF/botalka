id: math_prof_02_0032
subject: math_prof
task_type: 2
difficulty: 2
statement: |
  Векторы $\vec{a}\,(2;\,6)$ и $\vec{b}\,(-6;\,m)$ коллинеарны. Найдите $m$.
answer:
  type: number
  value: '-18'
solution: |
  Коллинеарность означает $x_1 m - y_1 x_2 = 0$, то есть $2m-6\cdot-6=0$, откуда $m=-18$.
hints:
  - 'Для коллинеарных векторов координаты пропорциональны.'
source:
