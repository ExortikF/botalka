difficulty: 1
statement: |
  Найдите длину вектора $\vec{a}\,(24;\,-45)$.
answer:
  type: number
  value: '51'
solution: |
  $|\vec{a}|=\sqrt{(24)^2+(-45)^2}=\sqrt{576+2025}=\sqrt{2601}=51$.
hints:
  - 'Длина вектора по координатам: $\sqrt{x^2+y^2}$.'
