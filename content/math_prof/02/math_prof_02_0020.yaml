id: math_prof_02_0020
subject: math_prof
task_type: 2
difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(7;\,-4)$ и $\vec{b}\,(3;\,5)$.
answer:
  type: number
  value: '1'
solution: |
  $\vec{a}\cdot\vec{b}=7\cdot3+-4\cdot5=21+-20=1$.
hints:
  - 'Скалярное произведение по координатам: $x_1x_2+y_1y_2$.'
