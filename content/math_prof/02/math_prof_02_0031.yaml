id: math_prof_02_0031
subject: math_prof
task_type: 2
difficulty: 2
statement: |
  Векторы $\vec{a}\,(4;\,3)$ и $\vec{b}\,(8;\,m)$ коллинеарны. Найдите $m$.
answer:
  type: number
  value: '6'
solution: |
  Коллинеарность означает $x_1 m - y_1 x_2 = 0$, то есть $4m-3\cdot8=0$, откуда $m=6$.
hints:
  - 'Для коллинеарных векторов координаты пропорциональны.'
source:
