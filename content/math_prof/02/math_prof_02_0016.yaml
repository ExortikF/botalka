statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(6;\,-5)$ и $\vec{b}\,(1;\,4)$.
answer:
  type: number
  value: '-14'
solution: |
  $\vec{a}\cdot\vec{b}=6\cdot1+-5\cdot4=6+-20=-14$.
