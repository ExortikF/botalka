statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(8;\,-7)$ и $\vec{b}\,(1;\,6)$.
answer:
  type: number
  value: '-34'
solution: |
  $\vec{a}\cdot\vec{b}=8\cdot1+-7\cdot6=8+-42=-34$.
