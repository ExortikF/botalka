difficulty: 1
statement: |
  Найдите скалярное произведение векторов $\vec{a}\,(-6;\,-5)$ и $\vec{b}\,(7;\,-1)$.
answer:
  type: number
  value: '-37'
solution: |
  $\vec{a}\cdot\vec{b}=-6\cdot7+-5\cdot-1=-42+5=-37$.
hints:
