statement: |
  Найдите длину вектора $\vec{a}\,(-14;\,48)$.
answer:
  type: number
  value: '50'
solution: |
  $|\vec{a}|=\sqrt{(-14)^2+(48)^2}=\sqrt{196+2304}=\sqrt{2500}=50$.
hints:
  - 'Длина вектора по координатам: $\sqrt{x^2+y^2}$.'
