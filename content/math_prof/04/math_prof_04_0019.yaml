statement: |
  В классе $20$ учеников, из них $14$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.3'
solution: |
  Мальчиков $20-14=6$. $P=\dfrac{6}{20}=0,3$.
