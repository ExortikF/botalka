id: math_prof_04_0005
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $10$ шаров, из них $7$ белых. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.7'
solution: |
  $P=\dfrac{7}{10}=0,7$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
