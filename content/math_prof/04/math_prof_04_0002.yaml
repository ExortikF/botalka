id: math_prof_04_0002
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $25$ шаров, из них $13$ красных. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.52'
solution: |
  $P=\dfrac{13}{25}=0,52$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
