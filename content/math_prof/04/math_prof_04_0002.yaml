statement: |
  В классе $25$ учеников, из них $10$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.6'
solution: |
  Мальчиков $25-10=15$. Вероятность: $\dfrac{15}{25}=0{,}6$.
