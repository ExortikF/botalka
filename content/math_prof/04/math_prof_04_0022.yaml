statement: |
  В классе $25$ учеников, из них $6$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.76'
solution: |
  Мальчиков $25-6=19$. $P=\dfrac{19}{25}=0,76$.
