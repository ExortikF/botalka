statement: |
  В классе $50$ учеников, из них $38$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.24'
solution: |
  Мальчиков $50-38=12$. $P=\dfrac{12}{50}=0,24$.
