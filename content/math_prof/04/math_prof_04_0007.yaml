id: math_prof_04_0007
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $50$ шаров, из них $49$ зелёных. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.98'
solution: |
  $P=\dfrac{49}{50}=0,98$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
