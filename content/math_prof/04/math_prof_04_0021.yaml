statement: |
  В классе $25$ учеников, из них $8$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.68'
solution: |
  Мальчиков $25-8=17$. $P=\dfrac{17}{25}=0,68$.
