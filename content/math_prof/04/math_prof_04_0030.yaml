statement: |
  В классе $50$ учеников, из них $26$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.48'
solution: |
  Мальчиков $50-26=24$. $P=\dfrac{24}{50}=0,48$.
