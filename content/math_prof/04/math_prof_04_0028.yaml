statement: |
  В классе $20$ учеников, из них $6$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.7'
solution: |
  Мальчиков $20-6=14$. $P=\dfrac{14}{20}=0,7$.
