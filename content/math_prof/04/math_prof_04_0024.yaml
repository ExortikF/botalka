statement: |
  В классе $20$ учеников, из них $10$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.5'
solution: |
  Мальчиков $20-10=10$. $P=\dfrac{10}{20}=0,5$.
