statement: |
  В классе $40$ учеников, из них $22$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.45'
solution: |
  Мальчиков $40-22=18$. $P=\dfrac{18}{40}=0,45$.
