id: math_prof_04_0009
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $20$ шаров, из них $9$ белых. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.45'
solution: |
  $P=\dfrac{9}{20}=0,45$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
