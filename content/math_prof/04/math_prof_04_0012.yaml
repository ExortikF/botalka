subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $40$ шаров, из них $16$ белых. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.4'
solution: |
  $P=\dfrac{16}{40}=0,4$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
