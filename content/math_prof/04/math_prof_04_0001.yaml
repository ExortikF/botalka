statement: |
  В коробке $12$ шаров, из них $3$ красных. Наугад достают один шар. Найдите вероятность того, что он окажется красным.
answer:
  type: number
  value: '0.25'
solution: |
  $P=\dfrac{3}{12}=0{,}25$.
hints:
  - 'Вероятность — отношение числа подходящих исходов к числу всех исходов.'
