statement: |
  В классе $25$ учеников, из них $16$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.36'
solution: |
  Мальчиков $25-16=9$. $P=\dfrac{9}{25}=0,36$.
