subject: math_prof
task_type: 4
difficulty: 1
statement: |
  Игральную кость бросают один раз. Найдите вероятность того, что выпадет чётное число очков.
answer:
  type: number
  value: '0.5'
solution: |
  Подходят исходы 2, 4, 6 — всего $3$ из $6$. $P=\dfrac{3}{6}=0,5$.
hints:
  - 'Всего у кости шесть равновозможных исходов.'
