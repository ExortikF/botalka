id: math_prof_04_0008
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $50$ шаров, из них $3$ белых. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.06'
solution: |
  $P=\dfrac{3}{50}=0,06$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
