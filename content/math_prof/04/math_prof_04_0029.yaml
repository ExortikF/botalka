statement: |
  В классе $50$ учеников, из них $4$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.92'
solution: |
  Мальчиков $50-4=46$. $P=\dfrac{46}{50}=0,92$.
