statement: |
  В классе $50$ учеников, из них $42$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.16'
solution: |
  Мальчиков $50-42=8$. $P=\dfrac{8}{50}=0,16$.
