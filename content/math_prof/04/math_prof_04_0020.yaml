statement: |
  В классе $40$ учеников, из них $10$ девочек. Наугад выбирают одного дежурного. Найдите вероятность того, что дежурным окажется мальчик.
answer:
  type: number
  value: '0.75'
solution: |
  Мальчиков $40-10=30$. $P=\dfrac{30}{40}=0,75$.
