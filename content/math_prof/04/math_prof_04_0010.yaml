id: math_prof_04_0010
subject: math_prof
task_type: 4
difficulty: 1
statement: |
  В коробке $25$ шаров, из них $15$ зелёных. Наугад достают один шар. Найдите вероятность того, что он окажется этого цвета.
answer:
  type: number
  value: '0.6'
solution: |
  $P=\dfrac{15}{25}=0,6$.
hints:
  - 'Вероятность — отношение подходящих исходов к общему числу исходов.'
