id: math_prof_08_0021
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=-4x+3$ параллельна касательной к графику функции $y=1x^{2}-2x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '-1'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $-4$. $y'=2x-2=-4$, откуда $x=-1$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
