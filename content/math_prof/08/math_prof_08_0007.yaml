statement: |
  Функция задана формулой $f(x)=3x^{3}+2x^{2}-8x$. Найдите $f'(2)$.
answer:
  type: number
  value: '36'
solution: |
  $f'(x)=9x^{2}+4x-8$, тогда $f'(2)=9\cdot4+8-8=36$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
