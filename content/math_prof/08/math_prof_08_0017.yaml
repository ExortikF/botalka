id: math_prof_08_0017
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=4x+6$ параллельна касательной к графику функции $y=1x^{2}+0x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '2'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $4$. $y'=2x+0=4$, откуда $x=2$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
