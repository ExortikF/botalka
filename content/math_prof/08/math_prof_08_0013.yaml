id: math_prof_08_0013
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=-2x+3$ параллельна касательной к графику функции $y=1x^{2}+4x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '-3'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $-2$. $y'=2x+4=-2$, откуда $x=-3$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
