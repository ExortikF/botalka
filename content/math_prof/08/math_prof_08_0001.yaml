statement: |
  Функция задана формулой $f(x)=1x^{3}+6x^{2}+0x$. Найдите $f'(4)$.
answer:
  type: number
  value: '96'
solution: |
  $f'(x)=3x^{2}+12x+0$, тогда $f'(4)=3\cdot16+48+0=96$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
