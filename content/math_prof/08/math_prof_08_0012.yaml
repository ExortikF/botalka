statement: |
  Функция задана формулой $f(x)=3x^{3}+2x^{2}-1x$. Найдите $f'(-3)$.
answer:
  type: number
  value: '68'
solution: |
  $f'(x)=9x^{2}+4x-1$, тогда $f'(-3)=9\cdot9-12-1=68$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
