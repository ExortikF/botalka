statement: |
  Функция задана формулой $f(x)=4x^{3}+0x^{2}+7x$. Найдите $f'(0)$.
answer:
  type: number
  value: '7'
solution: |
  $f'(x)=12x^{2}+0x+7$, тогда $f'(0)=12\cdot0+0+7=7$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
