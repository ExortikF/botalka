statement: |
  Функция задана формулой $f(x)=3x^{3}+3x^{2}-4x$. Найдите $f'(-2)$.
answer:
  type: number
  value: '20'
solution: |
  $f'(x)=9x^{2}+6x-4$, тогда $f'(-2)=9\cdot4-12-4=20$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
