statement: |
  Функция задана формулой $f(x)=4x^{3}+1x^{2}+7x$. Найдите $f'(3)$.
answer:
  type: number
  value: '121'
solution: |
  $f'(x)=12x^{2}+2x+7$, тогда $f'(3)=12\cdot9+6+7=121$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
