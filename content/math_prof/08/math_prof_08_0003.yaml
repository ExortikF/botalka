statement: |
  Функция задана формулой $f(x)=3x^{3}-4x^{2}-1x$. Найдите $f'(-3)$.
answer:
  type: number
  value: '104'
solution: |
  $f'(x)=9x^{2}-8x-1$, тогда $f'(-3)=9\cdot9+24-1=104$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
