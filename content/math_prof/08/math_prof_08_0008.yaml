statement: |
  Функция задана формулой $f(x)=3x^{3}+5x^{2}-4x$. Найдите $f'(2)$.
answer:
  type: number
  value: '52'
solution: |
  $f'(x)=9x^{2}+10x-4$, тогда $f'(2)=9\cdot4+20-4=52$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
