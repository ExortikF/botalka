id: fipi_28ca30e9e57a
subject: math_prof
task_type: 8
difficulty: 5
statement: |
  На рисунке изображены график функции $y=f(x)$ и касательная к нему
  в точке с абсциссой $x_{0}​.$ Найдите значение производной функции $f(x)$
  в точке $x_{0}​.$
  [[img:math_prof/img/xs3qstsrc28CA30E9E57A9D124B86F304033299EB_6_1758622277.png]]
image: math_prof/img/xs3qstsrc28CA30E9E57A9D124B86F304033299EB_6_1758622277.png
answer:
  type: number
  value: "1,5"
solution: |
  Производная в точке касания — это угловой коэффициент касательной.
  Касательная проходит через точки $(-1;0)$ и $(1;3)$, значит
  $f'(x_{0})=\frac{3-0}{1-(-1)}=\frac{3}{2}=1{,}5$.
