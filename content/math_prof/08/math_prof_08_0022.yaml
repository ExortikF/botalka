id: math_prof_08_0022
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=10x-9$ параллельна касательной к графику функции $y=2x^{2}+6x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '1'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $10$. $y'=4x+6=10$, откуда $x=1$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
