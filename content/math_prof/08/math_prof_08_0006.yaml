statement: |
  Функция задана формулой $f(x)=4x^{3}+0x^{2}-8x$. Найдите $f'(4)$.
answer:
  type: number
  value: '184'
solution: |
  $f'(x)=12x^{2}+0x-8$, тогда $f'(4)=12\cdot16+0-8=184$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
