statement: |
  Функция задана формулой $f(x)=3x^{3}-2x^{2}+5x$. Найдите $f'(1)$.
answer:
  type: number
  value: '10'
solution: |
  $f'(x)=9x^{2}-4x+5$, тогда $f'(1)=9\cdot1-4+5=10$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
