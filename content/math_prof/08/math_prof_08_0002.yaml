statement: |
  Прямая $y=3x-5$ параллельна касательной к графику функции $y=x^{2}+2x-3$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '0.5'
solution: |
  Угловой коэффициент касательной равен угловому коэффициенту прямой, то есть $3$. $y'=2x+2=3$, откуда $x=0{,}5$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной равен значению производной в точке касания.'
source: "собственная"
