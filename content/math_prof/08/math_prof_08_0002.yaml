statement: |
  Функция задана формулой $f(x)=1x^{3}+3x^{2}-5x$. Найдите $f'(3)$.
answer:
  type: number
  value: '40'
solution: |
  $f'(x)=3x^{2}+6x-5$, тогда $f'(3)=3\cdot9+18-5=40$.
hints:
  - 'Производная $x^n$ равна $nx^{n-1}$.'
