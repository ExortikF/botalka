id: math_prof_08_0019
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=-2x-3$ параллельна касательной к графику функции $y=2x^{2}+6x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '-2'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $-2$. $y'=4x+6=-2$, откуда $x=-2$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
