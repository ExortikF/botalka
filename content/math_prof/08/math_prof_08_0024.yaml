id: math_prof_08_0024
subject: math_prof
task_type: 8
difficulty: 3
statement: |
  Прямая $y=-5x+3$ параллельна касательной к графику функции $y=1x^{2}+1x$. Найдите абсциссу точки касания.
answer:
  type: number
  value: '-3'
solution: |
  У параллельных прямых равные угловые коэффициенты, значит производная в точке касания равна $-5$. $y'=2x+1=-5$, откуда $x=-3$.
hints:
  - 'У параллельных прямых равные угловые коэффициенты.'
  - 'Угловой коэффициент касательной — значение производной в точке касания.'
