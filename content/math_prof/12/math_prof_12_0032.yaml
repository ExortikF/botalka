subject: math_prof
task_type: 12
difficulty: 2
statement: |
  Найдите наибольшее значение функции $y=-4x^{2}-16x+18$.
answer:
  type: number
  value: '34'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{-16}{-8}=-2$, $y(-2)=34$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
