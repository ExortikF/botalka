statement: |
  Найдите точку максимума функции $y=\ln (x-7)-2x-3$ .
image: null
answer:
  type: number
  value: "7,5"
solution: |
  Найдём производную: $y' = \frac{15 - 2 x}{x - 7}$. Приравняем её к нулю: $x = \frac{15}{2}$. Слева от точки функция возрастает, справа убывает — это точка максимума.
