statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{64}{x}$ при $x>0$.
answer:
  type: number
  value: '16'
solution: |
  $y'=1-\dfrac{64}{x^{2}}=0$ при $x=8$. Производная меняет знак с минуса на плюс — это минимум: $y(8)=8+8=16$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
