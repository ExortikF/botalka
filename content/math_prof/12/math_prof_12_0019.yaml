statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{121}{x}$ при $x>0$.
answer:
  type: number
  value: '22'
solution: |
  $y'=1-\dfrac{121}{x^{2}}=0$ при $x=11$. Производная меняет знак с минуса на плюс — это минимум: $y(11)=11+11=22$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
