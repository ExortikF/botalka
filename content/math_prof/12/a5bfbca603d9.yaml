statement: |
  Найдите точку максимума функции $y=x^{3}-147x+19.$
image: null
answer:
  type: number
  value: "-7"
solution: |
  Найдём производную: $y' = 3 x^{2} - 147$. Приравняем её к нулю: $x = -7$, $x = 7$. Из этих точек условию отвечает только $x = -7$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
