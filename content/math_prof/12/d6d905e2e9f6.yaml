statement: |
  Найдите точку минимума функции $y=(8x^{2}-40x+40)e^{x+4}.$
image: null
answer:
  type: number
  value: "3"
solution: |
  Найдём производную: $y' = 8 x \left(x - 3\right) e^{x + 4}$. Приравняем её к нулю: $x = 0$, $x = 3$. Из этих точек условию отвечает только $x = 3$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
