difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{36}{x}$ при $x>0$.
answer:
  type: number
  value: '12'
solution: |
  $y'=1-\dfrac{36}{x^{2}}=0$ при $x=6$. Производная меняет знак с минуса на плюс — это минимум: $y(6)=6+6=12$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
