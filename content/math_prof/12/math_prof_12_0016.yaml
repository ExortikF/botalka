id: math_prof_12_0016
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{144}{x}$ при $x>0$.
answer:
  type: number
  value: '24'
solution: |
  $y'=1-\dfrac{144}{x^{2}}=0$ при $x=12$. Производная меняет знак с минуса на плюс — это минимум: $y(12)=12+12=24$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
