id: math_prof_12_0003
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+17$ на отрезке $[0;\,4]$.
answer:
  type: number
  value: '15'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm1$; отрезку принадлежит $x=1$. Сравниваем: $y(0)=17$, $y(1)=15$, $y(4)=69$. Наименьшее — $15$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
