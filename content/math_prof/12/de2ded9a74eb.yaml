statement: |
  Найдите наибольшее значение функции
  $y=\ln (8x)-8x+7$
  на отрезке $[\frac{1}{16};\frac{5}{16}]$ .
image: null
answer:
  type: number
  value: "6"
solution: |
  Производная: $y' = -8 + \frac{1}{x}$. Нули производной: $x = \frac{1}{8}$. Значение сравниваем в критических точках и на концах отрезка $[\frac{1}{16}; \frac{5}{16}]$. Наибольшее значение достигается при $x = \frac{1}{8}$ и равно $6$.
