statement: |
  Найдите наименьшее значение функции
  $y=12\cos x+\frac{45x}{π}-4$
  на отрезке $[-\frac{2π}{3};0]$ .
image: null
answer:
  type: number
  value: "-40"
solution: |
  Производная: $y' = - 12 \sin{\left(x \right)} + \frac{45}{\pi}$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{2π}{3}; 0]$. Наименьшее значение достигается при $x = -2.0943951023932$ и равно $- \frac{94.2477796076938}{\pi} - 10.0$.
