statement: |
  Найдите точку минимума функции $y=2x^{2}-23x+33\cdot \ln x-17.$
image: null
answer:
  type: number
  value: "3"
solution: |
  Найдём производную: $y' = 4 x - 23 + \frac{33}{x}$. Приравняем её к нулю: $x = \frac{11}{4}$, $x = 3$. Из этих точек условию отвечает только $x = 3$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
