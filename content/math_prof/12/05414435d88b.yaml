statement: |
  Найдите точку минимума функции $y=2x^{\frac{3}{2}}-21x+16.$
image: null
answer:
  type: number
  value: "49"
solution: |
  Найдём производную: $y' = 3 \sqrt{x} - 21$. Приравняем её к нулю: $x = 49$. Слева от точки функция убывает, справа возрастает — это точка минимума.
