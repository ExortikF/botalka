statement: |
  Найдите точку максимума функции $y=3+18x-x^{\frac{3}{2}}.$
image: null
answer:
  type: number
  value: "144"
solution: |
  Найдём производную: $y' = 18 - \frac{3 \sqrt{x}}{2}$. Приравняем её к нулю: $x = 144$. Слева от точки функция возрастает, справа убывает — это точка максимума.
