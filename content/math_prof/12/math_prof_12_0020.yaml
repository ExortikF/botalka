id: math_prof_12_0020
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{100}{x}$ при $x>0$.
answer:
  type: number
  value: '20'
solution: |
  $y'=1-\dfrac{100}{x^{2}}=0$ при $x=10$. Производная меняет знак с минуса на плюс — это минимум: $y(10)=10+10=20$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
