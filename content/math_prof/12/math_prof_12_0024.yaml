statement: |
  Найдите наибольшее значение функции $y=-2x^{2}+16x-1$.
answer:
  type: number
  value: '31'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{16}{-4}=4$, $y(4)=31$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
