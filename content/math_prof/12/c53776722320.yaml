statement: |
  Найдите точку минимума функции $y=2x^{\frac{3}{2}}-15x+21.$
image: null
answer:
  type: number
  value: "25"
solution: |
  Найдём производную: $y' = 3 \sqrt{x} - 15$. Приравняем её к нулю: $x = 25$. Слева от точки функция убывает, справа возрастает — это точка минимума.
