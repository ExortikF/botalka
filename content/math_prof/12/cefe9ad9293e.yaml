statement: |
  Найдите точку максимума функции $y=(x+8)\cdot e^{12-x}.$
image: null
answer:
  type: number
  value: "-7"
solution: |
  Найдём производную: $y' = \left(- x - 7\right) e^{12 - x}$. Приравняем её к нулю: $x = -7$. Слева от точки функция возрастает, справа убывает — это точка максимума.
