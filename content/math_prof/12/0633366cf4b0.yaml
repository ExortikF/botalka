statement: |
  Найдите наименьшее значение функции
  $y=10\cos x-14x+5$
  на отрезке $[-\frac{3π}{2};0]$ .
image: null
answer:
  type: number
  value: "15"
solution: |
  Производная: $y' = - 10 \sin{\left(x \right)} - 14$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{3π}{2}; 0]$. Наименьшее значение достигается при $x = 0$ и равно $15$.
