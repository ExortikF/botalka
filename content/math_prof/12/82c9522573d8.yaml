statement: |
  Найдите точку максимума функции $y=x^{3}+16x^{2}+64x+12.$
image: null
answer:
  type: number
  value: "-8"
solution: |
  Найдём производную: $y' = 3 x^{2} + 32 x + 64$. Приравняем её к нулю: $x = -8$, $x = - \frac{8}{3}$. Из этих точек условию отвечает только $x = -8$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
