statement: |
  Найдите точку минимума функции $y=5x-\ln (x+3)^{5}+6$ .
image: null
answer:
  type: number
  value: "-2"
solution: |
  Найдём производную: $y' = \frac{5 \left(x + 2\right)}{x + 3}$. Приравняем её к нулю: $x = -2$. Слева от точки функция убывает, справа возрастает — это точка минимума.
