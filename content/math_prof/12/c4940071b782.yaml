statement: |
  Найдите наименьшее значение функции
  $y=3\cos x-5x+5$
  на отрезке $[-\frac{3π}{2};0]$ .
image: null
answer:
  type: number
  value: "8"
solution: |
  Производная: $y' = - 3 \sin{\left(x \right)} - 5$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{3π}{2}; 0]$. Наименьшее значение достигается при $x = 0$ и равно $8$.
