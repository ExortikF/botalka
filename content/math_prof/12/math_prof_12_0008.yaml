id: math_prof_12_0008
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+12$ на отрезке $[0;\,2]$.
answer:
  type: number
  value: '10'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm1$; отрезку принадлежит $x=1$. Сравниваем: $y(0)=12$, $y(1)=10$, $y(2)=14$. Наименьшее — $10$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
