difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{4}{x}$ при $x>0$.
answer:
  type: number
  value: '4'
solution: |
  $y'=1-\dfrac{4}{x^{2}}=0$ при $x=2$. Производная меняет знак с минуса на плюс — это минимум: $y(2)=2+2=4$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
