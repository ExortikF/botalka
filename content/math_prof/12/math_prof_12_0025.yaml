id: math_prof_12_0025
subject: math_prof
task_type: 12
difficulty: 2
statement: |
  Найдите наибольшее значение функции $y=-3x^{2}-6x-5$.
answer:
  type: number
  value: '-2'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{-6}{-6}=-1$, $y(-1)=-2$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
source:
