subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+3$ на отрезке $[0;\,4]$.
answer:
  type: number
  value: '1'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm1$; отрезку принадлежит $x=1$. Сравниваем: $y(0)=3$, $y(1)=1$, $y(4)=55$. Наименьшее — $1$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
