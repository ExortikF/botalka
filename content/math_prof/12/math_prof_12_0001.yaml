statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+5$ на отрезке $[0;\,3]$.
answer:
  type: number
  value: '3'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm 1$; отрезку принадлежит $x=1$. Сравним: $y(0)=5$, $y(1)=1-3+5=3$, $y(3)=27-9+5=23$. Наименьшее значение $3$.
hints:
  - 'Найдите критические точки, затем сравните значения на концах отрезка и в них.'
