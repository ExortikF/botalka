statement: |
  Найдите точку минимума функции $y=3x-3\cdot \ln (x-7)-8.$
image: null
answer:
  type: number
  value: "8"
solution: |
  Найдём производную: $y' = \frac{3 \left(x - 8\right)}{x - 7}$. Приравняем её к нулю: $x = 8$. Слева от точки функция убывает, справа возрастает — это точка минимума.
