statement: |
  Найдите точку минимума функции $y=x^{3}-27x^{2}+17.$
image: null
answer:
  type: number
  value: "18"
solution: |
  Найдём производную: $y' = 3 x \left(x - 18\right)$. Приравняем её к нулю: $x = 0$, $x = 18$. Из этих точек условию отвечает только $x = 18$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
