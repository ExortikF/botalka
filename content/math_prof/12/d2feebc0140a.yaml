statement: |
  Найдите точку минимума функции $y=9x-\ln (x-2)^{9}-8$ .
image: null
answer:
  type: number
  value: "3"
solution: |
  Найдём производную: $y' = \frac{9 \left(x - 3\right)}{x - 2}$. Приравняем её к нулю: $x = 3$. Слева от точки функция убывает, справа возрастает — это точка минимума.
