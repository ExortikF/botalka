statement: |
  Найдите наибольшее значение функции $y=-2x^{2}+12x-8$.
answer:
  type: number
  value: '10'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{12}{-4}=3$, $y(3)=10$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
