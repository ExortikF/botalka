statement: |
  Найдите наибольшее значение функции $y=-1x^{2}+10x-5$.
answer:
  type: number
  value: '20'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{10}{-2}=5$, $y(5)=20$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
