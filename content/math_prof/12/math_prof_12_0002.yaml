id: math_prof_12_0002
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-12x+2$ на отрезке $[0;\,3]$.
answer:
  type: number
  value: '-14'
solution: |
  $y'=3x^{2}-12=0$ при $x=\pm2$; отрезку принадлежит $x=2$. Сравниваем: $y(0)=2$, $y(2)=-14$, $y(3)=-7$. Наименьшее — $-14$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
