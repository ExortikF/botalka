statement: |
  Найдите наибольшее значение функции
  $y=9\ln (x+7)-9x+4$
  на отрезке $[-6,5;0]$ .
image: null
answer:
  type: number
  value: "58"
solution: |
  Производная: $y' = \frac{9 \left(- x - 6\right)}{x + 7}$. Нули производной: $x = -6$. Значение сравниваем в критических точках и на концах отрезка $[-6,5; 0]$. Наибольшее значение достигается при $x = -6$ и равно $58$.
