statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{81}{x}$ при $x>0$.
answer:
  type: number
  value: '18'
solution: |
  $y'=1-\dfrac{81}{x^{2}}=0$ при $x=9$. Производная меняет знак с минуса на плюс — это минимум: $y(9)=9+9=18$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
