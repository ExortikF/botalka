statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{49}{x}$ при $x>0$.
answer:
  type: number
  value: '14'
solution: |
  $y'=1-\dfrac{49}{x^{2}}=0$ при $x=7$. Производная меняет знак с минуса на плюс — это минимум: $y(7)=7+7=14$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
