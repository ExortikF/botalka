id: math_prof_12_0011
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+14$ на отрезке $[0;\,3]$.
answer:
  type: number
  value: '12'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm1$; отрезку принадлежит $x=1$. Сравниваем: $y(0)=14$, $y(1)=12$, $y(3)=32$. Наименьшее — $12$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
