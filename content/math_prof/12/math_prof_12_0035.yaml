statement: |
  Найдите наибольшее значение функции $y=-4x^{2}+24x+18$.
answer:
  type: number
  value: '54'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{24}{-8}=3$, $y(3)=54$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
