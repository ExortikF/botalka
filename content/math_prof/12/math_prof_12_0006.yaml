id: math_prof_12_0006
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-3x+6$ на отрезке $[0;\,2]$.
answer:
  type: number
  value: '4'
solution: |
  $y'=3x^{2}-3=0$ при $x=\pm1$; отрезку принадлежит $x=1$. Сравниваем: $y(0)=6$, $y(1)=4$, $y(2)=8$. Наименьшее — $4$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
