statement: |
  Найдите точку максимума функции $y=x^{3}-108x+23.$
image: null
answer:
  type: number
  value: "-6"
solution: |
  Найдём производную: $y' = 3 x^{2} - 108$. Приравняем её к нулю: $x = -6$, $x = 6$. Из этих точек условию отвечает только $x = -6$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
