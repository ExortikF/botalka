statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{9}{x}$ при $x>0$.
answer:
  type: number
  value: '6'
solution: |
  $y'=1-\dfrac{9}{x^{2}}=0$ при $x=3$. Производная меняет знак с минуса на плюс — это минимум: $y(3)=3+3=6$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
