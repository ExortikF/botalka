statement: |
  Найдите точку максимума функции $y=3,5x^{2}-29x+30\cdot \ln x+67.$
image: null
answer:
  type: number
  value: "2"
solution: |
  Найдём производную: $y' = 7 x - 29 + \frac{30}{x}$. Приравняем её к нулю: $x = 2$, $x = \frac{15}{7}$. Из этих точек условию отвечает только $x = 2$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
