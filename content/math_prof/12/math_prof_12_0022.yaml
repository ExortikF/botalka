statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{25}{x}$ при $x>0$.
answer:
  type: number
  value: '10'
solution: |
  $y'=1-\dfrac{25}{x^{2}}=0$ при $x=5$. Производная меняет знак с минуса на плюс — это минимум: $y(5)=5+5=10$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
