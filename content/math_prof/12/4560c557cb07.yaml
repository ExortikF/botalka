statement: |
  Найдите точку максимума функции $y=10\cdot \ln (x-2)-10x+11$ .
image: null
answer:
  type: number
  value: "3"
solution: |
  Найдём производную: $y' = \frac{10 \left(3 - x\right)}{x - 2}$. Приравняем её к нулю: $x = 3$. Слева от точки функция возрастает, справа убывает — это точка максимума.
