statement: |
  Найдите наименьшее значение функции
  $y=9x-\ln (x+5)^{9}$
  на отрезке $[-4,5;0]$ .
image: null
answer:
  type: number
  value: "-36"
solution: |
  Производная: $y' = \frac{9 \left(x + 4\right)}{x + 5}$. Нули производной: $x = -4$. Значение сравниваем в критических точках и на концах отрезка $[-4,5; 0]$. Наименьшее значение достигается при $x = -4$ и равно $-36$.
