statement: |
  Найдите наименьшее значение функции $y=x+\dfrac{16}{x}$ при $x>0$.
answer:
  type: number
  value: '8'
solution: |
  $y'=1-\dfrac{16}{x^{2}}=0$ при $x=4$. Производная меняет знак с минуса на плюс — это минимум: $y(4)=4+4=8$.
hints:
  - 'Приравняйте производную к нулю; берём положительный корень.'
