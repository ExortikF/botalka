statement: |
  Найдите точку минимума функции $y=x^{3}-192x+11.$
image: null
answer:
  type: number
  value: "8"
solution: |
  Найдём производную: $y' = 3 x^{2} - 192$. Приравняем её к нулю: $x = -8$, $x = 8$. Из этих точек условию отвечает только $x = 8$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
