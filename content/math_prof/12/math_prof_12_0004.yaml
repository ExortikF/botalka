id: math_prof_12_0004
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции $y=x^{3}-12x+16$ на отрезке $[0;\,4]$.
answer:
  type: number
  value: '0'
solution: |
  $y'=3x^{2}-12=0$ при $x=\pm2$; отрезку принадлежит $x=2$. Сравниваем: $y(0)=16$, $y(2)=0$, $y(4)=32$. Наименьшее — $0$.
hints:
  - 'Найдите критические точки и сравните значения на концах отрезка и в них.'
