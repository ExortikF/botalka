statement: |
  Найдите наибольшее значение функции $y=-3x^{2}-30x+18$.
answer:
  type: number
  value: '93'
solution: |
  Ветви параболы направлены вниз, максимум в вершине: $x_0=-\dfrac{b}{2a}=-\dfrac{-30}{-6}=-5$, $y(-5)=93$.
hints:
  - 'У параболы с отрицательным старшим коэффициентом максимум в вершине.'
