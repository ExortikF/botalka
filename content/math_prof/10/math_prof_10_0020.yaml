id: math_prof_10_0020
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $30$ км. Если бы он увеличил скорость на $20$ км/ч, то потратил бы на $2$ часа меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '10'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{30}{v}-\dfrac{30}{v+20}=2$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=10$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
