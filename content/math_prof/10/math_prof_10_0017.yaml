id: math_prof_10_0017
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $120$ км. Если бы он увеличил скорость на $10$ км/ч, то потратил бы на $1$ час меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '30'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{120}{v}-\dfrac{120}{v+10}=1$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=30$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
