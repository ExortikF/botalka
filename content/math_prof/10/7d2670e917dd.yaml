id: fipi_7d2670e917dd
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Первые 200 км автомобиль ехал со скоростью 60 км/ч, следующие 180 км — со скоростью 90 км/ч, а затем 140 км — со скоростью 120 км/ч. Найдите среднюю скорость автомобиля на протяжении всего пути. Ответ дайте в км/ч.
image: null
answer:
  type: number
  value: "80"
solution: |
  Весь путь: $\frac{200}{60} + \frac{180}{90} + \frac{140}{120} = 520$. Всё время: $\frac{13}{2}$. Средняя скорость — это весь путь, делённый на всё время: $520:\frac{13}{2}=80$.
