id: math_prof_10_0034
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $1700$ рублей. Сначала его уценили на $40\%$, а затем ещё на $50\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '510'
solution: |
  После первой скидки: $1700\cdot 0,6=1020$ р. После второй: $1020\cdot 0,5=510$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
