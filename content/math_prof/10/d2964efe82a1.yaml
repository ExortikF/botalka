id: fipi_d2964efe82a1
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Первый час автомобиль ехал со скоростью 120 км/ч, следующие три часа — со скоростью 105 км/ч, а затем три часа — со скоростью 65 км/ч. Найдите среднюю скорость автомобиля на протяжении всего пути. Ответ дайте в км/ч.
image: null
answer:
  type: number
  value: "90"
solution: |
  Весь путь: $120\cdot 1 + 105\cdot 3 + 65\cdot 3 = 630$. Всё время: $7$. Средняя скорость — это весь путь, делённый на всё время: $630:7=90$.
