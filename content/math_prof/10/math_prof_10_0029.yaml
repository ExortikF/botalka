id: math_prof_10_0029
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $4800$ рублей. Сначала его уценили на $25\%$, а затем ещё на $20\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '2880'
solution: |
  После первой скидки: $4800\cdot 0,75=3600$ р. После второй: $3600\cdot 0,8=2880$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
