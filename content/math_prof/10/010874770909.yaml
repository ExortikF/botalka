id: fipi_010874770909
subject: math_prof
task_type: 10
difficulty: 5
statement: |
  Имеется два сплава. Первый сплав содержит 45% меди, второй $—$ 20% меди. Масса первого сплава больше массы второго на 30 кг. Из этих двух сплавов получили третий сплав, содержащий 40% меди. Найдите массу третьего сплава. Ответ дайте в килограммах.
image: null
answer:
  type: number
  value: "50"
solution: |
  Пусть масса второго сплава $m$, тогда первого $m+30$.
  Меди в них: $0{,}45(m+30)+0{,}2m$, а в третьем сплаве
  $0{,}4(2m+30)$. Приравняем: $0{,}65m+13{,}5=0{,}8m+12$, откуда $m=10$.
  Масса третьего сплава: $2\cdot 10+30=50$ кг.
