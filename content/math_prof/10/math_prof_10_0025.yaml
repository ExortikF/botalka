id: math_prof_10_0025
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $1900$ рублей. Сначала его уценили на $40\%$, а затем ещё на $50\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '570'
solution: |
  После первой скидки: $1900\cdot 0,6=1140$ р. После второй: $1140\cdot 0,5=570$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
