id: math_prof_10_0027
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $3400$ рублей. Сначала его уценили на $50\%$, а затем ещё на $25\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '1275'
solution: |
  После первой скидки: $3400\cdot 0,5=1700$ р. После второй: $1700\cdot 0,75=1275$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
