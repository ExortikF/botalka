subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Смешали $6$ кг раствора с концентрацией соли $10\%$ и $4$ кг раствора с концентрацией $20\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '14'
solution: |
  Соли: $6\cdot 0,1+4\cdot 0,2=1,4$ кг на $10$ кг раствора. Концентрация: $\dfrac{1,4}{10}=0,14$, то есть $14\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
