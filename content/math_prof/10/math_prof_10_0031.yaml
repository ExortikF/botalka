id: math_prof_10_0031
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $4900$ рублей. Сначала его уценили на $40\%$, а затем ещё на $50\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '1470'
solution: |
  После первой скидки: $4900\cdot 0,6=2940$ р. После второй: $2940\cdot 0,5=1470$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
