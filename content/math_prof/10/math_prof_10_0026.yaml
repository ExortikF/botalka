id: math_prof_10_0026
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $400$ рублей. Сначала его уценили на $25\%$, а затем ещё на $10\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '270'
solution: |
  После первой скидки: $400\cdot 0,75=300$ р. После второй: $300\cdot 0,9=270$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
