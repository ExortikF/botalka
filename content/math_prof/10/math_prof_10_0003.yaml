subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Смешали $2$ кг раствора с концентрацией соли $5\%$ и $8$ кг раствора с концентрацией $25\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '21'
solution: |
  Соли: $2\cdot 0,05+8\cdot 0,25=2,1$ кг на $10$ кг раствора. Концентрация: $\dfrac{2,1}{10}=0,21$, то есть $21\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
