difficulty: 3
statement: |
  Смешали $2$ кг раствора с концентрацией соли $25\%$ и $8$ кг раствора с концентрацией $5\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '9'
solution: |
  Соли: $2\cdot 0,25+8\cdot 0,05=0,9$ кг на $10$ кг раствора. Концентрация: $\dfrac{0,9}{10}=0,09$, то есть $9\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
