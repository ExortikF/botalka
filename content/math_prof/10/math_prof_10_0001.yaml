subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Смешали $4$ кг раствора с концентрацией соли $15\%$ и $6$ кг раствора с концентрацией $25\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '21'
solution: |
  Соли: $4\cdot 0{,}15+6\cdot 0{,}25=0{,}6+1{,}5=2{,}1$ кг на $10$ кг раствора. Концентрация: $\dfrac{2{,}1}{10}=0{,}21$, то есть $21\%$.
hints:
  - 'Посчитайте массу соли отдельно, а затем разделите на общую массу.'
source:
