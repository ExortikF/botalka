id: math_prof_10_0013
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $60$ км. Если бы он увеличил скорость на $10$ км/ч, то потратил бы на $3$ часа меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '10'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{60}{v}-\dfrac{60}{v+10}=3$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=10$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
