difficulty: 3
statement: |
  Смешали $6$ кг раствора с концентрацией соли $5\%$ и $4$ кг раствора с концентрацией $20\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '11'
solution: |
  Соли: $6\cdot 0,05+4\cdot 0,2=1,1$ кг на $10$ кг раствора. Концентрация: $\dfrac{1,1}{10}=0,11$, то есть $11\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
