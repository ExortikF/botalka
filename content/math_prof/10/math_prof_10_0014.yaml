id: math_prof_10_0014
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $30$ км. Если бы он увеличил скорость на $15$ км/ч, то потратил бы на $1$ час меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '15'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{30}{v}-\dfrac{30}{v+15}=1$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=15$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
