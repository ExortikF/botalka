difficulty: 3
statement: |
  Смешали $10$ кг раствора с концентрацией соли $5\%$ и $2$ кг раствора с концентрацией $35\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '10'
solution: |
  Соли: $10\cdot 0,05+2\cdot 0,35=1,2$ кг на $12$ кг раствора. Концентрация: $\dfrac{1,2}{12}=0,1$, то есть $10\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
