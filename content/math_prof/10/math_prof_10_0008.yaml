subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Смешали $4$ кг раствора с концентрацией соли $35\%$ и $6$ кг раствора с концентрацией $10\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '20'
solution: |
  Соли: $4\cdot 0,35+6\cdot 0,1=2$ кг на $10$ кг раствора. Концентрация: $\dfrac{2}{10}=0,2$, то есть $20\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
