difficulty: 3
statement: |
  Смешали $8$ кг раствора с концентрацией соли $10\%$ и $8$ кг раствора с концентрацией $20\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '15'
solution: |
  Соли: $8\cdot 0,1+8\cdot 0,2=2,4$ кг на $16$ кг раствора. Концентрация: $\dfrac{2,4}{16}=0,15$, то есть $15\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
