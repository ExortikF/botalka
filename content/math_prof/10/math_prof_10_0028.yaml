id: math_prof_10_0028
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $300$ рублей. Сначала его уценили на $25\%$, а затем ещё на $20\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '180'
solution: |
  После первой скидки: $300\cdot 0,75=225$ р. После второй: $225\cdot 0,8=180$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
