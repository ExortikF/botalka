subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Смешали $2$ кг раствора с концентрацией соли $20\%$ и $8$ кг раствора с концентрацией $15\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '16'
solution: |
  Соли: $2\cdot 0,2+8\cdot 0,15=1,6$ кг на $10$ кг раствора. Концентрация: $\dfrac{1,6}{10}=0,16$, то есть $16\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
