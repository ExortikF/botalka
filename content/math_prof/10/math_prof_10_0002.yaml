statement: |
  Велосипедист проехал $60$ км. Если бы он увеличил скорость на $10$ км/ч, то потратил бы на $3$ часа меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '10'
solution: |
  Пусть скорость равна $v$. Тогда $\dfrac{60}{v}-\dfrac{60}{v+10}=3$. Умножим на $v(v+10)$: $600=3v^{2}+30v$, то есть $v^{2}+10v-200=0$. Корни $v=10$ и $v=-20$; скорость положительна, значит $v=10$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость не может быть отрицательной.'
source: "собственная"
