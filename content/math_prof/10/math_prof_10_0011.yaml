difficulty: 3
statement: |
  Смешали $6$ кг раствора с концентрацией соли $25\%$ и $6$ кг раствора с концентрацией $35\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '30'
solution: |
  Соли: $6\cdot 0,25+6\cdot 0,35=3,6$ кг на $12$ кг раствора. Концентрация: $\dfrac{3,6}{12}=0,3$, то есть $30\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
