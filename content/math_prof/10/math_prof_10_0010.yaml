difficulty: 3
statement: |
  Смешали $4$ кг раствора с концентрацией соли $10\%$ и $6$ кг раствора с концентрацией $35\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '25'
solution: |
  Соли: $4\cdot 0,1+6\cdot 0,35=2,5$ кг на $10$ кг раствора. Концентрация: $\dfrac{2,5}{10}=0,25$, то есть $25\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
