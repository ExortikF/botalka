id: math_prof_10_0023
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $270$ км. Если бы он увеличил скорость на $15$ км/ч, то потратил бы на $3$ часа меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '30'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{270}{v}-\dfrac{270}{v+15}=3$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=30$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
