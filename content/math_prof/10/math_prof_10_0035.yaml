id: math_prof_10_0035
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $2200$ рублей. Сначала его уценили на $20\%$, а затем ещё на $20\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '1408'
solution: |
  После первой скидки: $2200\cdot 0,8=1760$ р. После второй: $1760\cdot 0,8=1408$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
