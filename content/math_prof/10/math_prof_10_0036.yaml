id: math_prof_10_0036
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Товар стоил $3300$ рублей. Сначала его уценили на $20\%$, а затем ещё на $50\%$ от новой цены. Сколько рублей стоит товар теперь?
answer:
  type: number
  value: '1320'
solution: |
  После первой скидки: $3300\cdot 0,8=2640$ р. После второй: $2640\cdot 0,5=1320$ р. Скидки не складываются — множители перемножаются.
hints:
  - 'Скидка на $p\%$ — это умножение на $1-\dfrac{p}{100}$.'
source:
