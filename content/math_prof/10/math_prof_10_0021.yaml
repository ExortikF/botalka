id: math_prof_10_0021
subject: math_prof
task_type: 10
difficulty: 4
statement: |
  Велосипедист проехал $75$ км. Если бы он увеличил скорость на $10$ км/ч, то потратил бы на $2$ часа меньше. Найдите скорость велосипедиста (в км/ч).
answer:
  type: number
  value: '15'
solution: |
  Пусть скорость $v$. Тогда $\dfrac{75}{v}-\dfrac{75}{v+10}=2$. После приведения к общему знаменателю получаем квадратное уравнение, положительный корень $v=15$.
hints:
  - 'Обозначьте скорость за $v$ и выразите оба времени в пути.'
  - 'Отрицательный корень отбрасываем — скорость положительна.'
