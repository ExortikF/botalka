difficulty: 3
statement: |
  Смешали $6$ кг раствора с концентрацией соли $35\%$ и $4$ кг раствора с концентрацией $15\%$. Найдите концентрацию соли в полученном растворе (в процентах).
answer:
  type: number
  value: '27'
solution: |
  Соли: $6\cdot 0,35+4\cdot 0,15=2,7$ кг на $10$ кг раствора. Концентрация: $\dfrac{2,7}{10}=0,27$, то есть $27\%$.
hints:
  - 'Посчитайте массу соли отдельно, затем разделите на общую массу.'
