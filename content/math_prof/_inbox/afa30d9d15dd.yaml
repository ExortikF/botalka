statement: |
  Водолазный колокол, содержащий $υ=3$ моль воздуха при давлении
  $p_{1}=1,4$ атмосферы, медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного давления $p_{2}$
  (в атмосферах). Работа A (в Дж), совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{p_{2}}{p_{1}}$ , где $α=10,9 \frac{Дж}{моль\cdot K} —$ постоянная, $T=300K —$ температура воздуха. Найдите давление $p_{2}$ воздуха в колоколе, если при сжатии воздуха была совершена работа 29 430 Дж. Ответ дайте в атмосферах.
