statement: |
  Найдите точку минимума функции $y=x^{\frac{3}{2}}-3x+9.$
image: null
answer:
  type: number
  value: "4"
solution: |
  Найдём производную: $y' = \frac{3 \sqrt{x}}{2} - 3$. Приравняем её к нулю: $x = 4$. Слева от точки функция убывает, справа возрастает — это точка минимума.
