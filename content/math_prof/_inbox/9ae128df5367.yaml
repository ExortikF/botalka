statement: |
  Найдите точку максимума функции $y=\ln (x-2)-5x+13.$
image: null
answer:
  type: number
  value: "2,2"
solution: |
  Найдём производную: $y' = \frac{11 - 5 x}{x - 2}$. Приравняем её к нулю: $x = \frac{11}{5}$. Слева от точки функция возрастает, справа убывает — это точка максимума.
