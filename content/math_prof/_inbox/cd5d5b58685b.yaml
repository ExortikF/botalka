statement: |
  Автомобиль разгоняется на прямолинейном участке шоссе с постоянным ускорением $a$ (в $км/​ч^{2}$ ). Скорость $v$ (в км/ч) вычисляется по формуле $v=\sqrt{2la},$ где $l —$ пройденный автомобилем путь (в км). Найдите ускорение, с которым должен двигаться автомобиль, чтобы, проехав 0,4 км, развить скорость 80 км/ч. Ответ дайте в $км/​ч^{2}​.$
