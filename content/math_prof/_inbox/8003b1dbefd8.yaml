difficulty: 3
statement: |
  На рисунке изображены график функции $y=f(x)$ и касательная к нему
  в точке с абсциссой $x_{0}.$ Найдите значение производной функции $f(x)$
  в точке $x_{0}.$
  [[img:math_prof/img/xs3qstsrcF184B03BC6F8A810477429208FAA81DA_1_1638185262.png]]
image: math_prof/img/xs3qstsrcF184B03BC6F8A810477429208FAA81DA_1_1638185262.png
answer:
  type: number
  value: "-0,25"
solution: |
  Производная в точке касания равна угловому коэффициенту касательной.
  На касательной отмечены точки $(-3;5)$ и $(5;3)$, поэтому
  $f'(x_{0})=\frac{3-5}{5-(-3)}=\frac{-2}{8}=-0{,}25$.
