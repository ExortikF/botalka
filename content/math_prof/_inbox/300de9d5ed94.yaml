id: fipi_300de9d5ed94
subject: math_prof
task_type: 5
difficulty: 3
statement: |
  Игральную кость бросили два раза. Известно, что шесть очков не выпало ни разу. Найдите при этом условии вероятность события «сумма очков равна 10».
image: null
answer:
  type: number
  value: "0,04"
solution: |
  Шестёрка не выпадала, значит на каждой кости от $1$ до $5$ — всего $25$ равновозможных исходов. Сумму $10$ дают $1$ из них, поэтому вероятность равна $\frac{1}{25}$.
