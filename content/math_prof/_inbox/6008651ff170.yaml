statement: |
  Найдите точку минимума функции $y=x^{2}-20x+48\ln x-97.$
image: null
answer:
  type: number
  value: "6"
solution: |
  Найдём производную: $y' = 2 x - 20 + \frac{48}{x}$. Приравняем её к нулю: $x = 4$, $x = 6$. Из этих точек условию отвечает только $x = 6$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
