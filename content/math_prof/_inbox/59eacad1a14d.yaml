statement: |
  При сближении источника и приёмника звуковых сигналов, движущихся
  в некоторой среде по прямой навстречу друг другу со скоростями $u$ и $v$ (в м/с) соответственно, частота звукового сигнала $f$ (в Гц), регистрируемого приёмником, вычисляется по формуле $f=f_{0}\cdot \frac{c+u}{c-v}$ , где $f_{0}=100Гц —$ частота исходного сигнала, $c —$ скорость распространения сигнала в среде (в м/с),
  а $u=29м/​с$ и $v=11м/​с —$ скорости приёмника и источника относительно среды. При какой скорости $c$ распространения сигнала в среде частота
  сигнала $f$ в приёмнике будет равна 110 Гц? Ответ дайте в м/с.
