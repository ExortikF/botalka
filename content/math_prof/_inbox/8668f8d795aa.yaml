statement: |
  Найдите точку максимума функции $y=\ln (x+3)^{7}-7x-9$ .
image: null
answer:
  type: number
  value: "-2"
solution: |
  Найдём производную: $y' = \frac{7 \left(- x - 2\right)}{x + 3}$. Приравняем её к нулю: $x = -2$. Слева от точки функция возрастает, справа убывает — это точка максимума.
