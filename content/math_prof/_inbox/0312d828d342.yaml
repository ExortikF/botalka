statement: |
  Найдите наименьшее значение функции
  $y=10\cos x+14x+9$
  на отрезке $[0;\frac{3π}{2}]$ .
image: null
answer:
  type: number
  value: "19"
solution: |
  Производная: $y' = 14 - 10 \sin{\left(x \right)}$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[0; \frac{3π}{2}]$. Наименьшее значение достигается при $x = 0$ и равно $19$.
