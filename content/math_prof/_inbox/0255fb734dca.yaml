id: fipi_0255fb734dca
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Первый час автомобиль ехал со скоростью 115 км/ч, следующие три часа — со скоростью 45 км/ч, а затем два часа — со скоростью 40 км/ч. Найдите среднюю скорость автомобиля на протяжении всего пути. Ответ дайте в км/ч.
image: null
answer:
  type: number
  value: "55"
solution: |
  Весь путь: $115\cdot 1+45\cdot 3+40\cdot 2=115+135+80=330$ км.
  Всё время: $1+3+2=6$ ч. Средняя скорость — это весь путь, делённый на всё
  время: $330:6=55$ км/ч. Складывать скорости и делить на три нельзя.
