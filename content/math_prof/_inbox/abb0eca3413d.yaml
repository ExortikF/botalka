statement: |
  В ходе распада радиоактивного изотопа его масса m (в мг) уменьшается
  по закону $m=m_{0}\cdot 2^{-\frac{τ}{T}}$ , где $m_{0}$ — начальная масса изотопа (в мг), $τ$ — время, прошедшее от начального момента, в минутах, $T$ — период полураспада
  в минутах. В начальный момент времени масса изотопа 156 мг. Период его полураспада составляет 8 минут. Найдите, через сколько минут масса изотопа будет равна 39 мг.
