statement: |
  В треугольнике $ABC$ угол $C$ равен $90°$ , $AB=10$ , $AC=\sqrt{51}$ . Найдите $\sin A$ .
image: math_prof/img/xs3qstsrcDA5103E67E0BB354406C6ACF8BFC2E84_1_1478531281.png
answer:
  type: number
  value: "0,7"
solution: |
  По теореме Пифагора $BC=\sqrt{AB^{2}-AC^{2}}=\sqrt{100-51}=7$.
  Синус острого угла — отношение противолежащего катета к гипотенузе:
  $\sin A=\frac{BC}{AB}=\frac{7}{10}=0{,}7$.
