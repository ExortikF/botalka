statement: |
  Водолазный колокол, содержащий $υ=3$ моль воздуха объёмом $V_{1}=80л$ , медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного объёма $V_{2}$ (в л). Работа, совершаемая
  водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{V_{1}}{V_{2}}$ ,
  где $α=5,8\frac{Дж}{моль\cdot К} —$ постоянная, $T=300К —$ температура воздуха. Найдите, какой объём $V_{2}$ будет занимать воздух в колоколе, если при сжатии воздуха была совершена работа в 20 880 Дж. Ответ дайте в литрах.
image: null
answer:
  type: number
  value: "5"
solution: |
  Подставим известные величины в формулу работы:
  $5{,}8\cdot 3\cdot 300\cdot \log_{2}\frac{80}{V_{2}}=20880$.
  Слева получается $5220\log_{2}\frac{80}{V_{2}}$, поэтому
  $\log_{2}\frac{80}{V_{2}}=4$, то есть $\frac{80}{V_{2}}=16$ и $V_{2}=5$.
