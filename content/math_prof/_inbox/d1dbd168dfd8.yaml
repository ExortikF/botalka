statement: |
  В ходе распада радиоактивного изотопа его масса m (в мг) уменьшается
  по закону $m=m_{0}\cdot 2^{-\frac{τ}{T}}​,$ где $m_{0} —$ начальная масса изотопа (в мг), $τ —$ время (в минутах), прошедшее от начального момента, $T —$ период полураспада
  (в минутах). В начальный момент времени масса изотопа равна 196 мг. Период его полураспада составляет 4 минуты. Найдите, через сколько минут масса изотопа будет равна 49 мг.
