statement: |
  Водолазный колокол, содержащий $υ=6$ моль воздуха при давлении
  $p_{1}=2,5$ атмосферы, медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного давления $p_{2}$
  (в атмосферах). Работа (в джоулях), совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{p_{2}}{p_{1}}$ , где $α=5,75 \frac{Дж}{моль\cdot K} —$ постоянная, $T=300K —$ температура воздуха. Найдите, какое давление $p_{2}$ будет иметь воздух в колоколе, если при сжатии воздуха была совершена работа в 10 350 Дж. Ответ дайте в атмосферах.
