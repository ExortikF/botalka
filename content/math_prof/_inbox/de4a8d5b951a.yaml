statement: |
  Найдите точку максимума функции $y=x^{3}+10x^{2}+25x+16.$
image: null
answer:
  type: number
  value: "-5"
solution: |
  Найдём производную: $y' = 3 x^{2} + 20 x + 25$. Приравняем её к нулю: $x = -5$, $x = - \frac{5}{3}$. Из этих точек условию отвечает только $x = -5$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
