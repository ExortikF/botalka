statement: |
  Даны векторы $\overrightarrow{a}(2;1)$ и $\overrightarrow{b}(2;-4).$ Найдите скалярное произведение векторов $\overrightarrow{a}+\overrightarrow{b}$ и $7\overrightarrow{a}-\overrightarrow{b}.$
image: null
answer:
