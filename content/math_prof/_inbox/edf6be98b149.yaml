statement: |
  Водолазный колокол, содержащий $υ=3$ моль воздуха объёмом $V_{1}=16л$ , медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного объёма $V_{2}$ (в л). Работа (в Дж), совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{V_{1}}{V_{2}}$ ,
  где $α=9,9 \frac{Дж}{моль\cdot К} —$ постоянная, $T=300К —$ температура воздуха. Найдите, какой объём $V_{2}$ будет занимать воздух в колоколе, если при сжатии воздуха была совершена работа 26 730 Дж. Ответ дайте в литрах.
