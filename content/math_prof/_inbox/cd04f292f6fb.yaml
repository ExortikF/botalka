statement: |
  В чемпионате по гимнастике участвуют 45 спортсменок: 6 из России,
  21 из США, остальные — из Китая. Порядок, в котором выступают гимнастки, определяется жребием. Найдите вероятность того,
  что спортсменка, выступающая первой, окажется из Китая.
image: null
answer:
  type: number
  value: "0,4"
solution: |
  Порядок выступления определяется жребием, поэтому для любого места вероятность одна и та же — это доля: $\frac{18}{45}=\frac{2}{5}$.
