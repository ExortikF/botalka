statement: |
  Стрелок стреляет по одному разу по каждой из четырёх мишеней. Вероятность попадания в мишень при каждом отдельном выстреле равна 0,2. Найдите вероятность того, что стрелок попадёт в три первые мишени и не попадёт в последнюю.
image: null
answer:
  type: number
  value: "0,0064"
solution: |
  Выстрелы независимы, поэтому вероятности перемножаются: $\frac{1}{5}^{3}\cdot(\frac{4}{5})^{1}=\frac{4}{625}$.
