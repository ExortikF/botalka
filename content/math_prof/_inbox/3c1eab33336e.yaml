statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}.$ Найдите значение $f(5).$
  [[img:math_prof/img/xs3qstsrc3C1EAB33336E808C47BF3E6B9F4CD3FE_5_1721135760.png]]
image: math_prof/img/xs3qstsrc3C1EAB33336E808C47BF3E6B9F4CD3FE_5_1721135760.png
answer:
  type: number
  value: "32"
solution: |
  График проходит через точку $(1;2)$, поэтому $a^{1}=2$ и $a=2$.
  Тогда $f(5)=2^{5}=32$.
