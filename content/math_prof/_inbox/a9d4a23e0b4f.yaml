statement: |
  Найдите точку максимума функции $y=9\cdot \ln (x-4)-9x-7.$
image: null
answer:
  type: number
  value: "5"
solution: |
  Найдём производную: $y' = \frac{9 \left(5 - x\right)}{x - 4}$. Приравняем её к нулю: $x = 5$. Слева от точки функция возрастает, справа убывает — это точка максимума.
