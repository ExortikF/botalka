statement: |
  Найдите точку минимума функции $y=10x-\ln (x-5)+3.$
image: null
answer:
  type: number
  value: "5,1"
solution: |
  Найдём производную: $y' = \frac{10 x - 51}{x - 5}$. Приравняем её к нулю: $x = \frac{51}{10}$. Слева от точки функция убывает, справа возрастает — это точка минимума.
