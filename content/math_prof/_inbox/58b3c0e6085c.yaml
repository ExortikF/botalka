statement: |
  Найдите точку максимума функции $y=x^{3}-27x+14.$
image: null
answer:
  type: number
  value: "-3"
solution: |
  Найдём производную: $y' = 3 x^{2} - 27$. Приравняем её к нулю: $x = -3$, $x = 3$. Из этих точек условию отвечает только $x = -3$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
