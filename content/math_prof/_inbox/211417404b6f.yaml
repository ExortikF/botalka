statement: |
  В треугольнике $ABC$ угол $C$ равен $90°$ , $AB=10$ , $AC=\sqrt{91}$ . Найдите $\sin A$ .
image: math_prof/img/xs3qstsrc1845EC69297E96CD4D230DBE53F23AD0_1_1478531283.png
answer:
  type: number
  value: "0,3"
solution: |
  По теореме Пифагора $BC=\sqrt{AB^{2}-AC^{2}}=\sqrt{100-91}=3$.
  Синус острого угла — противолежащий катет к гипотенузе:
  $\sin A=\frac{3}{10}=0{,}3$.
