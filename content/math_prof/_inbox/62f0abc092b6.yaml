statement: |
  Два тела, массой $m=6кг$ каждое, движутся с одинаковой скоростью $v=9м/​c$ под углом $2α$ друг к другу. Энергия (в Дж), выделяющаяся при их абсолютно неупругом соударении, вычисляется по формуле $Q=mv^{2}\sin ^{2}α$ , где $m —$ масса (в кг), $v —$ скорость (в м/с). Найдите, под каким углом $2α$ должны двигаться тела, чтобы в результате соударения выделилась энергия, равная 243 Дж. Ответ дайте в градусах.
