statement: |
  Найдите точку максимума функции $y=x^{3}+14x^{2}+49x+8.$
image: null
answer:
  type: number
  value: "-7"
solution: |
  Найдём производную: $y' = 3 x^{2} + 28 x + 49$. Приравняем её к нулю: $x = -7$, $x = - \frac{7}{3}$. Из этих точек условию отвечает только $x = -7$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
