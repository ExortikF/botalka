statement: |
  Найдите точку максимума функции $y=x^{2}-33x+136\cdot \ln x+74.$
image: null
answer:
  type: number
  value: "8"
solution: |
  Найдём производную: $y' = 2 x - 33 + \frac{136}{x}$. Приравняем её к нулю: $x = 8$, $x = \frac{17}{2}$. Из этих точек условию отвечает только $x = 8$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
