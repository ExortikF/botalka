statement: |
  Четырёхугольник $ABCD$ вписан в окружность. Угол $ABD$ равен $61°$ , угол $CAD$ равен $37°$ . Найдите угол $ABC$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc6DACDAD1821CA4CC437A88C8C5F508A1_1_1478531303.png
answer:
  type: number
  value: "98"
solution: |
  Углы $DBC$ и $CAD$ опираются на одну дугу $DC$, значит $\angle DBC=37°$.
  Угол $ABC$ складывается из двух: $\angle ABC=\angle ABD+\angle DBC=61°+37°=98°$.
