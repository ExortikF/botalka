statement: |
  Цилиндр и конус имеют общие основание и высоту. Объём цилиндра равен 6. Найдите объём конуса.
image: math_prof/img/xs3qstsrc5BF86854055A90134664B8AB946AA964_1_1478533894.png
answer:
