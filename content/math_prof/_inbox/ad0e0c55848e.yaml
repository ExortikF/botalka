statement: |
  Для сматывания кабеля на заводе используют лебёдку, которая равноускоренно наматывает кабель на катушку. Угол, на который поворачивается катушка, изменяется со временем по закону $φ=ωt+\frac{βt^{2}}{2}$ ,
  где $t —$ время в минутах, прошедшее после начала работы лебёдки, $ω=15град./мин —$ начальная угловая скорость вращения катушки,
  а $β=6град./мин^{2} —$ угловое ускорение, с которым наматывается кабель. Определите время, прошедшее после начала работы лебёдки, если известно, что за это время угол намотки $φ$ достиг $2250°$ . Ответ дайте в минутах.
