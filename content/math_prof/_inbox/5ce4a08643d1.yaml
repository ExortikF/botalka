statement: |
  На рисунке изображён график функции вида $f(x)=\log _{a}x$ . Найдите
  значение $f(8)$ .
  [[img:math_prof/img/xs3qstsrc89C957CD3CC792E8407031B4798BC7CA_1_1644584841.png]]
image: math_prof/img/xs3qstsrc89C957CD3CC792E8407031B4798BC7CA_1_1644584841.png
answer:
  type: number
  value: "3"
solution: |
  График проходит через точку $(2;1)$, поэтому $\log_{a}2=1$ и $a=2$.
  Тогда $f(8)=\log_{2}8=3$.
