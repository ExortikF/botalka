statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}$ . Найдите
  значение $f(-3)$ .
  [[img:math_prof/img/xs3qstsrcDB3325CA4E43B17B4AB2D257A6EC0E62_1_1644584802.png]]
image: math_prof/img/xs3qstsrcDB3325CA4E43B17B4AB2D257A6EC0E62_1_1644584802.png
answer:
  type: number
  value: "8"
solution: |
  График убывает и проходит через точку $(-1;2)$, поэтому $a^{-1}=2$ и
  $a=\frac{1}{2}$.
  Тогда $f(-3)=\left(\frac{1}{2}\right)^{-3}=2^{3}=8$.
