statement: |
  Найдите наименьшее значение функции
  $y=9x-9\ln (x+11)+7$
  на отрезке $[-10,5;0]$ .
image: null
answer:
  type: number
  value: "-83"
solution: |
  Производная: $y' = \frac{9 \left(x + 10\right)}{x + 11}$. Нули производной: $x = -10$. Значение сравниваем в критических точках и на концах отрезка $[-10,5; 0]$. Наименьшее значение достигается при $x = -10$ и равно $-83$.
