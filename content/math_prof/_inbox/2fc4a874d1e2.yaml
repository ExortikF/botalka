statement: |
  Отрезки $AC$ и $BD —$ диаметры окружности
  с центром $O.$ Угол $ACB$ равен $59°.$ Найдите
  угол $AOD.$ Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc6630621978E5872E48BFD47B2AE294EF_1_1709804802.png
answer:
  type: number
  value: "62"
solution: |
  Вписанный угол $ACB$ опирается на дугу $AB$, центральный угол вдвое больше:
  $\angle AOB=2\cdot 59°=118°$.
  Точки $B$, $O$, $D$ лежат на одной прямой, поэтому углы $AOB$ и $AOD$
  смежные: $\angle AOD=180°-118°=62°$.
