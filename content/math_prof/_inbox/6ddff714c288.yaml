statement: |
  Найдите точку максимума функции $y=0,5x^{2}-21x+110\cdot \ln x+43$ .
image: null
answer:
  type: number
  value: "10"
solution: |
  Найдём производную: $y' = x - 21 + \frac{110}{x}$. Приравняем её к нулю: $x = 10$, $x = 11$. Из этих точек условию отвечает только $x = 10$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
