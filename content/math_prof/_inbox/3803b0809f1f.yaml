statement: |
  Найдите точку минимума функции $y=x^{3}-18x^{2}+81x+17.$
image: null
answer:
  type: number
  value: "9"
solution: |
  Найдём производную: $y' = 3 x^{2} - 36 x + 81$. Приравняем её к нулю: $x = 3$, $x = 9$. Из этих точек условию отвечает только $x = 9$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
