statement: |
  Отрезки $AC$ и $BD —$ диаметры окружности
  с центром $O$ . Угол $ACB$ равен $32°$ . Найдите угол $AOD$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrcCA82F7F6591A8D46438BE8ADD54C7934_1_1537454998.png
answer:
  type: number
  value: "116"
solution: |
  Вписанный угол $ACB$ опирается на дугу $AB$, центральный вдвое больше: $\angle AOB=2\cdot 32°=64°$. Углы $AOB$ и $AOD$ смежные, потому что $BD$ — диаметр: $180°-64°=116°$.
