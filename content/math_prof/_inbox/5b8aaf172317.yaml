statement: |
  На рисунке изображён график функции вида $f(x)=kx+b$ . Найдите
  значение $f(7)$ .
  [[img:math_prof/img/xs3qstsrc83A39FA1A0F1B8194CB942D77720E7CA_1_1644585039.png]]
image: math_prof/img/xs3qstsrc83A39FA1A0F1B8194CB942D77720E7CA_1_1644585039.png
answer:
  type: number
  value: "13"
solution: |
  Прямая пересекает ось ординат в точке $-1$, значит $b=-1$.
  В точке $x=1$ значение равно $1$: $k-1=1$, откуда $k=2$.
  Тогда $f(7)=2\cdot 7-1=13$.
