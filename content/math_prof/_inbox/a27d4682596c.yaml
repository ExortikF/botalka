statement: |
  В боковой стенке высокого цилиндрического бака у самого дна закреплён кран. После его открытия вода начинает вытекать из бака, при этом высота столба воды в нём меняется по закону $H(t)=at^{2}+bt+H_{0}$ , где $H —$ высота столба воды в метрах, $H_{0}=8м —$ начальный уровень воды, $a=\frac{1}{72}м/мин^{2}$
  и $b=-\frac{2}{3}м/мин —$ постоянные, $t —$ время в минутах, прошедшее с момента открытия крана. Сколько минут вода будет вытекать из бака?
