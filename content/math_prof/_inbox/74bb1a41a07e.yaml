statement: |
  Найдите корень уравнения $\log _{3}(15-x)=\log _{3}7$ .
image: null
answer:
  type: number
  value: "8"
solution: |
  $\log _{3}(15-x) = \log _{3}7$. Логарифмы с одинаковым основанием равны, значит равны и их аргументы. Получаем $x = 8$. Проверка: подставим найденное значение в исходное уравнение — обе части совпадают.
