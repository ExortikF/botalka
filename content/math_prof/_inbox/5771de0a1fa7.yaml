statement: |
  При сближении источника и приёмника звуковых сигналов, движущихся
  в некоторой среде по прямой навстречу друг другу со скоростями $u$ и $v$
  (в м/с) соответственно, частота звукового сигнала $f$ (в Гц), регистрируемого приёмником, вычисляется по формуле $f=f_{0}\cdot \frac{c+u}{c-v}$ , где $f_{0}=160Гц —$ частота исходного сигнала, $c —$ скорость распространения сигнала в среде
  (в м/с), а $u=8м/​с$ и $v=11м/​с —$ скорости источника и приёмника относительно среды. При какой скорости распространения сигнала в среде частота сигнала в приёмнике будет равна 170 Гц? Ответ дайте в м/с.
