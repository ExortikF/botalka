statement: |
  Через среднюю линию основания треугольной призмы, объём которой равен 52, проведена плоскость, параллельная боковому ребру. Найдите объём отсечённой треугольной призмы.
image: math_prof/img/xs3qstsrc950B6A23798C85084A0BBB5BD80111B6_1_1509374216.png
answer:
  type: number
  value: "13"
solution: |
  Средняя линия отсекает треугольник, подобный основанию с коэффициентом
  $\frac{1}{2}$, поэтому его площадь в $4$ раза меньше. Высота у призм общая,
  значит и объём меньше в $4$ раза: $52:4=13$.
