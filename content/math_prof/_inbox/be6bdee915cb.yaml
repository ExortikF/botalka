statement: |
  Водолазный колокол, содержащий $υ=2$ моль воздуха объёмом $V_{1}=120л$ , медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного объёма $V_{2}$ (в л). Работа A (в Дж), совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{V_{1}}{V_{2}}$ ,
  где $α=8,7\frac{Дж}{моль\cdot К}$ — постоянная, $T=300К$ — температура воздуха. Найдите, какой объём $V_{2}$ будет занимать воздух в колоколе, если при сжатии воздуха была совершена работа в 10 440 Дж. Ответ дайте в литрах.
image: null
answer:
  type: number
  value: "30"
solution: |
  Подставим величины: $5220\log_{2}\frac{120}{V_2}=10440$, откуда $\log_{2}\frac{120}{V_2}=2$. Значит $\frac{120}{V_2}=4$ и $V_2=30$.
