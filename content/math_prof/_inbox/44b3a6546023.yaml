statement: |
  Отрезки $AC$ и $BD —$ диаметры окружности
  с центром $O$ . Угол $AOD$ равен $16°$ . Найдите вписанный угол $ACB$ . Ответ дайте в градусах.
image: math_prof/img/xs3qstsrc1FF0838C507187FC4AC8764F62EB61F9_1_1509372825.png
answer:
  type: number
  value: "82"
solution: |
  Углы $AOD$ и $AOB$ смежные, так как $BD$ — диаметр:
  $\angle AOB=180°-16°=164°$.
  Вписанный угол $ACB$ опирается на ту же дугу $AB$, что и центральный $AOB$,
  поэтому вдвое меньше: $\frac{164°}{2}=82°$.
