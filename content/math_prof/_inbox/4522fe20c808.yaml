statement: |
  Сила тока $I$ (в А) в электросети вычисляется по закону Ома: $I=\frac{U}{R}$ ,
  где $U —$ напряжение электросети (в В), $R —$ сопротивление подключаемого электроприбора (в Ом). Электросеть прекращает работать, если сила тока превышает 5 А. Определите, какое наименьшее сопротивление может быть
  у электроприбора, подключаемого к электросети с напряжением 220 В, чтобы электросеть продолжала работать. Ответ дайте в омах.
