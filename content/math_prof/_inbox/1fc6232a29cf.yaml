statement: |
  Автомобиль, движущийся со скоростью $v_{0}=24м/с$ , начал торможение
  с постоянным ускорением $a=3м/с^{2}$ . За $t$ секунд после начала торможения он прошёл путь $S=v_{0}t-\frac{at^{2}}{2}$ (м). Определите время, прошедшее с момента начала торможения, если известно, что за это время автомобиль проехал
  90 метров. Ответ дайте в секундах.
