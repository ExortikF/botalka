statement: |
  Стрелок стреляет по одному разу по каждой из четырёх мишеней. Вероятность попадания в мишень при каждом отдельном выстреле равна 0,3. Найдите вероятность того, что стрелок попадёт в три первые мишени и не попадёт в последнюю.
image: null
answer:
  type: number
  value: "0,0189"
solution: |
  Выстрелы независимы, поэтому вероятности перемножаются: $\frac{3}{10}^{3}\cdot(\frac{7}{10})^{1}=\frac{189}{10000}$.
