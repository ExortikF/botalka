statement: |
  Цилиндр вписан в прямоугольный параллелепипед. Радиус основания и высота цилиндра равны 2. Найдите объём параллелепипеда.
image: math_prof/img/xs3qstsrc27A98A109B8FA81546A14B7B6D4A46DB_3_1748529560.png
answer:
  type: number
  value: "32"
solution: |
  Цилиндр вписан, значит в основании параллелепипеда квадрат со стороной,
  равной диаметру: $2\cdot 2=4$. Высота параллелепипеда равна высоте цилиндра.
  Объём: $4\cdot 4\cdot 2=32$.
