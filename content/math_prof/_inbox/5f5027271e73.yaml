statement: |
  Стрелок стреляет по одному разу в каждую из четырёх мишеней. Вероятность попадания в мишень при каждом отдельном выстреле равна 0,8. Найдите вероятность того, что стрелок попадёт в три первые мишени
  и не попадёт в последнюю.
image: null
answer:
  type: number
  value: "0,1024"
solution: |
  Выстрелы независимы, поэтому вероятности перемножаются: $\frac{4}{5}^{3}\cdot(\frac{1}{5})^{1}=\frac{64}{625}$.
