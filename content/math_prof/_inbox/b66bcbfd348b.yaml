statement: |
  Найдите точку максимума функции $y=17+27x-2x^{\frac{3}{2}}.$
image: null
answer:
  type: number
  value: "81"
solution: |
  Найдём производную: $y' = 27 - 3 \sqrt{x}$. Приравняем её к нулю: $x = 81$. Слева от точки функция возрастает, справа убывает — это точка максимума.
