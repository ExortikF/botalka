  Автомобиль разгоняется на прямолинейном участке шоссе с постоянным ускорением $a=2500км/​ч^{2}​.$ Скорость $v$ (в км/ч) вычисляется по формуле $v=\sqrt{2la},$ где $l$ — пройденный автомобилем путь (в км). Найдите, сколько километров проедет автомобиль к моменту, когда он разгонится до скорости 50 км/ч.
