statement: |
  Перед отправкой тепловоз издал гудок с частотой $f_{0}=192Гц$ . Чуть позже гудок издал подъезжающий к платформе тепловоз. Из-за эффекта Доплера частота второго гудка $f$ (в Гц) больше первого: она зависит от скорости тепловоза $v$ (в м/с) по закону $f(v)=\frac{f_{0}}{1-\frac{v}{c}}$ (Гц), где $c —$ скорость звука (в м/с). Человек, стоящий на платформе, различает сигналы по тону, если они отличаются не менее чем на 8 Гц. Определите, с какой минимальной скоростью приближался к платформе тепловоз, если человек смог различить сигналы, а $c=300м/с$ . Ответ дайте в $м/с$ .
