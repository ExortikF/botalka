statement: |
  Водолазный колокол, содержащий $υ=7$ моль воздуха объёмом $V_{1}=64л$ , медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного объёма $V_{2}$ (в л). Работа, совершаемая
  водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{V_{1}}{V_{2}}$ ,
  где $α=5,8\frac{Дж}{моль\cdot К} —$ постоянная, $T=300К —$ температура воздуха. Найдите, какой объём $V_{2}$ будет занимать воздух в колоколе, если при сжатии воздуха была совершена работа в 36 540 Дж. Ответ дайте в литрах.
image: null
answer:
  type: number
  value: "8"
solution: |
  Подставим величины: $12180\log_{2}\frac{64}{V_2}=36540$, откуда $\log_{2}\frac{64}{V_2}=3$. Значит $\frac{64}{V_2}=8$ и $V_2=8$.
