statement: |
  Найдите точку максимума функции $y=4+27x-x^{\frac{3}{2}}.$
image: null
answer:
  type: number
  value: "324"
solution: |
  Найдём производную: $y' = 27 - \frac{3 \sqrt{x}}{2}$. Приравняем её к нулю: $x = 324$. Слева от точки функция возрастает, справа убывает — это точка максимума.
