statement: |
  Найдите точку минимума функции $y=x^{3}-12x^{2}+36x+17.$
image: null
answer:
  type: number
  value: "6"
solution: |
  Найдём производную: $y' = 3 x^{2} - 24 x + 36$. Приравняем её к нулю: $x = 2$, $x = 6$. Из этих точек условию отвечает только $x = 6$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
