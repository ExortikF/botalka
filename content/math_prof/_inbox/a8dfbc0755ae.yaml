statement: |
  В телевизоре ёмкость высоковольтного конденсатора $C=5\cdot 10^{-6}Ф.$ Параллельно с конденсатором подключён резистор с сопротивлением $R=3\cdot 10^{6}Ом.$ Во время работы телевизора напряжение на конденсаторе $U_{0}=32кВ.$ После выключения телевизора напряжение на конденсаторе убывает до значения [[img:math_prof/img/xs3qstsrcA9078EF0F248816049C8A9E715419B9A_1_1770646954.png]] (в киловольтах) за время (в секундах), определяемое выражением $t=αRC\log _{2}\frac{U_{0}}{U}$ , где $α=1,5$ — постоянная. Определите напряжение на конденсаторе, если после выключения телевизора прошло
  90 секунд. Ответ дайте в киловольтах.
