statement: |
  В четырёхугольник $ABCD,$ периметр которого равен 22, вписана окружность, $AB=8.$ Найдите длину стороны $CD.$
image: math_prof/img/xs3qstsrcEE017601214CA38B4C39D5CE53BD946A_1_1765457085.png
answer:
  type: number
  value: "3"
solution: |
  Суммы противоположных сторон равны, и каждая из них — половина периметра: $22:2=11$. Значит искомая сторона равна $11-8=3$.
