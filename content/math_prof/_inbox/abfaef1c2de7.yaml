statement: |
  В ходе распада радиоактивного изотопа его масса уменьшается по закону $m=m_{0}\cdot 2^{-\frac{t}{T}}$ , где $m_{0} —$ начальная масса изотопа, $t —$ время, прошедшее от начального момента, $T —$ период полураспада. В начальный момент времени масса изотопа 100 мг. Период его полураспада составляет 2 мин. Найдите, через сколько минут масса изотопа будет равна 12,5 мг.
