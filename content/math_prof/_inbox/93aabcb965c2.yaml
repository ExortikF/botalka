statement: |
  Найдите наибольшее значение функции
  $y=10\sin x-\frac{36x}{π}+7$
  на отрезке $[-\frac{5π}{6};0]$ .
image: null
answer:
  type: number
  value: "32"
solution: |
  Производная: $y' = 10 \cos{\left(x \right)} - \frac{36}{\pi}$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{5π}{6}; 0]$. Наибольшее значение достигается при $x = -2.61799387799149$ и равно $2.0 + \frac{94.2477796076938}{\pi}$.
