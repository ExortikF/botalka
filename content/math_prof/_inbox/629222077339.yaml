statement: |
  Водолазный колокол, содержащий $υ=8$ моль воздуха при давлении
  $p_{1}=20$ атмосфер, медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного давления $p_{2}$ (в атмосферах). Работа, совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{p_{2}}{p_{1}}$ , где $α=5,8\frac{Дж}{моль\cdot K} —$ постоянная, $T=300K —$ температура воздуха. Найдите давление $p_{2}$ воздуха в колоколе,
  если при сжатии воздуха была совершена работа в 27 840 Дж.
  Ответ дайте в атмосферах.
