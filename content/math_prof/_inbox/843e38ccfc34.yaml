id: fipi_843e38ccfc34
subject: math_prof
task_type: 12
difficulty: 3
statement: |
  Найдите наименьшее значение функции
  $y=10\cos x+\frac{36x}{π}-6$
  на отрезке $[-\frac{2π}{3};0]$ .
image: null
answer:
  type: number
  value: "-35"
solution: |
  Производная: $y' = - 10 \sin{\left(x \right)} + \frac{36}{\pi}$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{2π}{3}; 0]$. Наименьшее значение достигается при $x = -2.0943951023932$ и равно $- \frac{75.398223686155}{\pi} - 11.0$.
