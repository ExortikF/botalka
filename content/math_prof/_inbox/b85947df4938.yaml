statement: |
  К источнику с ЭДС $ε=180В$ и внутренним сопротивлением $r=1Ом$ хотят подключить нагрузку с сопротивлением $R$ (в Ом). Напряжение (в В) на этой нагрузке вычисляется по формуле $U=\frac{εR}{R+r}$ . При каком значении сопротивления нагрузки напряжение на ней будет равно $170В$ ? Ответ дайте в омах.
