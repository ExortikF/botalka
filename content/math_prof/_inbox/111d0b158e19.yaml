statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}.$ Найдите значение $f(-3).$
  [[img:math_prof/img/xs3qstsrc111D0B158E19BD894F1216BEDC9C4518_5_1721135912.png]]
image: math_prof/img/xs3qstsrc111D0B158E19BD894F1216BEDC9C4518_5_1721135912.png
answer:
  type: number
  value: "64"
solution: |
  График проходит через точку $(-1;4)$, значит $a^{-1}=4$ и $a=\frac{1}{4}$.
  Тогда $f(-3)=\left(\frac{1}{4}\right)^{-3}=4^{3}=64$.
