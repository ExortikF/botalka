statement: |
  Четырёхугольник $ABCD$ вписан в окружность. Угол $ABD$ равен $62°,$ угол $CAD$ равен $41°.$ Найдите угол $ABC.$ Ответ дайте в градусах.
image: math_prof/img/xs3qstsrcD332420C313EA536401E05824A6BEE8D_1_1699351078.png
answer:
  type: number
  value: "103"
solution: |
  Углы $DBC$ и $CAD$ опираются на одну дугу $DC$, значит $\angle DBC=41°$. Угол $ABC$ складывается из двух: $62°+41°=103°$.
