subject: math_prof
task_type: 3
difficulty: 3
statement: |
  Найдите объём многогранника, вершинами которого являются вершины $A$ , $B$ , $C$ , $C_{1}$ правильной треугольной призмы $ABCA_{1}B_{1}C_{1}$ , площадь основания которой равна 6, а боковое ребро равно 9.
image: math_prof/img/xs3qstsrc31C6B63D6C22848746013402B1A72A54_1_1512575080.png
answer:
  type: number
  value: "18"
solution: |
  Многогранник $ABCC_{1}$ — пирамида с основанием $ABC$ и вершиной $C_{1}$.
  Боковое ребро призмы перпендикулярно основанию, поэтому оно и есть высота.
  $V=\frac{1}{3}\cdot 6\cdot 9=18$.
