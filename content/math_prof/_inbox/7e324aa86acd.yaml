statement: |
  Автомобиль, движущийся со скоростью $v_{0}=15м/с,$ начал торможение с постоянным ускорением $a=2м/с^{2}​.$ За $t$ секунд после начала торможения он прошёл путь $S=v_{0}t-\frac{at^{2}}{2}$ (м). Определите время, прошедшее с момента начала торможения, если известно, что за это время автомобиль проехал 36 метров. Ответ дайте в секундах.
