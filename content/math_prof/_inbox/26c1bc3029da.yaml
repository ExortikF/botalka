id: fipi_26c1bc3029da
subject: math_prof
task_type: 3
difficulty: 3
statement: |
  Найдите объём многогранника, вершинами которого являются
  вершины $A$ , $B$ , $C$ , $D$ , $B_{1}$ прямоугольного параллелепипеда $ABCDA_{1}B_{1}C_{1}D_{1}$ , у которого $AB=9$ , $BC=3$ , $BB_{1}=8$ .
image: math_prof/img/xs3qstsrc5BE76882372DA34A4D57257A6E6CEC35_1_1512579787.png
answer:
  type: number
  value: "72"
solution: |
  Это пирамида с основанием $ABCD$ и вершиной $B_{1}$. Площадь основания
  $9\cdot 3=27$, высота равна ребру $BB_{1}=8$.
  $V=\frac{1}{3}\cdot 27\cdot 8=72$.
