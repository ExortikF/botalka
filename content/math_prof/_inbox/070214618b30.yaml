statement: |
  Найдите наибольшее значение функции
  $y=\ln (x+9)^{5}-5x$
  на отрезке $[-8,5;0]$ .
image: null
answer:
  type: number
  value: "40"
solution: |
  Производная: $y' = \frac{5 \left(- x - 8\right)}{x + 9}$. Нули производной: $x = -8$. Значение сравниваем в критических точках и на концах отрезка $[-8,5; 0]$. Наибольшее значение достигается при $x = -8$ и равно $40$.
