statement: |
  Для нагревательного элемента некоторого прибора экспериментально была получена зависимость температуры (в К) от времени работы:
  $T(t)=T_{0}+bt+at^{2}​,$
  где $t —$ время (в мин.), $T_{0}=1600К$ , $a=-5К/мин^{2}​, b=105К/мин$ . Известно, что при температуре нагревательного элемента свыше 1870 К прибор может испортиться, поэтому его нужно отключить. Найдите, через какое наибольшее время после начала работы нужно отключить прибор. Ответ дайте в минутах.
