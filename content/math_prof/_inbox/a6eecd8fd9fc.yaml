statement: |
  Локатор батискафа, равномерно погружающегося вертикально вниз, испускает ультразвуковые импульсы частотой 299 МГц. Скорость погружения батискафа $v$ (в м/с) вычисляется по формуле $v=с\cdot \frac{f-f_{0}}{f+f_{0}},$
  где $c=1500м/​с —$ скорость звука в воде, [[img:math_prof/img/xs3qstsrcE72B0F568F7286DB42D1A27EF7AA70BB_1_1643794644.png]] $—$ частота испускаемых импульсов (в МГц), [[img:math_prof/img/xs3qstsrcE72B0F568F7286DB42D1A27EF7AA70BB_2_1643794644.png]] $—$ частота отражённого от дна сигнала (в МГц), регистрируемая приёмником. Определите частоту отражённого сигнала,
  если скорость погружения батискафа равна 5 м/с. Ответ дайте в МГц.
