statement: |
  Перед отправкой тепловоз издал гудок с частотой $f_{0}=295Гц$ . Чуть позже гудок издал подъезжающий к платформе такой же тепловоз. Из-за эффекта Доплера частота второго гудка $f$ (в Гц) больше первого: она зависит
  от скорости тепловоза $v$ (в м/с) и изменяется по закону $f(v)=\frac{f_{0}}{1-\frac{v}{c}}$ (Гц),
  где $c —$ скорость звука (в м/с). Человек, стоящий на платформе, различает сигналы по тону, если они отличаются не менее чем на 5 Гц. Определите,
  с какой минимальной скоростью приближался к платформе тепловоз,
  если человек смог различить сигналы, а $c=300м/с.$ Ответ дайте в $м/с.$
