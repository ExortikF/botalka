statement: |
  Найдите точку максимума функции $y=x^{3}+30x^{2}+225x+23.$
image: null
answer:
  type: number
  value: "-15"
solution: |
  Найдём производную: $y' = 3 x^{2} + 60 x + 225$. Приравняем её к нулю: $x = -15$, $x = -5$. Из этих точек условию отвечает только $x = -15$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
