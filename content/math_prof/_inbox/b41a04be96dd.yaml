statement: |
  Найдите точку максимума функции $y=x^{3}-300x+5.$
image: null
answer:
  type: number
  value: "-10"
solution: |
  Найдём производную: $y' = 3 x^{2} - 300$. Приравняем её к нулю: $x = -10$, $x = 10$. Из этих точек условию отвечает только $x = -10$: слева и справа от неё функция ведёт себя так, как нужно для точки максимума.
