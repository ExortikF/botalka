statement: |
  Локатор батискафа, равномерно погружающегося вертикально вниз, испускает ультразвуковые импульсы частотой 185 МГц. Скорость погружения батискафа $v$ (в м/с) вычисляется по формуле [[img:math_prof/img/xs3qstsrc1D6DAA68528EAE534F4573257B736205_1_1676461229.png]] ,
  где $c=1500м/​с —$ скорость звука в воде, [[img:math_prof/img/xs3qstsrc1D6DAA68528EAE534F4573257B736205_2_1676461229.png]] $—$ частота испускаемых импульсов (в МГц), [[img:math_prof/img/xs3qstsrc1D6DAA68528EAE534F4573257B736205_3_1676461229.png]] $—$ частота отражённого от дна сигнала (в МГц), регистрируемая приёмником. Определите частоту отражённого сигнала, если скорость погружения батискафа равна 20 м/с. Ответ дайте в МГц.
