statement: |
  Для получения на экране увеличенного изображения лампочки в лаборатории используется собирающая линза с фокусным расстоянием $f=36$ см. Расстояние $d_{1}$ от линзы до лампочки может изменяться в пределах от 30 см до 50 см, а расстояние $d_{2}$ от линзы до экрана $—$ в пределах от 160 см до 180 см. Изображение на экране будет чётким, если выполнено соотношение
  $\frac{1}{d_{1}}+\frac{1}{d_{2}}=\frac{1}{f}$ .
  На каком наименьшем расстоянии от линзы нужно поместить лампочку, чтобы её изображение на экране было чётким? Ответ дайте в сантиметрах.
