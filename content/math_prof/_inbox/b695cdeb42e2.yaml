statement: |
  В розетку электросети подключена электрическая духовка, сопротивление которой составляет $R_{1}=21$ Ом. Параллельно с ней в розетку предполагается подключить тостер, сопротивление которого $R_{2}$ (в Ом). При параллельном соединении двух электроприборов с сопротивлениями $R_{1}$ и $R_{2}$ их общее сопротивление $R$ вычисляется по формуле $R=\frac{R_{1}R_{2}}{R_{1}+R_{2}}$ . Для нормального функционирования электросети общее сопротивление в ней должно быть
  не меньше 18 Ом. Определите наименьшее возможное сопротивление тостера. Ответ дайте в омах.
