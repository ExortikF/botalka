statement: |
  На рисунке изображён график функции вида $f(x)=a^{x}​.$ Найдите значение $f(4).$
  [[img:math_prof/img/xs3qstsrc6EA9FEC6638BAE5C488CA5E77843141D_5_1721136101.png]]
image: math_prof/img/xs3qstsrc6EA9FEC6638BAE5C488CA5E77843141D_5_1721136101.png
answer:
  type: number
  value: "16"
solution: |
  График проходит через точку $(1;2)$, поэтому $a=2$.
  Тогда $f(4)=2^{4}=16$.
