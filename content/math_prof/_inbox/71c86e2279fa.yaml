statement: |
  Автоматическая линия изготавливает батарейки. Вероятность того,
  что готовая батарейка неисправна, равна 0,01. Перед упаковкой каждая батарейка проходит систему контроля качества. Вероятность того,
  что система забракует неисправную батарейку, равна 0,94. Вероятность того, что система по ошибке забракует исправную батарейку, равна 0,04. Найдите вероятность того, что случайно выбранная изготовленная батарейка будет забракована системой контроля.
