statement: |
  Найдите точку максимума функции $y=15+24x-x^{\frac{3}{2}}.$
image: null
answer:
  type: number
  value: "256"
solution: |
  Найдём производную: $y' = 24 - \frac{3 \sqrt{x}}{2}$. Приравняем её к нулю: $x = 256$. Слева от точки функция возрастает, справа убывает — это точка максимума.
