statement: |
  Для определения эффективной температуры звёзд используют закон Стефана–Больцмана, согласно которому $P=σST^{4}​,$ где $P$ — мощность излучения звезды (в Вт), $σ=5,7\cdot 10^{-8}\frac{Вт}{м^{2}\cdot К^{4}}$ — постоянная, $S$ — площадь поверхности звезды (в $м^{2}$ ), а $T$ — температура (в кельвинах). Известно, что площадь поверхности некоторой звезды равна $\frac{1}{2401}\cdot 10^{22}м^{2}​,$ а мощность её излучения равна $5,7\cdot 10^{26}Вт.$ Найдите температуру этой звезды. Ответ дайте в кельвинах.
