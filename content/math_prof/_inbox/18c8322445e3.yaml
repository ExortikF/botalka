statement: |
  Найдите точку минимума функции $y=x^{3}-14x^{2}+49x+3.$
image: null
answer:
  type: number
  value: "7"
solution: |
  Найдём производную: $y' = 3 x^{2} - 28 x + 49$. Приравняем её к нулю: $x = \frac{7}{3}$, $x = 7$. Из этих точек условию отвечает только $x = 7$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
