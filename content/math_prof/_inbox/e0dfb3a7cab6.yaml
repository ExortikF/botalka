statement: |
  Найдите наибольшее значение функции
  $y=10\sin x-\frac{42x}{π}-12$
  на отрезке $[-\frac{5π}{6};0]$ .
image: null
answer:
  type: number
  value: "18"
solution: |
  Производная: $y' = 10 \cos{\left(x \right)} - \frac{42}{\pi}$. Производная в нуль не обращается, значит функция монотонна. Значение сравниваем в критических точках и на концах отрезка $[-\frac{5π}{6}; 0]$. Наибольшее значение достигается при $x = -2.61799387799149$ и равно $-17.0 + \frac{109.955742875643}{\pi}$.
