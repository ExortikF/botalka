statement: |
  В треугольнике $ABC$ угол $C$ равен $90°$ , $AB=10$ , $BC=\sqrt{19}$ . Найдите $\cos A$ .
image: math_prof/img/xs3qstsrcB3F8CC4C3D5CA7194B8FC7EA12D13DAB_1_1478531278.png
answer:
  type: number
  value: "0,9"
solution: |
  Треугольник прямоугольный, поэтому по теореме Пифагора
  $AC=\sqrt{AB^{2}-BC^{2}}=\sqrt{100-19}=9$.
  Косинус острого угла — отношение прилежащего катета к гипотенузе:
  $\cos A=\frac{AC}{AB}=\frac{9}{10}=0{,}9$.
