statement: |
  В четырёхугольник $ABCD,$ периметр которого равен 30, вписана окружность, $AB=9.$ Найдите длину стороны $CD.$
image: math_prof/img/xs3qstsrc0E0989FD1850A5C54CC710B3FFA8FD88_1_1765457061.png
answer:
  type: number
  value: "6"
solution: |
  Суммы противоположных сторон равны, и каждая из них — половина периметра: $30:2=15$. Значит искомая сторона равна $15-9=6$.
