statement: |
  Водолазный колокол, содержащий [[img:math_prof/img/xs3qstsrc6996984CE7A19D334BE2596052464023_1_1770375465.png]] моль воздуха при давлении
  $p_{1}=11$ атмосфер, медленно опускают на дно водоёма. При этом происходит изотермическое сжатие воздуха до конечного давления $p_{2}$ (в атмосферах). Работа, совершаемая водой при сжатии воздуха, вычисляется по формуле $A=αυT\log _{2}\frac{p_{2}}{p_{1}}$ , где $α=5,8\frac{Дж}{моль\cdot K} —$ постоянная, $T=300K —$ температура воздуха. Найдите давление $p_{2}$ воздуха в колоколе,
  если при сжатии воздуха была совершена работа в 26 100 Дж.
  Ответ дайте в атмосферах.
