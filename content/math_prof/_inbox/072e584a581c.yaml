difficulty: 3
statement: |
  На рисунке изображены график функции $y=f(x)$ и касательная к нему
  в точке с абсциссой $x_{0}.$ Найдите значение производной функции $f(x)$
  в точке $x_{0}.$
  [[img:math_prof/img/xs3qstsrc96A1CCD4FC1A9FED47689887747631F0_1_1638185246.png]]
image: math_prof/img/xs3qstsrc96A1CCD4FC1A9FED47689887747631F0_1_1638185246.png
answer:
  type: number
  value: "-0,4"
solution: |
  Значение производной в точке касания равно угловому коэффициенту касательной.
  По клеткам видно: при сдвиге на $5$ вправо касательная опускается на $2$,
  поэтому $f'(x_{0})=-\frac{2}{5}=-0{,}4$.
