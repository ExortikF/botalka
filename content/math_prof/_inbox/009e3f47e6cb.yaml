statement: |
  Найдите точку минимума функции $y=x^{2}-28x+96\cdot \ln x+31$ .
image: null
answer:
  type: number
  value: "8"
solution: |
  Найдём производную: $y' = 2 x - 28 + \frac{96}{x}$. Приравняем её к нулю: $x = 6$, $x = 8$. Из этих точек условию отвечает только $x = 8$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
