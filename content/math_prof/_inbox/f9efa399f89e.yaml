statement: |
  Найдите точку минимума функции $y=x^{3}-20x^{2}+100x+23.$
image: null
answer:
  type: number
  value: "10"
solution: |
  Найдём производную: $y' = 3 x^{2} - 40 x + 100$. Приравняем её к нулю: $x = \frac{10}{3}$, $x = 10$. Из этих точек условию отвечает только $x = 10$: слева и справа от неё функция ведёт себя так, как нужно для точки минимума.
