statement: |
  Длины векторов $\overrightarrow{a}$ и $\overrightarrow{b}$ равны 3 и 7, а угол между ними равен $60°.$ Найдите скалярное произведение $\overrightarrow{a}\cdot \overrightarrow{b}.$
image: null
answer:
  type: number
  value: "10,5"
solution: |
  Скалярное произведение равно произведению длин на косинус угла: $3 \cdot 7 \cdot \cos 60° = \frac{21}{2}$.
