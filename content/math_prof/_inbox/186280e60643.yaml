id: fipi_186280e60643
subject: math_prof
task_type: 10
difficulty: 3
statement: |
  Первые 120 км автомобиль ехал со скоростью 60 км/ч, следующие 200 км — со скоростью 100 км/ч, а затем 160 км — со скоростью 120 км/ч. Найдите среднюю скорость автомобиля на протяжении всего пути. Ответ дайте в км/ч.
image: null
answer:
  type: number
  value: "90"
solution: |
  Весь путь: $120+200+160=480$ км.
  Время по участкам: $\frac{120}{60}+\frac{200}{100}+\frac{160}{120}=2+2+\frac{4}{3}=\frac{16}{3}$ ч.
  Средняя скорость: $480:\frac{16}{3}=90$ км/ч.
