statement: |
  Найдите наименьшее значение функции
  $y=12x-\ln (12x)+4$
  на отрезке $[\frac{1}{24};\frac{5}{24}]$ .
image: null
answer:
  type: number
  value: "5"
solution: |
  Производная: $y' = 12 - \frac{1}{x}$. Нули производной: $x = \frac{1}{12}$. Значение сравниваем в критических точках и на концах отрезка $[\frac{1}{24}; \frac{5}{24}]$. Наименьшее значение достигается при $x = \frac{1}{12}$ и равно $5$.
