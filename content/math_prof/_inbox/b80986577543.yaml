statement: |
  В телевизоре ёмкость высоковольтного конденсатора $C=8\cdot 10^{-6}Ф.$ Параллельно с конденсатором подключён резистор с сопротивлением $R=5\cdot 10^{6}Ом.$ Во время работы телевизора напряжение на конденсаторе $U_{0}=56кВ.$ После выключения телевизора напряжение на конденсаторе убывает до значения [[img:math_prof/img/xs3qstsrc864226CD8C2FA2E240099D9A82E9D0C7_1_1770117284.png]] (в киловольтах) за время (в секундах), определяемое выражением $t=αRC\log _{2}\frac{U_{0}}{U}$ , где $α=1,5 —$ постоянная. Определите напряжение на конденсаторе, если после выключения телевизора прошло
  180 секунд. Ответ дайте в киловольтах.
