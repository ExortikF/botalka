statement: |
  Для нагревательного элемента некоторого прибора экспериментально была получена зависимость температуры (в К) от времени работы:
  $T(t)=T_{0}+bt+at^{2}​,$
  где $t —$ время (в мин.), $T_{0}=1380К$ , $a=-15К/мин^{2}​, b=165К/мин$ . Известно, что при температуре нагревательного элемента свыше 1800 К прибор может испортиться, поэтому его нужно отключить. Найдите, через какое наибольшее время после начала работы нужно отключить прибор. Ответ дайте в минутах.
