id: fipi_0b98089a8054
subject: math_prof
task_type: 9
difficulty: 3
statement: |
  Расстояние от наблюдателя, находящегося на небольшой высоте $h$
  (в километрах) над землёй, до наблюдаемой им линии горизонта вычисляется по формуле $l=\sqrt{2Rh},$ где $R=6400км —$ радиус Земли. С какой высоты горизонт виден на расстоянии 48 километров? Ответ дайте в километрах.
image: null
answer:
  type: number
  value: "0,18"
solution: |
  Подставим в формулу $l=\sqrt{2Rh}$ известные значения: $48=\sqrt{2\cdot 6400\cdot h}$.
  Возведём обе части в квадрат: $2304=12800h$, откуда $h=0{,}18$ км.
