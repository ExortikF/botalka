statement: |
  Около конуса описана сфера (сфера содержит окружность основания конуса и его вершину). Центр сферы находится в центре основания конуса. Радиус сферы равен $84\sqrt{2}.$ Найдите длину образующей конуса.
image: math_prof/img/xs3qstsrc279baf26e837419ea6baf5a379e242af_7_1764589710.png
answer:
  type: number
  value: "168"
solution: |
  Центр сферы лежит в центре основания, поэтому радиус основания конуса равен
  радиусу сферы, и высота конуса тоже равна радиусу сферы:
  $r=h=84\sqrt{2}$.
  Образующая: $l=\sqrt{r^{2}+h^{2}}=84\sqrt{2}\cdot \sqrt{2}=168$.
