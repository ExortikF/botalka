statement: |
  Мотоциклист, движущийся по городу со скоростью $v_{0}=60км/ч$ , выезжает из него и сразу после выезда начинает разгоняться с постоянным ускорением $a=32км/ч^{2}$ . Расстояние (в км) от мотоциклиста до города вычисляется по формуле $S=v_{0}t+\frac{at^{2}}{2}$ , где $t$ — время (в часах), прошедшее после выезда из города. Определите время, прошедшее после выезда мотоциклиста из города, если известно, что за это время он удалился от города на 154 км. Ответ дайте в минутах.
