statement: |
  Найдите корень уравнения $7x + (-9) = 6x + (-1)$.
answer:
  type: number
  value: '8'
solution: |
  Переносим: $(7-6)x = -1 - (-9)$, то есть $1x=8$, откуда $x=8$.
