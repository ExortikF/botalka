statement: |
  Найдите корень уравнения $5x + (-1) = 6x + (-3)$.
answer:
  type: number
  value: '2'
solution: |
  Переносим: $(5-6)x = -3 - (-1)$, то есть $-1x=-2$, откуда $x=2$.
