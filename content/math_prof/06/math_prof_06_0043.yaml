statement: |
  Найдите корень уравнения $\dfrac{x-5}{x+12}=0$.
answer:
  type: number
  value: '5'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-5=0$ даёт $x=5$; при этом $x+12=17\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
source:
