statement: |
  Найдите корень уравнения $\dfrac{x-3}{x+2}=0$.
answer:
  type: number
  value: '3'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-3=0$ даёт $x=3$; при этом $x+2=5\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе и ненулевом знаменателе.'
source: "собственная"
status: live
