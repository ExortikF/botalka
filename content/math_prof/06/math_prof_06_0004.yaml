statement: |
  Найдите корень уравнения $\log_{3}(2x + 65)=4$.
answer:
  type: number
  value: '8'
solution: |
  По определению логарифма $2x + 65=3^{4}=81$, откуда $x=8$. Под логарифмом $81>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
