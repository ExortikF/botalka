statement: |
  Найдите корень уравнения $8x + (-2) = 6x + (-4)$.
answer:
  type: number
  value: '-1'
solution: |
  Переносим: $(8-6)x = -4 - (-2)$, то есть $2x=-2$, откуда $x=-1$.
