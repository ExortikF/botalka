statement: |
  Найдите корень уравнения $4x + (-5) = 7x + (-17)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(4-7)x = -17 - (-5)$, то есть $-3x=-12$, откуда $x=4$.
