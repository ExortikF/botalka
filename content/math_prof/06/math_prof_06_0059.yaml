statement: |
  Найдите корень уравнения $2x + (-5) = 4x + (3)$.
answer:
  type: number
  value: '-4'
solution: |
  Переносим: $(2-4)x = 3 - (-5)$, то есть $-2x=8$, откуда $x=-4$.
