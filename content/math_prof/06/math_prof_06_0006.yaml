statement: |
  Найдите корень уравнения $\log_{5}(2x + 9)=2$.
answer:
  type: number
  value: '8'
solution: |
  По определению логарифма $2x + 9=5^{2}=25$, откуда $x=8$. Под логарифмом $25>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
