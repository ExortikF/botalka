statement: |
  Найдите корень уравнения $4x + (-9) = 8x + (-13)$.
answer:
  type: number
  value: '1'
solution: |
  Переносим: $(4-8)x = -13 - (-9)$, то есть $-4x=-4$, откуда $x=1$.
