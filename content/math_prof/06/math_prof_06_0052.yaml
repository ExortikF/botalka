statement: |
  Найдите корень уравнения $7x + (-1) = 4x + (11)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(7-4)x = 11 - (-1)$, то есть $3x=12$, откуда $x=4$.
