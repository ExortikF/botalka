subject: math_prof
task_type: 6
difficulty: 2
statement: |
  Найдите корень уравнения $\dfrac{x-2}{x+3}=0$.
answer:
  type: number
  value: '2'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-2=0$ даёт $x=2$; при этом $x+3=5\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
source:
