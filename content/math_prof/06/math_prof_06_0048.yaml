statement: |
  Найдите корень уравнения $\dfrac{x-4}{x+5}=0$.
answer:
  type: number
  value: '4'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-4=0$ даёт $x=4$; при этом $x+5=9\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
