statement: |
  Найдите корень уравнения $\log_{3}(2x - 13)=2$.
answer:
  type: number
  value: '11'
solution: |
  По определению логарифма $2x - 13=3^{2}=9$, откуда $x=11$. Под логарифмом $9>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
