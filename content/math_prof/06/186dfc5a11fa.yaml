statement: |
  Найдите корень уравнения $\log _{7}(1-x)=\log _{7}5$ .
image: null
answer:
  type: number
  value: "-4"
solution: |
  $\log _{7}(1-x) = \log _{7}5$. Логарифмы с одинаковым основанием равны, значит равны и их аргументы. Получаем $x = -4$. Проверка: подставим найденное значение в исходное уравнение — обе части совпадают.
