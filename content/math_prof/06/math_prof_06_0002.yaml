statement: |
  Найдите корень уравнения $\log_{3}(4x - 15)=2$.
answer:
  type: number
  value: '6'
solution: |
  По определению логарифма $4x - 15=3^{2}=9$, откуда $x=6$. Под логарифмом $9>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
