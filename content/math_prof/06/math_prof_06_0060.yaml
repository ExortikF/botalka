statement: |
  Найдите корень уравнения $4x + (3) = 9x + (-17)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(4-9)x = -17 - (3)$, то есть $-5x=-20$, откуда $x=4$.
