statement: |
  Найдите корень уравнения $7x + (8) = 8x + (11)$.
answer:
  type: number
  value: '-3'
solution: |
  Переносим: $(7-8)x = 11 - (8)$, то есть $-1x=3$, откуда $x=-3$.
