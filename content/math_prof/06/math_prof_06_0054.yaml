statement: |
  Найдите корень уравнения $7x + (-1) = 5x + (7)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(7-5)x = 7 - (-1)$, то есть $2x=8$, откуда $x=4$.
