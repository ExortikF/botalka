statement: |
  Найдите корень уравнения $8x + (8) = 6x + (6)$.
answer:
  type: number
  value: '-1'
solution: |
  Переносим: $(8-6)x = 6 - (8)$, то есть $2x=-2$, откуда $x=-1$.
