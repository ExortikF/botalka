statement: |
  Найдите корень уравнения $5x + (10) = 7x + (22)$.
answer:
  type: number
  value: '-6'
solution: |
  Переносим: $(5-7)x = 22 - (10)$, то есть $-2x=12$, откуда $x=-6$.
