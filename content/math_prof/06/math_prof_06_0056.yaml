statement: |
  Найдите корень уравнения $8x + (0) = 7x + (-2)$.
answer:
  type: number
  value: '-2'
solution: |
  Переносим: $(8-7)x = -2 - (0)$, то есть $1x=-2$, откуда $x=-2$.
