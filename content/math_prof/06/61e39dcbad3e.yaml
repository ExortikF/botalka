solution: |
  $(\frac{1}{4})^{x-5} = \frac{1}{16}$. Приведём правую часть к тому же основанию и приравняем показатели. Получаем $x = 7$. Проверка: подставим найденное значение в исходное уравнение — обе части совпадают.
