statement: |
  Найдите корень уравнения $5x + (1) = 9x + (13)$.
answer:
  type: number
  value: '-3'
solution: |
  Переносим: $(5-9)x = 13 - (1)$, то есть $-4x=12$, откуда $x=-3$.
