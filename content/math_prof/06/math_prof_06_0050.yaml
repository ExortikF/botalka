statement: |
  Найдите корень уравнения $4x + (4) = 5x + (5)$.
answer:
  type: number
  value: '-1'
solution: |
  Переносим: $(4-5)x = 5 - (4)$, то есть $-1x=1$, откуда $x=-1$.
