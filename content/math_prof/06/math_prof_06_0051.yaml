statement: |
  Найдите корень уравнения $6x + (10) = 7x + (7)$.
answer:
  type: number
  value: '3'
solution: |
  Переносим: $(6-7)x = 7 - (10)$, то есть $-1x=-3$, откуда $x=3$.
