statement: |
  Найдите корень уравнения $4x + (-2) = 7x + (-5)$.
answer:
  type: number
  value: '1'
solution: |
  Переносим: $(4-7)x = -5 - (-2)$, то есть $-3x=-3$, откуда $x=1$.
