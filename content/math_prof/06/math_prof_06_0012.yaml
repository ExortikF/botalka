statement: |
  Найдите корень уравнения $\log_{2}(2x - 8)=2$.
answer:
  type: number
  value: '6'
solution: |
  По определению логарифма $2x - 8=2^{2}=4$, откуда $x=6$. Под логарифмом $4>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
