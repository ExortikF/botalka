statement: |
  Найдите корень уравнения $\dfrac{x-14}{x+7}=0$.
answer:
  type: number
  value: '14'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-14=0$ даёт $x=14$; при этом $x+7=21\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
source:
