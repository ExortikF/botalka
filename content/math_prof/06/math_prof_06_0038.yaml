statement: |
  Найдите корень уравнения $\dfrac{x-9}{x+2}=0$.
answer:
  type: number
  value: '9'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-9=0$ даёт $x=9$; при этом $x+2=11\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
source:
