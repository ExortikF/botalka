statement: |
  Найдите корень уравнения $4x + (1) = 6x + (-7)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(4-6)x = -7 - (1)$, то есть $-2x=-8$, откуда $x=4$.
