statement: |
  Найдите корень уравнения $5x + (-2) = 4x + (6)$.
answer:
  type: number
  value: '8'
solution: |
  Переносим: $(5-4)x = 6 - (-2)$, то есть $1x=8$, откуда $x=8$.
