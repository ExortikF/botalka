statement: |
  Найдите корень уравнения $\log_{2}(2x + 8)=4$.
answer:
  type: number
  value: '4'
solution: |
  По определению логарифма $2x + 8=2^{4}=16$, откуда $x=4$. Под логарифмом $16>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
