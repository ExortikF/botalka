statement: |
  Найдите корень уравнения $\log_{5}(2x + 107)=3$.
answer:
  type: number
  value: '9'
solution: |
  По определению логарифма $2x + 107=5^{3}=125$, откуда $x=9$. Под логарифмом $125>0$ — ОДЗ выполнено.
hints:
  - 'Перейдите от логарифма к показательному виду.'
  - 'Проверьте ОДЗ: под логарифмом должно быть положительное число.'
