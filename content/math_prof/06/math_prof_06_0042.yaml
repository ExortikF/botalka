statement: |
  Найдите корень уравнения $\dfrac{x-13}{x+2}=0$.
answer:
  type: number
  value: '13'
solution: |
  Дробь равна нулю, когда числитель равен нулю, а знаменатель — нет. $x-13=0$ даёт $x=13$; при этом $x+2=15\neq 0$.
hints:
  - 'Дробь равна нулю только при нулевом числителе.'
