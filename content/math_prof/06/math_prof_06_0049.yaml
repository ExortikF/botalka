statement: |
  Найдите корень уравнения $4x + (4) = 5x + (0)$.
answer:
  type: number
  value: '4'
solution: |
  Переносим: $(4-5)x = 0 - (4)$, то есть $-1x=-4$, откуда $x=4$.
