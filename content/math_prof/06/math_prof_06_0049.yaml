statement: |
  Найдите корень уравнения $8x + (-6) = 9x + (-14)$.
answer:
  type: number
  value: '8'
solution: |
  Переносим: $(8-9)x = -14 - (-6)$, то есть $-1x=-8$, откуда $x=8$.
