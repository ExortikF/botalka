statement: |
  Найдите корень уравнения $\log_{3}(2x-5)=2$.
answer:
  type: number
  value: '7'
solution: |
  По определению логарифма $2x-5=3^2=9$, откуда $2x=14$ и $x=7$. Проверка ОДЗ: $2\cdot 7-5=9>0$.
hints:
  - 'По определению логарифма перейдите к показательному виду.'
  - 'Не забудьте проверить ОДЗ: под логарифмом должно быть положительное число.'
source: "собственная"
