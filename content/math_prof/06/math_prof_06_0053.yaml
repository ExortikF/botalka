statement: |
  Найдите корень уравнения $8x + (-3) = 3x + (7)$.
answer:
  type: number
  value: '2'
solution: |
  Переносим: $(8-3)x = 7 - (-3)$, то есть $5x=10$, откуда $x=2$.
