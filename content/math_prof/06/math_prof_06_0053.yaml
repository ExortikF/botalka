statement: |
  Найдите корень уравнения $2x + (10) = 8x + (46)$.
answer:
  type: number
  value: '-6'
solution: |
  Переносим: $(2-8)x = 46 - (10)$, то есть $-6x=36$, откуда $x=-6$.
