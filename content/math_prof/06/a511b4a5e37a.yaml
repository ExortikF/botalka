statement: |
  Найдите корень уравнения $3^{x+6}=9^{2x}$ .
image: null
answer:
  type: number
  value: "2"
solution: |
  $3^{x+6} = 9^{2x}$. Приведём обе части к одному основанию и приравняем показатели. Получаем $x = 2$. Проверка: подставим найденное значение в исходное уравнение — обе части совпадают.
