# --- Графики: пересечение (№11) ---

0A4E95479F07B5D84EB82F8A768CB6D2:
  answer: "8"
  solution: |
    Точка $A$ имеет координаты $(-4;-2)$, поэтому $k=(-4)\cdot(-2)=8$ и
    $f(x)=\frac{8}{x}$.
    Прямая проходит через $A$ и пересекает ось ординат в точке $-1$, значит
    $b=-1$, а из $-4a-1=-2$ получаем $a=\frac{1}{4}$.
    Абсциссы точек пересечения — корни уравнения
    $\frac{8}{x}=\frac{x}{4}-1$, то есть $x^{2}-4x-32=0$: это $-4$ и $8$.
    Первый корень — точка $A$, поэтому у точки $B$ абсцисса равна $8$.
