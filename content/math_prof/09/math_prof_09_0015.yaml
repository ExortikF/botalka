difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=2+14t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $10$ метров?
answer:
  type: number
  value: '0.8'
solution: |
  Решаем $2+14t-5t^{2}=10$, то есть $5t^{2}-14t+8=0$. Корни: $0,8$ и $2$. Впервые — при меньшем, $t=0,8$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
