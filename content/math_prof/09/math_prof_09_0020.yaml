subject: math_prof
task_type: 9
difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=-8+25t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $12$ метров?
answer:
  type: number
  value: '1'
solution: |
  Решаем $-8+25t-5t^{2}=12$, то есть $5t^{2}-25t+20=0$. Корни: $1$ и $4$. Впервые — при меньшем, $t=1$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
