difficulty: 2
statement: |
  Два резистора соединены параллельно, их сопротивления равны $2$ Ом и $2$ Ом. Общее сопротивление находится по формуле $\dfrac{1}{R}=\dfrac{1}{R_1}+\dfrac{1}{R_2}$. Найдите $R$ (в омах).
answer:
  type: number
  value: '1'
solution: |
  $\dfrac{1}{R}=\dfrac{1}{2}+\dfrac{1}{2}=\dfrac{4}{4}$, откуда $R=\dfrac{4}{4}=1$.
hints:
  - 'Сначала найдите $\dfrac{1}{R}$, потом переверните дробь.'
source:
