statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=7$ А, а сопротивление $R=13$ Ом.
answer:
  type: number
  value: '637'
solution: |
  $P=7^{2}\cdot 13=49\cdot 13=637$.
