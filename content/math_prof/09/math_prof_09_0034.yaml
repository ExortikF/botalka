subject: math_prof
task_type: 9
difficulty: 2
statement: |
  Два резистора соединены параллельно, их сопротивления равны $12$ Ом и $12$ Ом. Общее сопротивление находится по формуле $\dfrac{1}{R}=\dfrac{1}{R_1}+\dfrac{1}{R_2}$. Найдите $R$ (в омах).
answer:
  type: number
  value: '6'
solution: |
  $\dfrac{1}{R}=\dfrac{1}{12}+\dfrac{1}{12}=\dfrac{24}{144}$, откуда $R=\dfrac{144}{24}=6$.
hints:
  - 'Сначала найдите $\dfrac{1}{R}$, потом переверните дробь.'
source:
