statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=2$ А, а сопротивление $R=13$ Ом.
answer:
  type: number
  value: '52'
solution: |
  $P=2^{2}\cdot 13=4\cdot 13=52$.
