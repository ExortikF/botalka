difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=-1+25t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $19$ метров?
answer:
  type: number
  value: '1'
solution: |
  Решаем $-1+25t-5t^{2}=19$, то есть $5t^{2}-25t+20=0$. Корни: $1$ и $4$. Впервые — при меньшем, $t=1$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
