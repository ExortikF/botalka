statement: |
  Высота камня меняется по закону $h(t)=-18+30t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $22$ метров?
answer:
  type: number
  value: '2'
solution: |
  Решаем $-18+30t-5t^{2}=22$, то есть $5t^{2}-30t+40=0$. Корни: $2$ и $4$. Впервые — при меньшем, $t=2$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
