subject: math_prof
task_type: 9
difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=5+20t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $20$ метров?
answer:
  type: number
  value: '1'
solution: |
  Решаем $5+20t-5t^{2}=20$, то есть $5t^{2}-20t+15=0$. Корни: $1$ и $3$. Впервые — при меньшем, $t=1$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
