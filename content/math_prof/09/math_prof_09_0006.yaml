statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=6$ А, а сопротивление $R=9$ Ом.
answer:
  type: number
  value: '324'
solution: |
  $P=6^{2}\cdot 9=36\cdot 9=324$.
