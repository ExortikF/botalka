statement: |
  Высота камня меняется по закону $h(t)=-33+35t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $27$ метров?
answer:
  type: number
  value: '3'
solution: |
  Решаем $-33+35t-5t^{2}=27$, то есть $5t^{2}-35t+60=0$. Корни: $3$ и $4$. Впервые — при меньшем, $t=3$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
