difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=-14+25t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $16$ метров?
answer:
  type: number
  value: '2'
solution: |
  Решаем $-14+25t-5t^{2}=16$, то есть $5t^{2}-25t+30=0$. Корни: $2$ и $3$. Впервые — при меньшем, $t=2$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
