statement: |
  Высота камня меняется по закону $h(t)=-81+45t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $9$ метров?
answer:
  type: number
  value: '3'
solution: |
  Решаем $-81+45t-5t^{2}=9$, то есть $5t^{2}-45t+90=0$. Корни: $3$ и $6$. Впервые — при меньшем, $t=3$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
