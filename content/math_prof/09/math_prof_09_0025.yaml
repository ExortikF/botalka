task_type: 9
difficulty: 2
statement: |
  Два резистора соединены параллельно, их сопротивления равны $4$ Ом и $4$ Ом. Общее сопротивление находится по формуле $\dfrac{1}{R}=\dfrac{1}{R_1}+\dfrac{1}{R_2}$. Найдите $R$ (в омах).
answer:
  type: number
  value: '2'
solution: |
  $\dfrac{1}{R}=\dfrac{1}{4}+\dfrac{1}{4}=\dfrac{8}{16}$, откуда $R=\dfrac{16}{8}=2$.
hints:
  - 'Сначала найдите $\dfrac{1}{R}$, потом переверните дробь.'
source:
