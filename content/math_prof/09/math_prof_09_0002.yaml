statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=9$ А, а сопротивление $R=11$ Ом.
answer:
  type: number
  value: '891'
solution: |
  $P=9^{2}\cdot 11=81\cdot 11=891$.
