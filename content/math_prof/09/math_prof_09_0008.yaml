statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=8$ А, а сопротивление $R=7$ Ом.
answer:
  type: number
  value: '448'
solution: |
  $P=8^{2}\cdot 7=64\cdot 7=448$.
