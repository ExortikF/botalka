statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=7$ А, а сопротивление $R=3$ Ом.
answer:
  type: number
  value: '147'
solution: |
  $P=7^{2}\cdot 3=49\cdot 3=147$.
