difficulty: 1
statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=2$ А, а сопротивление $R=15$ Ом.
answer:
  type: number
  value: '60'
solution: |
  $P=2^{2}\cdot 15=4\cdot 15=60$.
