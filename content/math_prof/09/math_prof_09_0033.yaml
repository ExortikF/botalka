difficulty: 2
statement: |
  Два резистора соединены параллельно, их сопротивления равны $12$ Ом и $4$ Ом. Общее сопротивление находится по формуле $\dfrac{1}{R}=\dfrac{1}{R_1}+\dfrac{1}{R_2}$. Найдите $R$ (в омах).
answer:
  type: number
  value: '3'
solution: |
  $\dfrac{1}{R}=\dfrac{1}{12}+\dfrac{1}{4}=\dfrac{16}{48}$, откуда $R=\dfrac{48}{16}=3$.
hints:
  - 'Сначала найдите $\dfrac{1}{R}$, потом переверните дробь.'
source:
