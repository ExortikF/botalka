difficulty: 3
statement: |
  Высота камня меняется по закону $h(t)=13+15t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень **впервые** окажется на высоте $23$ метров?
answer:
  type: number
  value: '1'
solution: |
  Решаем $13+15t-5t^{2}=23$, то есть $5t^{2}-15t+10=0$. Корни: $1$ и $2$. Впервые — при меньшем, $t=1$.
hints:
  - 'Составьте уравнение $h(t)$ = нужная высота.'
  - 'Корней будет два — нужен меньший.'
