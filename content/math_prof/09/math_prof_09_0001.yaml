statement: |
  Высота камня, брошенного вверх, меняется по закону $h(t)=2+14t-5t^{2}$ (высота в метрах, время в секундах). Через сколько секунд после броска камень впервые окажется на высоте $10$ метров?
answer:
  type: number
  value: '0.8'
solution: |
  Решаем $2+14t-5t^{2}=10$, то есть $5t^{2}-14t+8=0$. Дискриминант: $196-160=36$, корни $t=\dfrac{14\pm 6}{10}$, то есть $0{,}8$ и $2$. Впервые — при меньшем корне, $t=0{,}8$.
hints:
  - 'Составьте уравнение $h(t)=10$.'
  - 'Корней будет два — вопрос про первый по времени, то есть меньший.'
source: "собственная"
