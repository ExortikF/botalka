statement: |
  Мощность постоянного тока вычисляется по формуле $P=I^{2}R$. Найдите мощность (в ваттах), если сила тока $I=3$ А, а сопротивление $R=14$ Ом.
answer:
  type: number
  value: '126'
solution: |
  $P=3^{2}\cdot 14=9\cdot 14=126$.
